<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>Shogi of Speed - MODS</title>
  <style>
    :root{
      --bg:#f7f2e8; --panel:#fffaf2; --ink:#2f2618; --line:#d9c8a6;
      --good:#2ea44f; --bad:#d73a49; --btn:#fff; --shadow:0 3px 14px rgba(0,0,0,.05);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#15110d; --panel:#211914; --ink:#f2eadf; --line:#4f4031;
        --good:#3fbf61; --bad:#ff6b77; --btn:#2c231c; --shadow:0 3px 14px rgba(0,0,0,.25);
      }
    }
    html,body{
      margin:0; padding:0; background:var(--bg); color:var(--ink);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
      user-select:none; -webkit-user-select:none; overscroll-behavior:none;
    }
    body{ touch-action:manipulation; }
    #app{ max-width:980px; margin:0 auto; padding:10px; box-sizing:border-box; }
    .panel{ background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
    #topbar{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; padding:8px; margin-bottom:8px; }
    #roomInput{
      width:min(100%,280px); padding:9px 10px; border-radius:11px; border:1px solid var(--line);
      font-size:15px; background:var(--btn); color:var(--ink); outline:none; box-sizing:border-box; text-transform:uppercase;
    }
    button, textarea, input{ font:inherit; }
    button{
      padding:9px 11px; border-radius:11px; border:1px solid var(--line);
      background:var(--btn); color:var(--ink); font-size:14px; cursor:pointer;
    }
    button.primary{ background:linear-gradient(180deg,#fff3bf,#ffe08c); border-color:#d8b84a; font-weight:800; }
    button.good{ background:linear-gradient(180deg,#dff7e6,#baf0c9); border-color:var(--good); font-weight:800; }
    button.bad{ background:linear-gradient(180deg,#ffe7ea,#ffc7cf); border-color:var(--bad); font-weight:800; }
    button:disabled{ opacity:.55; cursor:not-allowed; }
    #status{ padding:8px 10px; margin-bottom:8px; line-height:1.45; font-size:13px; }
    #tabs{ display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
    .chip{
      padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:var(--btn); font-size:12px;
    }
    .chip.active{ border-color:#7aa4f5; outline:2px solid rgba(122,164,245,.2); }
    #main{ display:grid; grid-template-columns:1fr; gap:8px; }
    #gameShell,#modsShell{ min-height:480px; padding:10px; box-sizing:border-box; }
    #modsShell.hidden,#gameShell.hidden{ display:none; }
    .small{ font-size:12px; opacity:.82; line-height:1.5; }
    .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .fieldLabel{ font-size:12px; font-weight:700; margin:10px 0 6px; }
    #modsHeader{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    #modsList{ display:flex; flex-direction:column; gap:8px; }
    .modCard{
      border:1px solid var(--line); border-radius:14px; padding:10px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
      background:rgba(255,255,255,.03);
    }
    .modCard.new{ border-color:var(--good); box-shadow:0 0 0 2px rgba(46,164,79,.12) inset; }
    .modInfo{ flex:1 1 320px; min-width:0; }
    .modTitle{ font-weight:800; font-size:16px; margin-bottom:4px; word-break:break-word; }
    .modMeta{ font-size:12px; opacity:.85; line-height:1.4; word-break:break-word; }
    #editor{
      display:none; margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:16px; background:rgba(255,255,255,.03);
    }
    #editor.show{ display:block; }
    #modName,#modPrompt{
      width:100%; box-sizing:border-box; outline:none; border:1px solid var(--line); background:var(--btn); color:var(--ink);
      border-radius:12px; padding:10px 12px;
    }
    #modName{ font-size:15px; text-transform:uppercase; }
    #modPrompt{ min-height:110px; resize:vertical; line-height:1.5; font-size:14px; }
    #versions{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
    .verBtn{ border-radius:999px; padding:7px 10px; font-size:12px; }
    .verBtn.active{ border-color:#7aa4f5; outline:2px solid rgba(122,164,245,.2); }
    #previewBox{
      margin-top:10px; padding:10px; border:1px solid var(--line); border-radius:12px; background:rgba(0,0,0,.04);
      white-space:pre-wrap; line-height:1.6; font-size:14px; min-height:80px;
    }
    #gameStage{
      margin-top:10px; border:1px solid var(--line); border-radius:14px; min-height:230px;
      padding:10px; box-sizing:border-box; background:rgba(0,0,0,.03);
      white-space:pre-wrap; line-height:1.6; font-size:14px;
    }
    .tag{ display:inline-flex; align-items:center; gap:6px; padding:6px 9px; border-radius:999px; border:1px solid var(--line); background:var(--btn); font-size:12px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="panel" id="topbar">
      <input id="roomInput" maxlength="120" placeholder="ROOM CODE" autocomplete="off" />
      <button class="primary" id="enterBtn">入室 / 作成</button>
      <button id="shareBtn">コードを共有</button>
      <span class="chip" id="modeChip">GAME</span>
      <span class="chip" id="mePill">未接続</span>
    </div>

    <div class="panel" id="status">ROOM CODE を入れて「入室 / 作成」を押してね。</div>

    <div id="tabs">
      <span class="chip active" id="gameChip">GAME</span>
      <span class="chip" id="modsChip">MODS</span>
    </div>

    <div id="main">
      <div class="panel" id="gameShell">
        <div class="small">ここに将棋本体をつなぐための最小フックだけ置いてある。</div>
        <div id="gameStage"></div>
      </div>

      <div class="panel hidden" id="modsShell">
        <div id="modsHeader">
          <h2 style="margin:0;font-size:18px;">MOD制作画面</h2>
          <div class="row">
            <button class="good" id="newModBtn">+新規MOD</button>
            <button id="exportBtn">保存を書き出し</button>
          </div>
        </div>

        <div class="small">
          端末内に MOD を保存するよ。対戦コードの後ろに <b>MOD=MOD名 v2</b> みたいに付けられる。
          <br>AI ボタンは <code>/api/mod-ai</code> がある時だけ使う。なければローカルで仮更新する。
        </div>

        <div id="modsList" style="margin-top:10px;"></div>

        <div id="editor">
          <div class="row" style="justify-content:space-between; margin-bottom:10px;">
            <input id="modName" maxlength="40" placeholder="MOD名を入力…" />
            <div class="row">
              <button class="primary" id="saveModBtn">AIに作らせる / 更新</button>
              <button class="bad" id="deleteModBtn">削除</button>
              <button id="backBtn">戻る</button>
            </div>
          </div>

          <div class="fieldLabel">AIに作らせる内容 / 修正したい内容</div>
          <textarea id="modPrompt" placeholder="例: 盤面の色を少し見やすくして。CPUを強くして。"></textarea>

          <div class="fieldLabel">バージョン</div>
          <div id="versions"></div>

          <div class="fieldLabel">今のバージョンの説明</div>
          <div id="previewBox"></div>

          <div class="fieldLabel">この MOD の使い方</div>
          <div class="small" id="useExample"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);

    const el = {
      roomInput: $("roomInput"),
      enterBtn: $("enterBtn"),
      shareBtn: $("shareBtn"),
      status: $("status"),
      mePill: $("mePill"),
      modeChip: $("modeChip"),
      gameChip: $("gameChip"),
      modsChip: $("modsChip"),
      gameShell: $("gameShell"),
      modsShell: $("modsShell"),
      modsList: $("modsList"),
      editor: $("editor"),
      newModBtn: $("newModBtn"),
      saveModBtn: $("saveModBtn"),
      deleteModBtn: $("deleteModBtn"),
      backBtn: $("backBtn"),
      exportBtn: $("exportBtn"),
      modName: $("modName"),
      modPrompt: $("modPrompt"),
      versions: $("versions"),
      previewBox: $("previewBox"),
      useExample: $("useExample"),
      gameStage: $("gameStage")
    };

    const LS_MODS = "shogi_of_speed_mods_min_v1";
    const LS_USER = "shogi_of_speed_user_min_v1";

    const state = {
      userId: localStorage.getItem(LS_USER) || crypto.randomUUID(),
      view: "game",
      mods: loadMods(),
      activeModId: null,
      activeVersionIndex: null,
      roomCode: "",
      roomMods: [],
      aiBusy: false
    };
    localStorage.setItem(LS_USER, state.userId);

    function loadMods(){
      try {
        const raw = localStorage.getItem(LS_MODS);
        const data = raw ? JSON.parse(raw) : [];
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function saveMods(){
      localStorage.setItem(LS_MODS, JSON.stringify(state.mods));
    }

    function setStatus(msg){
      el.status.textContent = msg;
    }

    function up(s){
      return String(s || "").replace(/[a-z]/g, c => c.toUpperCase());
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    function uid(){
      return crypto.randomUUID();
    }

    function blankMod(){
      return {
        id: uid(),
        name: "",
        prompt: "",
        versions: [],
        createdAt: Date.now(),
        updatedAt: Date.now()
      };
    }

    function getMod(id){
      return state.mods.find(m => m.id === id) || null;
    }

    function setView(view){
      state.view = view;
      el.gameChip.classList.toggle("active", view === "game");
      el.modsChip.classList.toggle("active", view === "mods");
      el.gameShell.classList.toggle("hidden", view !== "game");
      el.modsShell.classList.toggle("hidden", view !== "mods");
      el.modeChip.textContent = view === "mods" ? "MODS" : "GAME";
    }

    function normalizeRoom(raw){
      return up(raw).trim();
    }

    function parseRoomCode(text){
      const raw = normalizeRoom(text);
      if (!raw) return { kind:"game", roomCode:"", mods:[] };

      if (raw === "MOD" || raw === "MODS") return { kind:"mods", roomCode:"", mods:[] };

      const parts = raw.split(/\s+/);
      const roomCode = parts.shift() || "";
      const rest = parts.join(" ");

      const mods = [];
      if (rest) {
        for (const token of rest.split(",").map(v => v.trim()).filter(Boolean)) {
          const m = token.match(/^MOD=([A-Z0-9_\-ぁ-んァ-ヶ一-龥]+)(?:\s+V(\d+))?$/i);
          if (m) mods.push({ name: up(m[1]).trim(), version: m[2] ? Number(m[2]) : null });
        }
      }
      return { kind:"game", roomCode, mods };
    }

    function encodeMods(mods){
      return mods.map(m => `MOD=${m.name}${m.version ? ` v${m.version}` : ""}`).join(", ");
    }

    function refreshGameStage(){
      const modsText = state.roomMods.length ? state.roomMods.map(m => `${m.name}${m.version ? ` v${m.version}` : ""}`).join(", ") : "なし";
      el.gameStage.innerHTML = `
        <div class="row" style="margin-bottom:8px;">
          <span class="tag">ROOM: ${escapeHtml(state.roomCode || "未接続")}</span>
          <span class="tag">MOD: ${escapeHtml(modsText)}</span>
        </div>
        <div>
          ここに将棋本体をつなぐ。<br>
          room code から MOD を抜き出して、対局時だけ一時的に読み込む前提。
        </div>
        <div style="margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:12px;">
          <b>最低限の hook</b><br>
          parseRoomCode(roomInput.value) → roomCode / mods を取る。<br>
          mod の実体は <code>localStorage</code> に保存。<br>
          AI が使える環境なら <code>/api/mod-ai</code> に投げる。
        </div>
      `;
    }

    function refreshModsList(){
      el.modsList.innerHTML = "";

      const newCard = document.createElement("div");
      newCard.className = "modCard new";
      newCard.innerHTML = `
        <div class="modInfo">
          <div class="modTitle">+新規MOD</div>
          <div class="modMeta">緑の枠を押して新しい MOD を作る。</div>
        </div>
        <div class="modActions">
          <button class="good">作成</button>
        </div>
      `;
      newCard.querySelector("button").addEventListener("click", () => openModEditor(blankMod(), true));
      el.modsList.appendChild(newCard);

      for (const mod of state.mods) {
        const last = mod.versions[mod.versions.length - 1];
        const card = document.createElement("div");
        card.className = "modCard";
        card.innerHTML = `
          <div class="modInfo">
            <div class="modTitle">${escapeHtml(mod.name || "無題MOD")}</div>
            <div class="modMeta">
              バージョン: v${mod.versions.length || 1}<br>
              最終更新: ${new Date(mod.updatedAt || Date.now()).toLocaleString()}<br>
              ${last ? escapeHtml(last.summary || "説明なし") : "まだバージョンなし"}
            </div>
          </div>
          <div class="modActions">
            <button>開く</button>
          </div>
        `;
        card.querySelector("button").addEventListener("click", () => openModEditor(mod, false));
        el.modsList.appendChild(card);
      }
    }

    function renderEditor(){
      const mod = getMod(state.activeModId);
      if (!mod) {
        el.editor.classList.remove("show");
        el.modName.value = "";
        el.modPrompt.value = "";
        el.versions.innerHTML = "";
        el.previewBox.textContent = "";
        el.useExample.textContent = "";
        return;
      }

      el.editor.classList.add("show");
      el.modName.value = mod.name || "";
      el.modPrompt.value = mod.prompt || "";

      el.versions.innerHTML = "";
      if (!mod.versions.length) {
        const s = document.createElement("span");
        s.className = "small";
        s.textContent = "まだバージョンがないよ。";
        el.versions.appendChild(s);
      } else {
        mod.versions.forEach((v, i) => {
          const b = document.createElement("button");
          b.className = "verBtn" + (i === state.activeVersionIndex ? " active" : "");
          b.textContent = `v${i + 1}`;
          b.addEventListener("click", () => {
            state.activeVersionIndex = i;
            renderEditor();
          });
          el.versions.appendChild(b);
        });
      }

      const v = mod.versions[state.activeVersionIndex ?? mod.versions.length - 1];
      el.previewBox.textContent = v ? (v.summary || "説明なし") : "まだ説明がない。";
      el.useExample.textContent = `ROOMCODE MOD=${mod.name || "MOD名"} v${mod.versions.length || 1} / ROOMCODE MOD=${mod.name || "MOD名"}`;
    }

    function openModEditor(mod, focusNew = false){
      if (!state.mods.some(m => m.id === mod.id)) {
        state.mods.unshift(mod);
        saveMods();
      }
      state.activeModId = mod.id;
      state.activeVersionIndex = mod.versions.length ? mod.versions.length - 1 : null;
      setView("mods");
      refreshModsList();
      renderEditor();
      if (focusNew) el.modName.focus();
      setStatus("MOD制作画面を開いたよ。");
      refreshGameStage();
    }

    function commitModFields(){
      const mod = getMod(state.activeModId);
      if (!mod) return null;

      mod.name = up(el.modName.value).trim();
      mod.prompt = el.modPrompt.value.trim();
      mod.updatedAt = Date.now();
      saveMods();

      refreshModsList();
      renderEditor();
      return mod;
    }

    async function aiCreateOrUpdate(mod){
      const body = {
        mode: mod.versions.length ? "update" : "create",
        mod: {
          id: mod.id,
          name: mod.name,
          prompt: mod.prompt,
          versions: mod.versions
        }
      };

      const res = await fetch("/api/mod-ai", {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        throw new Error(await res.text().catch(() => `AI request failed (${res.status})`));
      }
      return await res.json();
    }

    function localFallbackVersion(mod){
      return {
        id: uid(),
        createdAt: Date.now(),
        summary: [
          `MOD名: ${mod.name || "無題MOD"}`,
          `内容: ${mod.prompt || "なし"}`,
          `状態: ローカル仮生成`,
          `説明: AI 連携がない時でも編集だけはできる`
        ].join("\n"),
        patch: {
          name: mod.name || "",
          note: mod.prompt || ""
        }
      };
    }

    async function saveWithAI(){
      const mod = commitModFields();
      if (!mod || !mod.name) {
        setStatus("MOD名を入れてね。");
        return;
      }

      if (state.aiBusy) return;
      state.aiBusy = true;
      el.saveModBtn.disabled = true;
      el.saveModBtn.textContent = "AI実行中…";

      try {
        let v;
        try {
          const ai = await aiCreateOrUpdate(mod);
          v = {
            id: uid(),
            createdAt: Date.now(),
            summary: String(ai.summary || "説明なし"),
            patch: ai.patch || {},
            raw: ai.raw || null
          };
        } catch (err) {
          v = localFallbackVersion(mod);
          setStatus(`AIが使えないのでローカル仮生成にしたよ: ${err.message}`);
        }

        mod.versions.push(v);
        mod.updatedAt = Date.now();
        state.activeVersionIndex = mod.versions.length - 1;
        saveMods();
        refreshModsList();
        renderEditor();
        refreshGameStage();
      } finally {
        state.aiBusy = false;
        el.saveModBtn.disabled = false;
        el.saveModBtn.textContent = "AIに作らせる / 更新";
      }
    }

    function deleteMod(){
      const mod = getMod(state.activeModId);
      if (!mod) return;
      if (!confirm(`MOD「${mod.name || "無題MOD"}」を削除する？`)) return;

      state.mods = state.mods.filter(m => m.id !== mod.id);
      state.activeModId = null;
      state.activeVersionIndex = null;
      saveMods();
      refreshModsList();
      renderEditor();
      setStatus("削除したよ。");
    }

    function enterRoom(){
      const parsed = parseRoomCode(el.roomInput.value);

      if (parsed.kind === "mods") {
        setView("mods");
        refreshModsList();
        renderEditor();
        setStatus("MOD制作画面に切り替えたよ。");
        refreshGameStage();
        return;
      }

      state.roomCode = parsed.roomCode;
      state.roomMods = parsed.mods;
      setView("game");
      el.mePill.textContent = state.roomCode || "未接続";
      setStatus(state.roomCode
        ? (state.roomMods.length ? `部屋 ${state.roomCode} に MOD を付けて入るよ。` : `部屋 ${state.roomCode} に入るよ。`)
        : "ROOM CODE を入れてね。");
      refreshGameStage();
    }

    function init(){
      el.roomInput.value = "";
      el.roomInput.addEventListener("input", () => {
        el.roomInput.value = up(el.roomInput.value);
      });
      el.roomInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") enterRoom();
      });

      el.enterBtn.addEventListener("click", enterRoom);
      el.shareBtn.addEventListener("click", async () => {
        const txt = el.roomInput.value.trim();
        if (!txt) {
          setStatus("共有するコードがないよ。");
          return;
        }
        if (!navigator.share) {
          setStatus("この端末は共有に対応していないよ。");
          return;
        }
        try {
          await navigator.share({ text: txt });
        } catch (err) {
          if (err?.name !== "AbortError") setStatus(`共有できなかった: ${err.message}`);
        }
      });

      el.gameChip.addEventListener("click", () => {
        setView("game");
        setStatus("ゲーム画面に戻したよ。");
        refreshGameStage();
      });
      el.modsChip.addEventListener("click", () => {
        setView("mods");
        setStatus("MOD制作画面に入ったよ。");
        refreshModsList();
        renderEditor();
      });

      el.newModBtn.addEventListener("click", () => {
        const mod = blankMod();
        state.mods.unshift(mod);
        saveMods();
        openModEditor(mod, true);
      });

      el.saveModBtn.addEventListener("click", saveWithAI);
      el.deleteModBtn.addEventListener("click", deleteMod);
      el.backBtn.addEventListener("click", () => {
        setView("game");
        setStatus("ゲーム画面に戻したよ。");
        refreshGameStage();
      });
      el.exportBtn.addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(state.mods, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "shogi_of_speed_mods.json";
        a.click();
      });

      el.modName.addEventListener("input", () => {
        el.modName.value = up(el.modName.value);
      });
      el.modName.addEventListener("change", commitModFields);
      el.modPrompt.addEventListener("change", commitModFields);

      if (state.mods.length) {
        state.activeModId = state.mods[0].id;
      }

      setView("game");
      refreshModsList();
      renderEditor();
      refreshGameStage();
      setStatus("ROOM CODE を入れて始めてね。`MOD` / `MODS` で MOD 画面に入れる。");
      el.mePill.textContent = "未接続";
    }

    init();

    window.__shogiMods = {
      parseRoomCode,
      getMods: () => state.mods,
      setView
    };
  </script>
</body>
</html>
