          const now = Date.now();
          if (room.matchStartAt && now < room.matchStartAt) return;

          const side = room.players?.black === state.playerId ? "black"
                    : room.players?.white === state.playerId ? "white"
                    : "spectator";
          if (side === "spectator") return;

          const result = applyActionToLive(currentLive, state.selected, side, destBoard, false);
          if (!result) return;

          const presence = room.presence || {};
          presence[state.playerId] = { side, lastSeen: now };

          const updates = {
            state: result.next,
            presence,
            updatedAt: now
          };

          if (result.next.winner) {
            updates.lastMatchResult = countOutcome(result.next.winner);
          }

          tx.update(state.roomRef, updates);
        }).catch(err => {
          setStatus(`動かせなかった: ${err.message}`);
        });

        clearSelection();
        return;
      }

      const liveLocal = state.roomData?.state;
      if (!liveLocal) return;

      const anySide = session.kind === "local_dual";
      const actorSide = session.kind === "cpu" ? "black" : null;
      const result = applyActionToLive(liveLocal, state.selected, actorSide, destBoard, anySide);
      if (!result) return;

      state.roomData.state = result.next;
      state.roomData.updatedAt = Date.now();
      if (result.next.winner) {
        state.roomData.lastMatchResult = countOutcome(result.next.winner);
        state.roomData.royalRoles = computeRoyalRoles(state.roomData.lastMatchResult);
        if (isCPU()) finalCpuOutcome(result.next.winner);
      }

      refreshHands();
      scheduleRender(0);

      if (session.kind === "cpu" && !result.next.winner) {
        updateCpuOnBoardChange();
      }
      if (session.kind === "cpu" && result.next.winner) {
        resetCpuBrainForNewGame();
      }
    }

    boardCanvas.addEventListener("click", async (ev) => {
      if (performance.now() < state.suppressClickUntil) return;
      if (!state.roomData) return;

      const sq = pointToSquare(ev);
      if (!sq) return;

      const clicked = pieceUnderSquare(sq.x, sq.y);
      const mode = modeSelect.value;
      const live = state.roomData.state;

      if (mode === "tap") {
        if (!state.selected) {
          if (clicked && canControlSide(clicked.side)) {
            state.selected = { kind: "piece", id: clicked.id };
            state.dragSource = "board";
            refreshHands();
            scheduleRender(0);
          }
          return;
        }

        if (state.selected.kind === "piece") {
          const selectedPiece = live.pieces.find(p => p.id === state.selected.id);

          if (selectedPiece && canControlSide(selectedPiece.side)) {
            const destBoard = screenToBoard(sq.x, sq.y);
            const legal = legalMovesForPiece(live, selectedPiece, true);
            const move = legal.find(m => m.x === destBoard.x && m.y === destBoard.y);
            if (move) {
              await commitMoveAndSideEffects(destBoard);
              return;
            }
          }

          if (clicked && canControlSide(clicked.side)) {
            state.selected = { kind: "piece", id: clicked.id };
            state.dragSource = "board";
            refreshHands();
            scheduleRender(0);
            return;
          }

          clearSelection();
          return;
        }

        if (state.selected.kind === "hand") {
          const destBoard = screenToBoard(sq.x, sq.y);
          await commitMoveAndSideEffects(destBoard);
          return;
        }
      }

      if (mode === "slide") {
        if (state.selected?.kind === "hand") {
          const destBoard = screenToBoard(sq.x, sq.y);
          await commitMoveAndSideEffects(destBoard);
          return;
        }

        if (clicked && canControlSide(clicked.side)) {
          state.selected = { kind: "piece", id: clicked.id };
          state.dragSource = "board";
          refreshHands();
          scheduleRender(0);
        }
      }
    });

    boardCanvas.addEventListener("pointerdown", (ev) => {
      if (modeSelect.value !== "slide") return;
      boardCanvas.setPointerCapture(ev.pointerId);
      state.dragPointerId = ev.pointerId;
      state.dragStart = { x: ev.clientX, y: ev.clientY };
      state.dragging = false;
      state.dragSource = "board";

      const sq = pointToSquare(ev);
      if (!sq) return;
      const clicked = pieceUnderSquare(sq.x, sq.y);
      const board = screenToBoard(sq.x, sq.y);

      if (state.selected?.kind === "hand") {
        const live = state.roomData?.state;
        const empty = live && !pieceAt(live.pieces, board.x, board.y);
        if (empty) {
          commitMoveAndSideEffects(board).then(() => clearSelection());
          return;
        }
      }

      if (clicked && canControlSide(clicked.side)) {
        state.selected = { kind: "piece", id: clicked.id };
        state.dragSource = "board";
        refreshHands();
        scheduleRender(0);
      }
    });

    boardCanvas.addEventListener("pointermove", (ev) => {
      if (modeSelect.value !== "slide") return;
      if (state.dragPointerId !== ev.pointerId || !state.dragStart) return;
      const dx = ev.clientX - state.dragStart.x;
      const dy = ev.clientY - state.dragStart.y;
      if (Math.hypot(dx, dy) > 6) state.dragging = true;
    });

    function finishSlidePointer(ev) {
      if (modeSelect.value !== "slide") return;
      if (state.dragPointerId != null && state.dragPointerId !== ev.pointerId) return;

      state.suppressClickUntil = performance.now() + 250;

      if (state.selected && state.selected.kind === "piece" && state.dragging) {
        const releasePoint = pointFromEvent(ev);
        const targetMove = getSlidePieceTarget(releasePoint);
        if (targetMove) {
          const live = state.roomData?.state;
          const selectedPiece = live?.pieces.find(p => p.id === state.selected.id);
          if (selectedPiece && canControlSide(selectedPiece.side)) {
            commitMoveAndSideEffects({ x: targetMove.x, y: targetMove.y }).then(() => {
              clearSelection();
            });
          }
        }
      }

      if (state.selected && state.selected.kind === "hand" && state.dragSource === "hand") {
        const targetBoard = getHandDropTarget(ev);
        if (targetBoard) {
          commitMoveAndSideEffects(targetBoard).then(() => {
            clearSelection();
          });
        }
      }

      state.dragPointerId = null;
      state.dragStart = null;
      state.dragging = false;
    }

    document.addEventListener("pointerup", finishSlidePointer, true);

    boardCanvas.addEventListener("pointercancel", () => {
      state.dragPointerId = null;
      state.dragStart = null;
      state.dragging = false;
      state.dragSource = null;
    });

    async function loadCpuPolicyAndStart() {
      loadCpuPolicyLocal();
      await loadCpuPolicyRemote();
      resetCpuBrainForNewGame();
      scheduleCpuThink(300);
    }

    function refreshLocalAfterMove(meta) {
      refreshHands();
      scheduleRender(0);
      if (session.kind === "cpu") {
        const live = state.roomData?.state;
        if (live) {
          const nowCount = countPieces(live, "white");
          observeCpuLosses(cpuBrain.lastCpuPieceCount, nowCount);
          if (live.winner) {
            finalCpuOutcome(live.winner);
            resetCpuBrainForNewGame();
          } else {
            scheduleCpuThink(350);
          }
        }
      }
    }

    function cpuObserveAndMaybeLearn(meta) {
      if (!isCPU()) return;
      const live = state.roomData?.state;
      if (!live) return;
      const current = countPieces(live, "white");
      if (cpuBrain.lastCpuPieceCount === 0) cpuBrain.lastCpuPieceCount = current;
      if (current < cpuBrain.lastCpuPieceCount) {
        rewardCpuRecent(-14 * (cpuBrain.lastCpuPieceCount - current));
      }
      cpuBrain.lastCpuPieceCount = current;
      if (meta?.capturedType) {
        rewardCpuRecent(cpuValue(meta.capturedType) / 60);
      }
      if (live.winner) {
        finalCpuOutcome(live.winner);
        resetCpuBrainForNewGame();
      } else {
        scheduleCpuThink(300);
      }
      saveCpuPolicyLocal();
    }

    function scheduleCpuThink(delay = 400) {
      if (!isCPU()) return;
      if (session.cpuTimer) clearTimeout(session.cpuTimer);
      session.cpuTimer = setTimeout(() => {
        session.cpuTimer = null;
        cpuThink();
      }, delay);
    }

    function cpuThink() {
      if (!isCPU() || !state.roomData) return;
      const live = state.roomData.state;
      if (!live || live.winner) return;

      const now = Date.now();
      const action = cpuChooseAction();
      if (!action) {
        scheduleCpuThink(500);
        return;
      }

      const result = applyActionToLive(live, action.selected, "white", action.dest, false);
      if (!result) {
        scheduleCpuThink(350);
        return;
      }

      recordCpuAction(action.key);
      if (result.meta.capturedType) rewardCpuRecent(cpuValue(result.meta.capturedType) / 60);
      if (result.meta.movedType === "king" && isSquareAttacked(result.next.pieces, action.dest.x, action.dest.y, "black")) {
        rewardCpuRecent(-12);
      }

      state.roomData.state = result.next;
      state.roomData.updatedAt = now;
      if (result.next.winner) {
        state.roomData.lastMatchResult = countOutcome(result.next.winner);
        state.roomData.royalRoles = computeRoyalRoles(state.roomData.lastMatchResult);
        finalCpuOutcome(result.next.winner);
        resetCpuBrainForNewGame();
      } else {
        const piecesLeft = countPieces(result.next, "white");
        observeCpuLosses(cpuBrain.lastCpuPieceCount, piecesLeft);
        scheduleCpuThink(450);
      }

      refreshHands();
      scheduleRender(0);
    }

    async function voteRematchOnlineOrLocal(yes) {
      if (session.kind !== "online") {
        if (yes) {
          refreshLocalRematchImmediate();
          rematchOverlay.classList.remove("show");
        } else {
          leaveToHome();
        }
        return;
      }

      if (!state.roomRef || !state.roomData) return;
      const room = state.roomData;
      if (!room.state?.winner || !isBothPlayersReady(room)) return;

      await runTransaction(db, async (tx) => {
        const snap = await tx.get(state.roomRef);
        if (!snap.exists()) return;

        const data = snap.data() || {};
        const live = data.state || {};
        const players = data.players || {};
        const rematchVotes = data.rematchVotes || {};
        const now = Date.now();

        const mySide = players.black === state.playerId ? "black"
                     : players.white === state.playerId ? "white"
                     : "spectator";
        if (mySide === "spectator") return;
        if (!live.winner || !players.black || !players.white) return;

        if (yes) rematchVotes[state.playerId] = true;
        else delete rematchVotes[state.playerId];

        const blackPid = players.black;
        const whitePid = players.white;
        const bothYes = !!rematchVotes[blackPid] && !!rematchVotes[whitePid];

        if (bothYes) {
          const lastMatchResult = data.lastMatchResult || countOutcome(live.winner);
          tx.update(state.roomRef, {
            state: freshState(),
            matchStartAt: now + COUNTDOWN_MS,
            rematchVotes: {},
            royalRoles: computeRoyalRoles(lastMatchResult),
            lastMatchResult,
            forceHomeAt: null,
            updatedAt: now
          });
          return;
        }

        if (!yes) {
          tx.update(state.roomRef, {
            rematchVotes: {},
            forceHomeAt: now,
            updatedAt: now
          });
          return;
        }

        tx.update(state.roomRef, {
          rematchVotes,
          updatedAt: now
        });
      }).catch(err => {
        setStatus(`リマッチの処理に失敗した: ${err.message}`);
      });

      if (!yes) leaveToHome();
    }

    rematchYes.addEventListener("click", () => voteRematchOnlineOrLocal(true));
    rematchNo.addEventListener("click", () => voteRematchOnlineOrLocal(false));

    function refreshLocalRematchImmediate() {
      if (!state.roomData) return;
      const nextLast = state.roomData.lastMatchResult || defaultLastMatchResult();
      state.roomData.state = freshState();
      state.roomData.royalRoles = computeRoyalRoles(nextLast);
      state.roomData.lastMatchResult = nextLast;
      state.roomData.rematchVotes = {};
      state.roomData.matchStartAt = null;
      state.roomData.updatedAt = Date.now();
      state.selected = null;
      if (isCPU()) resetCpuBrainForNewGame();
      refreshHands();
      scheduleRender(0);
      if (session.kind === "cpu") scheduleCpuThink(400);
    }

    function schedulePostConnectRenders() {
      scheduleRender(0);
      updateMePill();
      refreshHands();
      updateRematchOverlay();
    }

    window.addEventListener("resize", resizeCanvas);

    loadCpuPolicyLocal();
    resizeCanvas();
    refreshHands();
    updateMePill();
    updateRematchOverlay();
    scheduleRender(0);
    setStatus("ルームコードを入れて「入室 / 作成」を押してね。");
  </script>
