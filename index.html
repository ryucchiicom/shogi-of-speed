  }

  function newModTemplate(){
    const id = crypto.randomUUID();
    const mod = {
      id,
      name:"新しいMOD",
      notes:"MOD名と説明を編集して、AIでバージョンを増やせるよ。",
      basePrompt:"",
      createdAt:Date.now(),
      updatedAt:Date.now(),
      versions:[ { version:1, summary:"初期バージョン", patch: defaultModPatch(), createdAt:Date.now() } ]
    };
    state.modLibrary.unshift(mod);
    state.selectedModId = id;
    state.selectedVersionIndex = 0;
    saveMods();
    renderModsList();
    loadSelectedModToEditor();
  }

  function saveCurrentMod(){
    const mod = state.modLibrary.find(m => m.id === state.selectedModId);
    if (!mod) return;
    mod.name = sanitizeName(modName.value || mod.name || "新しいMOD") || "新しいMOD";
    mod.basePrompt = modPrompt.value || "";
    mod.notes = modNotes.value || mod.notes || "";
    mod.updatedAt = Date.now();
    saveMods();
    renderModsList();
    loadSelectedModToEditor();
    setStatus(`MOD「${mod.name}」を保存したよ。`);
  }

  function deleteCurrentMod(){
    const mod = state.modLibrary.find(m => m.id === state.selectedModId);
    if (!mod) return;
    state.modLibrary = state.modLibrary.filter(m => m.id !== mod.id);
    state.selectedModId = state.modLibrary[0]?.id || null;
    state.selectedVersionIndex = 0;
    saveMods();
    renderModsList();
    loadSelectedModToEditor();
    setStatus("MODを削除したよ。");
  }

  function setRoomCodeFromTempMods(){
    const parsed = parseRoomMods(roomInput.value);
    const base = parsed.room || roomInput.value.trim();
    if (!base) return;
    const modsStr = state.activeMods.length ? " MOD=" + state.activeMods.map(m => `${m.name} v${m.version}`).join(",") : "";
    roomInput.value = base + modsStr;
  }

  function applyActiveModsToRoom(room){
    const modsPayload = room.modsPayload || [];
    state.activeMods = Array.isArray(modsPayload) ? modsPayload : [];
    state.activeModRules = mergedModRules(state.activeMods.map(m => m.patch || {}));
    try{ localStorage.setItem(TEMP_MATCH_MODS_KEY, JSON.stringify(state.activeMods)); }catch{}
  }

  function modLibraryToPayload(tokens){
    const payload=[];
    for (const token of tokens){
      const found = state.modLibrary.find(m => m.name === token.name);
      if (!found) continue;
      const version = token.version || found.versions.at(-1)?.version;
      const chosen = found.versions.find(v => v.version === version) || found.versions.at(-1);
      if (!chosen) continue;
      payload.push({ id: found.id, name: found.name, version: chosen.version, patch: chosen.patch, summary: chosen.summary || "", notes: found.notes || "" });
    }
    return payload;
  }

  function parseTempMatchModsFromInputToSession(){
    const parsed = parseRoomMods(roomInput.value);
    const resolved = modLibraryToPayload(parsed.modTokens);
    state.activeMods = resolved;
    state.activeModRules = mergedModRules(resolved.map(x => x.patch || {}));
    try{ localStorage.setItem(TEMP_MATCH_MODS_KEY, JSON.stringify(resolved)); }catch{}
    return parsed.room;
  }

  function startCpuLoop(){
    if (session.cpuLoop) clearInterval(session.cpuLoop);
    session.cpuLoop = setInterval(cpuThink, 220);
    cpuThink();
  }

  function makeLocalOrCpuSession(kind){
    clearTimers();
    session.kind = kind;
    state.roomRef = null;
    state.unsub = null;
    state.roomId = kind==="cpu" ? "CPU" : "1 SMARTPHONE";
    state.mySide = kind==="cpu" ? "black" : "both";
    state.selected = null;
    state.roomData = { mode:kind, players:{ black:"local", white: kind==="cpu" ? "cpu" : "local2" }, presence:{}, playerResults:{}, state:freshState(activeRoyalLabels()), matchStartAt:null, rematchVotes:{}, modsPayload: state.activeMods.slice() };
    applyActiveModsToRoom(state.roomData);
    updateMePill();
    refreshHands();
    setStatus(kind==="cpu" ? "CPUモードで始めたよ。" : "1 SMARTPHONEモードで始めたよ。");
    scheduleRender(0);
    if (kind==="cpu") startCpuLoop();
  }

  function openModMode(){
    state.modMode = true;
    modOverlay.classList.add("show");
    gameArea.style.display = "none";
    renderModsList();
    loadSelectedModToEditor();
    updateMePill();
  }
  function closeModMode(){
    state.modMode = false;
    modOverlay.classList.remove("show");
    gameArea.style.display = "";
    updateMePill();
    scheduleRender(0);
  }

  function toggleModMode(){
    if (state.modMode) closeModMode(); else openModMode();
  }

  async function enterRoom(){
    const parsed = parseRoomMods(roomInput.value);
    const mode = specialModeFromCode(parsed.room);
    state.activeMods = modLibraryToPayload(parsed.modTokens);
    state.activeModRules = mergedModRules(state.activeMods.map(x=>x.patch || {}));
    try{ localStorage.setItem(TEMP_MATCH_MODS_KEY, JSON.stringify(state.activeMods)); }catch{}

    if (mode==="cpu"){
      await loadCpuMemory();
      makeLocalOrCpuSession("cpu");
      return;
    }
    if (mode==="local_dual"){
      makeLocalOrCpuSession("local_dual");
      return;
    }

    session.kind="online";
    clearTimers();

    try{
      let roomId = parsed.room;
      if (!roomId){
        roomId = Math.random().toString(36).slice(2,8).toUpperCase();
        roomInput.value = roomId;
      }
      const ref = doc(db, "rooms", roomId);
      const snap = await getDoc(ref);
      if (!snap.exists()) await setDoc(ref, makeOnlineRoomDoc(state.playerId));
      await connectOnlineRoom(roomId);

      // mods are private; inject temporary match payload in room doc for this match only
      if (state.activeMods.length && state.roomRef){
        await runTransaction(db, async tx => {
          const s = await tx.get(state.roomRef);
          if (!s.exists()) return;
          const d = s.data() || {};
          tx.update(state.roomRef, { modsPayload: state.activeMods.slice(), updatedAt: Date.now(), state: d.state || freshState() });
        }).catch(()=>{});
      }
    }catch(err){
      setStatus(`入室に失敗した: ${err.message}`);
    }
  }

  async function voteRematch(yes){
    if (session.kind !== "online"){
      if (yes){ refreshLocalGameAfterRematch(); rematchOverlay.classList.remove("show"); }
      else leaveToHome();
      return;
    }
    if (!state.roomRef || !state.roomData) return;
    const room=state.roomData;
    if (!room.state?.winner || !isBothPlayersReady(room)) return;
    await runTransaction(db, async tx => {
      const snap=await tx.get(state.roomRef);
      if (!snap.exists()) return;
      const data=snap.data() || {};
      const live=data.state || {};
      const players=data.players || {};
      const rematchVotes=data.rematchVotes || {};
      const playerResults=data.playerResults || {};
      const now=Date.now();
      const mySide = players.black===state.playerId ? "black" : players.white===state.playerId ? "white" : "spectator";
      if (mySide==="spectator") return;
      if (!live.winner || !players.black || !players.white) return;

      if (yes) rematchVotes[state.playerId] = true;
      else delete rematchVotes[state.playerId];

      const blackPid=players.black, whitePid=players.white;
      const bothYes=!!rematchVotes[blackPid] && !!rematchVotes[whitePid];

      if (bothYes){
        const labels = royalLabelsForOnline({ players, playerResults });
        tx.update(state.roomRef, { state:freshState(labels), matchStartAt: now + COUNTDOWN_MS, rematchVotes:{}, forceHomeAt:null, updatedAt: now });
        return;
      }
      if (!yes){
        tx.update(state.roomRef, { rematchVotes:{}, forceHomeAt: now, updatedAt: now });
        return;
      }
      tx.update(state.roomRef, { rematchVotes, updatedAt: now });
    }).catch(err => setStatus(`リマッチの処理に失敗した: ${err.message}`));
    if (!yes) leaveToHome();
  }

  function loadAndApplyModsFromRoomInput(){
    const parsed = parseRoomMods(roomInput.value);
    state.activeMods = modLibraryToPayload(parsed.modTokens);
    state.activeModRules = mergedModRules(state.activeMods.map(x => x.patch || {}));
    try{ localStorage.setItem(TEMP_MATCH_MODS_KEY, JSON.stringify(state.activeMods)); }catch{}
    return parsed;
  }

  function openGameFromInput(){
    loadAndApplyModsFromRoomInput();
    enterRoom();
  }

  async function saveRoomModsToRoom(){
    if (session.kind !== "online" || !state.roomRef) return;
    const parsed = parseRoomMods(roomInput.value);
    const resolved = modLibraryToPayload(parsed.modTokens);
    await runTransaction(db, async tx => {
      const snap = await tx.get(state.roomRef);
      if (!snap.exists()) return;
      const data=snap.data() || {};
      tx.update(state.roomRef, { modsPayload: resolved, updatedAt: Date.now(), state: data.state });
    }).catch(()=>{});
  }

  function updateRuleEffectsIfNeeded(){
    state.activeModRules = mergedModRules(state.activeMods.map(x => x.patch || {}));
  }

  function onModInputChange(){
    const code = roomInput.value || "";
    if (/^\s*MODS?\s*$/i.test(code.trim())) {
      toggleModMode();
    }
  }

  roomInput.addEventListener("input", onModInputChange);
  roomInput.addEventListener("keydown", (e) => { if (e.key === "Enter") openGameFromInput(); });
  enterBtn.addEventListener("click", openGameFromInput);
  shareBtn.addEventListener("click", async () => {
    const code = (roomInput.value || state.roomId || "").trim();
    if (!code) { setStatus("共有するコードがないよ。"); return; }
    if (!navigator.share){ setStatus("この端末は共有に対応していないよ。"); return; }
    try { await navigator.share({ text: code }); setStatus(`コードを共有したよ: ${code}`); } catch(err){ if (err && err.name !== "AbortError") setStatus(`共有できなかった: ${err.message}`); }
  });
  modsBtn.addEventListener("click", toggleModMode);
  newModBtn.addEventListener("click", newModTemplate);
  saveModBtn.addEventListener("click", saveCurrentMod);
  deleteModBtn.addEventListener("click", deleteCurrentMod);
  backGameBtn.addEventListener("click", closeModMode);
  aiGenerateBtn.addEventListener("click", aiPromptForVersion);

  boardCanvas.addEventListener("click", async (ev) => {
    if (performance.now() < state.suppressClickUntil) return;
    if (state.modMode) return;
    if (!state.roomData) return;
    const sq=pointToSquare(ev);
    if (!sq) return;
    const clicked=pieceUnderSquare(sq.x, sq.y);
    const mode=modeSelect.value;
    const live=state.roomData.state;

    if (mode==="tap"){
      if (!state.selected){
        if (clicked && canControlSide(clicked.side)){
          state.selected={ kind:"piece", id:clicked.id };
          state.dragSource="board";
          refreshHands();
          scheduleRender(0);
        }
        return;
      }

      if (state.selected.kind==="piece"){
        const selectedPiece = live.pieces.find(p=>p.id===state.selected.id);
        if (selectedPiece){
          const destBoard = screenToBoardMod(sq.x, sq.y);
          const legal = legalMovesForPiece(live, selectedPiece, true);
          const move = legal.find(m=>m.x===destBoard.x && m.y===destBoard.y);
          if (move && canControlSide(selectedPiece.side)){
            await commitMove(destBoard);
            clearSelection();
            return;
          }
        }
        if (clicked){
          state.selected={ kind:"piece", id:clicked.id };
          state.dragSource="board";
          refreshHands();
          scheduleRender(0);
          return;
        }
        clearSelection();
        return;
      }

      if (state.selected.kind==="hand"){
        const destBoard=screenToBoardMod(sq.x, sq.y);
        const moved = await commitMove(destBoard);
        if (moved) clearSelection();
        return;
      }
    }

    if (mode==="slide"){
      if (state.selected?.kind==="hand"){
        const destBoard=screenToBoardMod(sq.x, sq.y);
        const moved = await commitMove(destBoard);
        if (moved) clearSelection();
        return;
      }
      if (clicked && canControlSide(clicked.side)){
        state.selected={ kind:"piece", id:clicked.id };
        state.dragSource="board";
        refreshHands();
        scheduleRender(0);
      }
    }
  });

  boardCanvas.addEventListener("pointerdown", (ev) => {
    if (state.modMode) return;
    if (modeSelect.value !== "slide") return;
    boardCanvas.setPointerCapture(ev.pointerId);
    state.dragPointerId = ev.pointerId;
    state.dragStart = { x: ev.clientX, y: ev.clientY };
    state.dragging = false;
    state.dragSource = "board";

    const sq=pointToSquare(ev);
    if (!sq) return;
    const clicked=pieceUnderSquare(sq.x, sq.y);
    const board=screenToBoardMod(sq.x, sq.y);

    if (state.selected?.kind==="hand"){
      const live=state.roomData?.state;
      const empty = live && !pieceAt(live.pieces, board.x, board.y);
      if (empty){
        commitMove(board).then(moved => { if (moved) clearSelection(); });
        return;
      }
    }

    if (clicked && canControlSide(clicked.side)){
      state.selected={ kind:"piece", id:clicked.id };
      state.dragSource="board";
      refreshHands();
      scheduleRender(0);
    }
  });

  boardCanvas.addEventListener("pointermove", (ev) => {
    if (state.modMode) return;
    if (modeSelect.value !== "slide") return;
    if (state.dragPointerId !== ev.pointerId || !state.dragStart) return;
    const dx=ev.clientX - state.dragStart.x;
    const dy=ev.clientY - state.dragStart.y;
    if (Math.hypot(dx,dy) > 6) state.dragging = true;
  });

  function finishSlidePointer(ev){
    if (state.modMode) return;
    if (modeSelect.value !== "slide") return;
    if (state.dragPointerId != null && state.dragPointerId !== ev.pointerId) return;
    state.suppressClickUntil = performance.now() + 250;

    if (state.selected && state.selected.kind==="piece" && state.dragging){
      const releasePoint = pointFromEvent(ev);
      const targetMove = getSlidePieceTarget(releasePoint);
      if (targetMove){
        const live=state.roomData?.state;
        const selectedPiece=live?.pieces.find(p=>p.id===state.selected.id);
        if (selectedPiece && canControlSide(selectedPiece.side)){
          commitMove({ x: targetMove.x, y: targetMove.y }).then(moved => { if (moved) clearSelection(); });
        }
      }
    }

    if (state.selected && state.selected.kind==="hand" && state.dragSource==="hand"){
      const targetBoard=getHandDropTarget(ev);
      if (targetBoard){
        commitMove(targetBoard).then(moved => { if (moved) clearSelection(); });
      }
    }

    state.dragPointerId = null;
    state.dragStart = null;
    state.dragging = false;
  }
  document.addEventListener("pointerup", finishSlidePointer, true);

  rematchYes.addEventListener("click", () => voteRematch(true));
  rematchNo.addEventListener("click", () => voteRematch(false));

  window.addEventListener("resize", resizeCanvas);

  function resizeCanvas(){
    const rect=boardCanvas.getBoundingClientRect();
    const dpr=Math.max(1, window.devicePixelRatio || 1);
    boardCanvas.width = Math.floor(rect.width * dpr);
    boardCanvas.height = Math.floor(rect.height * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    state.boardReady = true;
    scheduleRender(0);
  }

  function refreshScreenForMode(){
    if (state.modMode) {
      gameArea.style.display = "none";
      modOverlay.classList.add("show");
    } else {
      gameArea.style.display = "";
      modOverlay.classList.remove("show");
    }
  }

  function parseAndLoadRoomCodeMaybeToggleMod(){
    const val = normalizeRoomId(roomInput.value);
    if (val === "MOD" || val === "MODS"){
      toggleModMode();
      return true;
    }
    return false;
  }

  roomInput.addEventListener("change", parseAndLoadRoomCodeMaybeToggleMod);

  modsBtn.addEventListener("dblclick", () => {
    state.modMode = !state.modMode;
    refreshScreenForMode();
  });

  function onLoadInit(){
    loadActiveModsFromRoomCode();
    updateMePill();
    refreshHands();
    renderModsList();
    loadSelectedModToEditor();
    resizeCanvas();
    scheduleRender(0);
    setStatus("ルームコードを入れて「入室 / 作成」を押してね。");
  }

  // initialize mod editor state
  if (!state.modLibrary.length) {
    state.modLibrary = [];
  } else {
    state.selectedModId = state.modLibrary[0].id;
  }
  renderModsList();
  loadSelectedModToEditor();
  onLoadInit();

  function scheduleRender(delay = null){
    if (state.renderTimer) clearTimeout(state.renderTimer);
    if (delay === null){
      if (!hasAnimatingState()) return;
      const now=Date.now();
      let next=250;
      const live=state.roomData?.state;
      if (session.kind==="online" && state.roomData?.matchStartAt && state.roomData.matchStartAt > now) next = Math.min(next, Math.max(50, state.roomData.matchStartAt - now));
      for (const p of live?.pieces || []) if (p.cooldownUntil > now) next = Math.min(next, Math.max(50, p.cooldownUntil - now));
      const hs = live?.handCooldownUntil || {};
      if ((hs.black || 0) > now) next = Math.min(next, Math.max(50, hs.black - now));
      if ((hs.white || 0) > now) next = Math.min(next, Math.max(50, hs.white - now));
      delay = next;
    }
    state.renderTimer = setTimeout(() => { state.renderTimer = null; renderFrame(); }, delay);
  }

  function hasAnimatingState(){
    const live=state.roomData?.state;
    if (!live) return false;
    const now = Date.now();
    if (session.kind==="online" && state.roomData?.matchStartAt && state.roomData.matchStartAt > now) return true;
    if (live.pieces.some(p=>p.cooldownUntil>now || p.promoMode==="can")) return true;
    if ((live.handCooldownUntil?.black || 0) > now) return true;
    if ((live.handCooldownUntil?.white || 0) > now) return true;
    return false;
  }

  async function commitMoveForUI(board){ return commitMove(board); }

  function refreshModUIState(){
    modCountTag.textContent = `${state.modLibrary.length} MOD`;
    renderModsList();
    loadSelectedModToEditor();
  }

  if (mq.addEventListener) mq.addEventListener("change", ()=>{ applyThemeFromCSS(); scheduleRender(0); });
  else if (mq.addListener) mq.addListener(()=>{ applyThemeFromCSS(); scheduleRender(0); });

  state.renderTimer = null;
  if (modeSelect.value === "slide") state.dragging = false;

  // keep CPU alive if CPU mode selected from reload
  const tempMods = localStorage.getItem(TEMP_MATCH_MODS_KEY);
  if (tempMods){
    try{
      state.activeMods = JSON.parse(tempMods) || [];
      state.activeModRules = mergedModRules(state.activeMods.map(x => x.patch || {}));
    }catch{}
  }

  // MOD mode toggle by code
  const originalEnterRoom = enterRoom;
  async function enterRoomWrapper(){
    const raw = roomInput.value.trim();
    if (raw.toUpperCase() === "MOD" || raw.toUpperCase() === "MODS"){
      toggleModMode();
      return;
    }
    loadAndApplyModsFromRoomInput();
    await originalEnterRoom();
  }
  enterBtn.onclick = enterRoomWrapper;
  roomInput.addEventListener("keydown", e => { if (e.key === "Enter") enterRoomWrapper(); });

  // ensure shared code only exports room code
  shareBtn.addEventListener("click", async () => {
    const parsed = parseRoomMods(roomInput.value);
    const code = parsed.room || normalizeRoomId(roomInput.value || state.roomId);
    if (!code) { setStatus("共有するコードがないよ。"); return; }
    if (!navigator.share) { setStatus("この端末は共有に対応していないよ。"); return; }
    try{ await navigator.share({ text: code }); setStatus(`コードを共有したよ: ${code}`); } catch(err){ if (err && err.name !== "AbortError") setStatus(`共有できなかった: ${err.message}`); }
  });

  // mod editor hooks
  modName.addEventListener("input", () => { modName.value = sanitizeName(modName.value); });
  modName.addEventListener("change", saveCurrentMod);
  modPrompt.addEventListener("change", saveCurrentMod);
  modNotes.addEventListener("change", saveCurrentMod);

  // keep "room code" placeholder exact
  roomInput.placeholder = "ROOM CODE";

  // select default mods from storage when entering game
  function refreshGameFromSelectedMod(){
    if (state.roomData && session.kind !== "online") {
      state.roomData.modsPayload = state.activeMods.slice();
      state.roomData.state.updatedAt = Date.now();
    }
  }

  // CPU should move even when nothing else happens
  if (session.kind === "cpu") startCpuLoop();

  // expose a very small helper to the overlay for version JSON
  modVersionsEl.addEventListener("click", () => {});
  saveMods();
  renderModsList();
  loadSelectedModToEditor();
  resizeCanvas();
  scheduleRender(0);
  setStatus("ルームコードを入れて「入室 / 作成」を押してね。");
</script>
</body>
</html>
