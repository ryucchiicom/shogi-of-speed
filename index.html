          ring.style.opacity = "1";
          ring.style.setProperty("--cd", String(Math.max(0, Math.min(1, rem / state.runtime.handCooldownMs))));
          if (btn.dataset.interactive === "1") btn.disabled = true;
        } else {
          ring.style.opacity = "0";
        }
      }
    }

    function refreshHandCooldownIndicators() {
      updateHandCooldownUI();
    }

    function drawPiece(piece, cell, now, selected) {
      const x = cell.x + cell.size / 2;
      const y = cell.y + cell.size / 2;
      const s = cell.size;
      const w = s * 0.62;
      const h = s * 0.72;

      ctx.save();

      if (selected) {
        ctx.strokeStyle = "rgba(138,180,255,.95)";
        ctx.lineWidth = 4;
        ctx.strokeRect(cell.x + 3, cell.y + 3, s - 6, s - 6);
      }

      ctx.translate(x, y);
      ctx.rotate(piece.side === getViewSide() ? 0 : Math.PI);

      ctx.beginPath();
      ctx.moveTo(0, -h * 0.48);
      ctx.lineTo(w * 0.34, -h * 0.16);
      ctx.lineTo(w * 0.26, h * 0.42);
      ctx.lineTo(-w * 0.26, h * 0.42);
      ctx.lineTo(-w * 0.34, -h * 0.16);
      ctx.closePath();

      const grad = ctx.createLinearGradient(-s/2, -s/2, s/2, s/2);
      grad.addColorStop(0, state.runtime.pieceFill1);
      grad.addColorStop(1, state.runtime.pieceFill2);
      ctx.fillStyle = grad;
      ctx.strokeStyle = "rgba(65,45,18,.75)";
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = pieceTextColor(piece);
      ctx.font = `700 ${Math.max(14, s * 0.21)}px "Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(moveTextLabel(piece, now), 0, 1);

      const remain = Math.max(0, piece.cooldownUntil - now);
      if (remain > 0) {
        const ratio = remain / state.runtime.pieceCooldownMs;
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.36, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ratio, false);
        ctx.strokeStyle = "rgba(255,255,255,.95)";
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, s * 0.36, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ratio, false);
        ctx.strokeStyle = "rgba(20,20,20,.22)";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      ctx.restore();
    }

    function renderGame() {
      const rect = E.board.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      if (w < 20 || h < 20) return;
      const cell = w / 9;
      const now = Date.now();

      ctx.clearRect(0,0,w,h);

      const live = state.roomData?.state;
      const room = state.roomData;

      for (let sy = 0; sy < 9; sy++) {
        for (let sx = 0; sx < 9; sx++) {
          const board = screenToBoard(sx, sy);
          const light = (board.x + board.y) % 2 === 0;
          ctx.fillStyle = light ? state.runtime.boardLight : state.runtime.boardDark;
          ctx.fillRect(sx * cell, sy * cell, cell, cell);
        }
      }

      ctx.strokeStyle = "rgba(104,79,42,.55)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= 9; i++) {
        ctx.beginPath();
        ctx.moveTo(i * cell, 0);
        ctx.lineTo(i * cell, 9 * cell);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * cell);
        ctx.lineTo(9 * cell, i * cell);
        ctx.stroke();
      }

      if (!live) {
        ctx.fillStyle = "rgba(0,0,0,.55)";
        ctx.font = "600 16px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("ルーム接続待ち", w / 2, h / 2);
        return;
      }

      const selectedMoves = selectedLegalMoves(live);
      for (const mv of selectedMoves) {
        const s = boardToScreen(mv.x, mv.y);
        let fill = "rgba(242,201,76,.34)";
        if (mv.kind === "promo") fill = "rgba(53,105,214,.30)";
        else if (mv.kind === "base") fill = "rgba(216,75,67,.30)";
        ctx.fillStyle = fill;
        ctx.fillRect(s.x * cell + 2, s.y * cell + 2, cell - 4, cell - 4);
      }

      const selected = state.selected;
      if (selected?.kind === "piece") {
        const p = live.pieces.find(x => x.id === selected.id);
        if (p) {
          const s = boardToScreen(p.x, p.y);
          ctx.strokeStyle = "rgba(138,180,255,.95)";
          ctx.lineWidth = 4;
          ctx.strokeRect(s.x * cell + 3, s.y * cell + 3, cell - 6, cell - 6);
        }
      }

      for (const p of live.pieces) {
        const s = boardToScreen(p.x, p.y);
        drawPiece(p, { x:s.x * cell, y:s.y * cell, size:cell }, now, selected?.kind === "piece" && selected.id === p.id);
      }

      const ready = room?.mode !== "online" ? true : !!room?.players?.black && !!room?.players?.white;
      const countdown = ready ? getCountdownText(room?.matchStartAt, now) : null;

      if (live.winner) {
        ctx.fillStyle = "rgba(0,0,0,.35)";
        ctx.fillRect(0,0,w,h);
        ctx.fillStyle = "#fff";
        ctx.font = "800 26px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`勝者: ${live.winner === "black" ? "黒" : "白"}`, w / 2, h / 2 - 4);
        ctx.font = "500 15px system-ui, sans-serif";
        ctx.fillText("この対局は終了してるよ", w / 2, h / 2 + 22);
      } else if (!ready) {
        ctx.fillStyle = "rgba(0,0,0,.28)";
        ctx.fillRect(0,0,w,h);
        ctx.fillStyle = "#fff";
        ctx.font = "800 22px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("相手待ち", w / 2, h / 2 - 6);
        ctx.font = "500 14px system-ui, sans-serif";
        ctx.fillText("両方そろうまで移動できない", w / 2, h / 2 + 20);
      } else if (countdown) {
        ctx.fillStyle = "rgba(0,0,0,.28)";
        ctx.fillRect(0,0,w,h);
        ctx.fillStyle = "#fff";
        ctx.font = "900 54px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(countdown, w / 2, h / 2 + 10);
        ctx.font = "600 16px system-ui, sans-serif";
        ctx.fillText(countdown === "開始" ? "スタート" : "開始まで", w / 2, h / 2 + 44);
      }

      showRematchOverlayIfNeeded();
    }

    function renderLoop() {
      try {
        if (state.uiMode === "game") {
          if (!state.boardReady) resizeCanvas();
          const should = hasAnimatingState() || (Date.now() - state.lastRenderAt > 66);
          if (should) {
            renderGame();
            state.lastRenderAt = Date.now();
          }
          if (state.roomData?.mode === "cpu" || state.roomData?.mode === "cpu_serious") {
            scheduleCpuTick();
          }
        }
      } catch (err) {
        console.error(err);
        try { recoverCanvas(); } catch {}
      }
      requestAnimationFrame(renderLoop);
    }

    function getHandDropTarget(ev) {
      const sq = pointToSquare(ev);
      if (!sq) return null;
      const board = screenToBoard(sq.x, sq.y);
      const live = state.roomData?.state;
      if (!live) return null;
      if (pieceAt(live.pieces, board.x, board.y)) return null;
      return board;
    }

    function getSlidePieceTarget(releasePoint) {
      const live = state.roomData?.state;
      const piece = selectedPieceObj();
      if (!live || !piece) return null;

      const start = pieceScreenCenter(piece);
      const dragOct = octantFromVector(releasePoint.x - start.x, releasePoint.y - start.y);
      if (dragOct === null) return null;

      const legal = selectedLegalMoves(live);
      let best = null;
      let bestD = Infinity;

      for (const mv of legal) {
        const s = boardToScreen(mv.x, mv.y);
        const center = { x:s.x + 0.5, y:s.y + 0.5 };
        const mvOct = octantFromVector(center.x - start.x, center.y - start.y);
        if (mvOct !== dragOct) continue;
        const d = (center.x - releasePoint.x) ** 2 + (center.y - releasePoint.y) ** 2;
        if (d < bestD) {
          bestD = d;
          best = mv;
        }
      }
      return best;
    }

    async function commitMove(destBoard) {
      const live = state.roomData?.state;
      if (!live || !state.selected) return;

      if (state.roomData?.mode === "online") {
        if (!state.roomRef) return;
        if (!canAct()) return;

        await runTransaction(db, async (tx) => {
          const snap = await tx.get(state.roomRef);
          if (!snap.exists()) return;
          const room = snap.data();
          const current = room.state;
          if (!current || current.winner) return;

          const now = Date.now();
          if (room.matchStartAt && now < room.matchStartAt) return;

          const side = room.players?.black === state.playerId ? "black"
                     : room.players?.white === state.playerId ? "white"
                     : "spectator";
          if (side === "spectator") return;
          if (!canControlSide(selectedSideOfSelection())) return;

          const next = applyActionToLive(current, state.selected, side, destBoard, false);
          if (!next) return;

          const presence = room.presence || {};
          presence[state.playerId] = { side, lastSeen: now };

          const update = {
            state: next,
            presence,
            updatedAt: now
          };
          if (next.winner) update.lastWinnerSide = next.lastWinnerSide || next.winner;
          tx.update(state.roomRef, update);
        }).catch(err => setStatus(`動かせなかった: ${err.message}`));

        scheduleRender();
        return;
      }

      const anySide = state.roomData?.mode === "local_dual";
      const actorSide = state.roomData?.mode === "cpu" || state.roomData?.mode === "cpu_serious" ? "black" : null;
      const prev = cloneState(live);
      const next = applyActionToLive(live, state.selected, actorSide, destBoard, anySide);
      if (!next) return;

      state.roomData.state = next;
      state.roomData.updatedAt = Date.now();
      if (next.winner) state.roomData.lastWinnerSide = next.lastWinnerSide || next.winner;
      refreshHands();
      scheduleRender();

      if (state.roomData?.mode === "cpu" || state.roomData?.mode === "cpu_serious") {
        const actionMeta = buildActionMeta(prev, state.selected, destBoard);
        if (!next.winner) scheduleCpuTick();
      }
    }

    E.board.addEventListener("click", async (ev) => {
      if (performance.now() < state.suppressClickUntil) return;
      if (state.uiMode !== "game") return;
      if (!state.roomData) return;

      const sq = pointToSquare(ev);
      if (!sq) return;
      const clicked = pieceUnderScreenSquare(sq.x, sq.y);
      const mode = E.modeSelect.value;
      const live = state.roomData.state;

      if (mode === "tap") {
        if (!state.selected) {
          if (clicked && canInspectSide()) {
            state.selected = { kind:"piece", id: clicked.id };
            state.dragSource = "board";
            refreshHands();
            scheduleRender();
          }
          return;
        }

        if (state.selected.kind === "piece") {
          const selectedPiece = live.pieces.find(p => p.id === state.selected.id);
          if (selectedPiece) {
            const destBoard = screenToBoard(sq.x, sq.y);
            const legal = legalMovesForPiece(live, selectedPiece, true);
            const move = legal.find(m => m.x === destBoard.x && m.y === destBoard.y);
            if (move) {
              await commitMove(destBoard);
              clearSelection();
              return;
            }
          }
          if (clicked) {
            state.selected = { kind:"piece", id: clicked.id };
            state.dragSource = "board";
            refreshHands();
            scheduleRender();
            return;
          }
          clearSelection();
          return;
        }

        if (state.selected.kind === "hand") {
          await commitMove(screenToBoard(sq.x, sq.y));
          clearSelection();
          return;
        }
      }

      if (mode === "slide") {
        if (state.selected?.kind === "hand") {
          await commitMove(screenToBoard(sq.x, sq.y));
          clearSelection();
          return;
        }
        if (clicked) {
          state.selected = { kind:"piece", id: clicked.id };
          state.dragSource = "board";
          refreshHands();
          scheduleRender();
        }
      }
    });

    E.board.addEventListener("pointerdown", (ev) => {
      if (state.uiMode !== "game") return;
      if (E.modeSelect.value !== "slide") return;
      E.board.setPointerCapture(ev.pointerId);
      state.dragPointerId = ev.pointerId;
      state.dragStart = { x:ev.clientX, y:ev.clientY };
      state.dragging = false;
      state.dragSource = "board";

      const sq = pointToSquare(ev);
      if (!sq) return;
      const clicked = pieceUnderScreenSquare(sq.x, sq.y);
      const board = screenToBoard(sq.x, sq.y);

      if (state.selected?.kind === "hand") {
        const live = state.roomData?.state;
        const empty = live && !pieceAt(live.pieces, board.x, board.y);
        if (empty) {
          commitMove(board).then(() => clearSelection());
          return;
        }
      }

      if (clicked) {
        state.selected = { kind:"piece", id: clicked.id };
        state.dragSource = "board";
        refreshHands();
        scheduleRender();
      }
    });

    E.board.addEventListener("pointermove", (ev) => {
      if (state.uiMode !== "game") return;
      if (E.modeSelect.value !== "slide") return;
      if (state.dragPointerId !== ev.pointerId || !state.dragStart) return;
      const dx = ev.clientX - state.dragStart.x;
      const dy = ev.clientY - state.dragStart.y;
      if (Math.hypot(dx, dy) > 6) state.dragging = true;
    });

    document.addEventListener("pointerup", (ev) => {
      if (state.uiMode !== "game") return;
      if (E.modeSelect.value !== "slide") return;
      if (state.dragPointerId != null && state.dragPointerId !== ev.pointerId) return;

      state.suppressClickUntil = performance.now() + 250;

      if (state.selected?.kind === "piece" && state.dragging) {
        const release = pointFromEvent(ev);
        const target = getSlidePieceTarget(release);
        if (target) {
          const piece = selectedPieceObj();
          if (piece && canControlSide(piece.side)) {
            commitMove({ x:target.x, y:target.y }).then(() => clearSelection());
          }
        }
      }

      if (state.selected?.kind === "hand" && state.dragSource === "hand") {
        const target = getHandDropTarget(ev);
        if (target) commitMove(target).then(() => clearSelection());
      }

      state.dragPointerId = null;
      state.dragStart = null;
      state.dragging = false;
    }, true);

    E.board.addEventListener("pointercancel", () => {
      state.dragPointerId = null;
      state.dragStart = null;
      state.dragging = false;
      state.dragSource = null;
    });

    function pointFromEvent(ev) {
      const rect = E.board.getBoundingClientRect();
      return {
        x: (ev.clientX - rect.left) / rect.width * 9,
        y: (ev.clientY - rect.top) / rect.height * 9
      };
    }

    function updateFromRoomInput() {
      saveLastRoom(E.roomInput.value);
      updateSuggestions();
      renderGameModPill();

      const parsed = parseRoomInput(E.roomInput.value);
      if (parsed.mode === "game") {
        state.requestedModSpecs = parseModSelections(parsed.modPart || "");
        updateRoomModsFromSelection();
      }
    }

    function createAIChunkPreviewFromVersion(ver) {
      if (!ver) return "まだバージョンがないよ。";
      return `説明:\n${ver.summary || "(なし)"}\n\nAI入力:\n${ver.prompt || "(なし)"}\n\n変更内容:\n${JSON.stringify(ver.configPatch || {}, null, 2)}`;
    }

    E.roomInput.value = loadLastRoom();
    state.modLibrary = loadMods();
    state.requestedModSpecs = loadLastMods();
    updateRoomModsFromSelection();
    renderActiveModsPill();
    renderGameModPill();
    updateSuggestions();
    refreshHands();
    updateMePill();
    resizeCanvas();
    setViewMode("game");
    E.modView.style.display = "none";
    E.gameView.style.display = "block";
    showGame();

    if (/^MODS?$/i.test(String(E.roomInput.value || "").trim())) {
      showMods();
    }

    E.enterBtn.addEventListener("click", enterRoom);
    E.shareBtn.addEventListener("click", async () => {
      const code = String(E.roomInput.value || state.roomId || "").trim();
      if (!code) {
        setStatus("共有するコードがないよ。");
        return;
      }
      if (!navigator.share) {
        setStatus("この端末は共有に対応していないよ。");
        return;
      }
      try {
        await navigator.share({ text: code });
        setStatus(`コードを共有したよ: ${code}`);
      } catch (err) {
        if (err && err.name !== "AbortError") setStatus(`共有できなかった: ${err.message}`);
      }
    });

    E.modeSelect.addEventListener("change", () => {
      localStorage.setItem(LS.mode, E.modeSelect.value);
      state.selected = null;
      state.dragSource = null;
      refreshHands();
      scheduleRender();
    });

    E.roomInput.addEventListener("input", () => {
      updateFromRoomInput();
    });

    E.roomInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") enterRoom();
    });

    E.rematchYes.addEventListener("click", async () => {
      if (state.roomData?.mode !== "online") {
        const historyWinner = state.roomData?.lastWinnerSide || state.roomData?.state?.winner || null;
        state.roomData.state = freshState(buildRoyalLabels(historyWinner));
        state.roomData.matchStartAt = null;
        state.roomData.rematchVotes = {};
        state.roomData.updatedAt = Date.now();
        state.selected = null;
        refreshHands();
        scheduleRender();
        E.rematchOverlay.classList.remove("show");
        if (state.roomData?.mode === "cpu" || state.roomData?.mode === "cpu_serious") scheduleCpuTick(200);
        return;
      }
      if (!state.roomRef || !state.roomData) return;
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(state.roomRef);
        if (!snap.exists()) return;
        const data = snap.data() || {};
        const live = data.state || {};
        const players = data.players || {};
        const votes = data.rematchVotes || {};
        const now = Date.now();
        const side = players.black === state.playerId ? "black" : players.white === state.playerId ? "white" : "spectator";
        if (side === "spectator") return;
        if (!live.winner) return;
        votes[state.playerId] = true;
        const both = !!votes[players.black] && !!votes[players.white];
        if (both) {
          tx.update(state.roomRef, {
            state: freshState(buildRoyalLabels(data.lastWinnerSide || live.winner || null)),
            matchStartAt: now + state.runtime.matchCountdownMs,
            rematchVotes: {},
            updatedAt: now
          });
        } else {
          tx.update(state.roomRef, { rematchVotes: votes, updatedAt: now });
        }
      });
    });

    E.rematchNo.addEventListener("click", async () => {
      if (state.roomData?.mode !== "online") {
        leaveToHome();
        return;
      }
      if (!state.roomRef) return;
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(state.roomRef);
        if (!snap.exists()) return;
        tx.update(state.roomRef, { rematchVotes: {}, updatedAt: Date.now() });
      });
      leaveToHome();
    });

    E.backToGameBtn.addEventListener("click", showGame);
    E.saveAndBackBtn.addEventListener("click", () => { saveSelectedMod(); showGame(); });
    E.newModCard.addEventListener("click", () => {
      createNewMod();
      renderModsList();
      renderModEditor();
    });
    E.aiGenerateBtn.addEventListener("click", saveAndGenerateVersion);
    E.saveModBtn.addEventListener("click", saveSelectedMod);
    E.deleteModBtn.addEventListener("click", deleteSelectedMod);
    E.modNameInput.addEventListener("input", () => {
      E.modNameInput.value = sanitizeModName(E.modNameInput.value);
      const mod = currentMod();
      if (mod) mod.name = E.modNameInput.value;
    });
    E.modPromptInput.addEventListener("input", () => {
      state.editorDraft = state.editorDraft || {};
      state.editorDraft.prompt = E.modPromptInput.value;
    });

    window.addEventListener("resize", () => {
      resizeCanvas();
      scheduleRender();
    });

    window.addEventListener("error", () => {
      try { scheduleRender(); } catch {}
    });

    window.addEventListener("unhandledrejection", () => {
      try { scheduleRender(); } catch {}
    });

    setInterval(() => {
      if (state.uiMode !== "game") return;
      if (document.hidden) return;
      if (!state.boardReady) resizeCanvas();
      if (state.roomData?.mode === "cpu" || state.roomData?.mode === "cpu_serious") scheduleCpuTick();
    }, 3000);

    renderLoop();
    scheduleRender();
  </script>
</body>
</html>
