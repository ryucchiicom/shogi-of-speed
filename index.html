        App.roomData.updatedAt = now();
        if (next.winner) App.roomData.lastWinnerSide = next.lastWinnerSide || next.winner || null;
        updateHandsView();
        aiObserveTransition(prevLive, next, "white", pick.meta);
        scheduleRender();

        if (!next.winner) scheduleCpuThink();
      } finally {
        App.cpuThinking = false;
      }
    }

    async function loadOnlineRoom(roomId, requestedMods = []){
      roomId = String(roomId || "").trim().toUpperCase();
      if (!roomId) return;

      if (App.unsub) App.unsub();
      App.roomId = roomId;
      App.roomRef = doc(db, "rooms", roomId);
      App.selected = null;
      App.mySide = "spectator";
      renderMePill();
      applyActiveMods(requestedMods);

      await runTransaction(db, async (tx) => {
        const t = now();
        const snap = await tx.get(App.roomRef);

        if (!snap.exists()) {
          tx.set(App.roomRef, {
            players: { black: App.playerId, white: null },
            presence: { [App.playerId]: { side:"black", lastSeen:t } },
            state: freshState(),
            lastWinnerSide: null,
            matchStartAt: null,
            rematchVotes: {},
            transientMods: makeTransientModsPayload(App.activeMods),
            transientModsUpdatedAt: t,
            createdAt: t,
            updatedAt: t
          });
          return;
        }

        const data = snap.data() || {};
        let players = data.players || { black:null, white:null };
        let presence = data.presence || {};
        let roomState = data.state || freshState();
        let matchStartAt = data.matchStartAt || null;
        let rematchVotes = data.rematchVotes || {};
        let lastWinnerSide = data.lastWinnerSide || roomState.lastWinnerSide || null;

        if (!roomState.royalLabels) roomState.royalLabels = buildRoyalLabels(lastWinnerSide);
        if (Array.isArray(data.transientMods)) App.transientMods = data.transientMods;

        const currentAlready = players.black === App.playerId || players.white === App.playerId;
        const blackActive = !!players.black && !!presence[players.black] && (t - (presence[players.black].lastSeen || 0) < STALE_MS);
        const whiteActive = !!players.white && !!presence[players.white] && (t - (presence[players.white].lastSeen || 0) < STALE_MS);
        const bothInactive = !blackActive && !whiteActive;

        if (bothInactive && !roomState.winner) {
          players = { black: App.playerId, white: null };
          presence = { [App.playerId]: { side:"black", lastSeen:t } };
          roomState = freshState();
          matchStartAt = null;
          rematchVotes = {};
        } else if (roomState.winner && bothInactive) {
          players = { black: App.playerId, white: null };
          presence = { [App.playerId]: { side:"black", lastSeen:t } };
          roomState = freshState();
          matchStartAt = null;
          rematchVotes = {};
        } else if (!currentAlready) {
          if (!blackActive) {
            players.black = App.playerId;
            presence[App.playerId] = { side:"black", lastSeen:t };
          } else if (!whiteActive) {
            players.white = App.playerId;
            presence[App.playerId] = { side:"white", lastSeen:t };
          } else {
            presence[App.playerId] = { side:"spectator", lastSeen:t };
          }
        } else {
          const side = players.black === App.playerId ? "black" : "white";
          presence[App.playerId] = { side, lastSeen:t };
        }

        const bothReady = !!players.black && !!players.white;
        if (bothReady && !matchStartAt && !roomState.winner) matchStartAt = t + (App.runtime.matchCountdownMs || 3000);

        const update = {
          players,
          presence,
          state: roomState,
          lastWinnerSide,
          matchStartAt,
          rematchVotes,
          updatedAt: t
        };
        if (App.activeMods.length) {
          update.transientMods = makeTransientModsPayload(App.activeMods);
          update.transientModsUpdatedAt = t;
        }
        tx.update(App.roomRef, update);
      });

      App.unsub = onSnapshot(App.roomRef, (snap) => {
        if (!snap.exists()) {
          setStatus("ルームが見つからないよ。");
          return;
        }

        const data = snap.data();
        App.roomData = data;
        App.transientMods = Array.isArray(data.transientMods) ? data.transientMods : [];

        if (App.transientMods.length) {
          App.activeMods = App.transientMods.map(m => ({ ...m, source:"transient" }));
          applyRuntimeFromSelection();
          renderActiveModsChips();
          renderGameModPill();
        }

        const players = App.roomData.players || {};
        App.mySide = players.black === App.playerId ? "black" : players.white === App.playerId ? "white" : "spectator";

        if (App.selected?.kind === "piece") {
          const stillThere = App.roomData.state?.pieces?.some(p => p.id === App.selected.id);
          if (!stillThere) App.selected = null;
        }

        renderMePill();

        const live = App.roomData.state || {};
        if (live.winner) setStatus("勝敗がついたよ。");
        else if (!players.black || !players.white) setStatus(`ルーム ${App.roomId} に接続中。相手待ちだよ。`);
        else {
          const t = now();
          if (App.roomData.matchStartAt && t < App.roomData.matchStartAt) setStatus(`ルーム ${App.roomId} に接続中。開始カウントダウン中。`);
          else setStatus(`ルーム ${App.roomId} に接続中。`);
        }

        updateHandsView();
        renderGameModPill();
        scheduleRender();

        if ((App.roomData.mode === "cpu" || App.roomData.mode === "cpu_serious") && live && !live.winner) {
          scheduleCpuThink();
        }
      });

      setStatus(`ルーム ${roomId} に接続したよ。`);
      scheduleRender();
    }

    async function enterRoom(){
      const parsed = parseRoomInput(el.roomInput.value);

      if (parsed.mode === "mod_toggle") {
        toggleModManager();
        return;
      }

      if (parsed.mode !== "game") return;

      const roomId = String(parsed.baseRoom || "").trim().toUpperCase();
      const modSelections = parsed.modPart ? parseModSelections(parsed.modPart) : [];

      if (roomId === "MOD" || roomId === "MODS") {
        toggleModManager();
        return;
      }

      applyActiveMods(modSelections);

      if (roomId === "CPU" || roomId === "SERIOUSCPU" || roomId === "SERIOUS CPU" || roomId === "1 SMARTPHONE") {
        const mode = specialModeFromCode(roomId);
        setLocalRoom(mode);
        return;
      }

      if (!roomId && !modSelections.length) {
        const rand = randomRoomId();
        el.roomInput.value = rand;
        localStorage.setItem(LAST_ROOM_KEY, rand);
        await loadOnlineRoom(rand, []);
        return;
      }

      if (!roomId) {
        setStatus("ルームコードを入れてね。");
        return;
      }

      localStorage.setItem(LAST_ROOM_KEY, el.roomInput.value);
      await loadOnlineRoom(roomId, modSelections);
    }

    function specialModeFromCode(code){
      const c = String(code || "").trim().toUpperCase().replace(/[\s_]/g, "");
      if (c === "CPU") return "cpu";
      if (c === "SERIOUSCPU") return "cpu_serious";
      if (c === "1SMARTPHONE") return "local_dual";
      return "online";
    }

    function randomRoomId(){
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let s = "";
      for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    }

    async function refreshLocalRematchImmediate(){
      if (!App.roomData) return;
      const historyWinner = App.roomData.lastWinnerSide || App.roomData.state?.lastWinnerSide || App.roomData.state?.winner || null;
      App.roomData.state = freshState(buildRoyalLabels(historyWinner));
      App.roomData.state.royalLabels = buildRoyalLabels(historyWinner);
      App.roomData.lastWinnerSide = historyWinner;
      App.roomData.matchStartAt = null;
      App.roomData.rematchVotes = {};
      App.roomData.updatedAt = now();
      App.selected = null;
      resetLocalEpisode();
      updateHandsView();
      scheduleRender();
      if (App.roomData.mode === "cpu" || App.roomData.mode === "cpu_serious") scheduleCpuThink();
    }

    async function voteRematch(yes){
      if (App.roomData?.mode !== "online") {
        if (yes) {
          await refreshLocalRematchImmediate();
          el.rematchOverlay.classList.remove("show");
        } else {
          leaveToHome();
        }
        return;
      }

      if (!App.roomRef || !App.roomData) return;
      const room = App.roomData;
      if (!room.state?.winner || !room.players?.black || !room.players?.white) return;

      await runTransaction(db, async (tx) => {
        const snap = await tx.get(App.roomRef);
        if (!snap.exists()) return;

        const data = snap.data() || {};
        const live = data.state || {};
        const players = data.players || {};
        const rematchVotes = data.rematchVotes || {};
        const t = now();

        const mySide = players.black === App.playerId ? "black" : players.white === App.playerId ? "white" : "spectator";
        if (mySide === "spectator") return;
        if (!live.winner || !players.black || !players.white) return;

        if (yes) rematchVotes[App.playerId] = true;
        else delete rematchVotes[App.playerId];

        const blackPid = players.black;
        const whitePid = players.white;
        const bothYes = !!rematchVotes[blackPid] && !!rematchVotes[whitePid];
        const historyWinner = data.lastWinnerSide || live.lastWinnerSide || live.winner || null;

        if (bothYes) {
          tx.update(App.roomRef, {
            state: freshState(),
            lastWinnerSide: historyWinner,
            matchStartAt: t + (App.runtime.matchCountdownMs || 3000),
            rematchVotes: {},
            forceHomeAt: null,
            updatedAt: t
          });
          return;
        }

        if (!yes) {
          tx.update(App.roomRef, {
            rematchVotes: {},
            forceHomeAt: t,
            updatedAt: t
          });
          return;
        }

        tx.update(App.roomRef, {
          rematchVotes,
          updatedAt: t
        });
      }).catch(err => setStatus(`リマッチの処理に失敗した: ${err.message}`));

      if (!yes) leaveToHome();
    }

    function leaveToHome(){
      if (App.unsub) {
        App.unsub();
        App.unsub = null;
      }
      if (App.cpuTimer) clearTimeout(App.cpuTimer);
      App.cpuTimer = null;
      App.roomId = "";
      App.roomRef = null;
      App.roomData = null;
      App.mySide = "spectator";
      App.selected = null;
      App.dragPointerId = null;
      App.dragStart = null;
      App.dragging = false;
      App.dragSource = null;
      el.roomInput.value = "";
      hideRematchOverlay();
      localStorage.removeItem(LAST_ROOM_KEY);
      renderMePill();
      updateHandsView();
      setViewMode("game");
      setStatus("ルームコードを入れて「入室 / 作成」を押してね。");
      scheduleRender();
    }

    function hideRematchOverlay(){ el.rematchOverlay.classList.remove("show"); }
    function isBothPlayersReady(roomData){ return !!roomData?.players?.black && !!roomData?.players?.white; }
    function shouldShowRematch(roomData){
      if (!roomData) return false;
      if (!roomData.state?.winner) return false;
      return roomData.mode !== "online" ? true : isBothPlayersReady(roomData);
    }

    function selectModsFromRoomInput(){
      const parsed = parseRoomInput(el.roomInput.value);
      if (parsed.mode !== "game") return [];
      const selections = parseModSelections(parsed.modPart || "");
      App.requestedModSpecs = selections;
      const resolved = resolveModsForSelections(selections, [...App.modLibrary, ...App.transientMods]);
      App.activeMods = resolved;
      saveLastModSelection(selections);
      applyRuntimeFromSelection();
      renderActiveModsChips();
      renderGameModPill();
      return resolved;
    }

    function updateRoomUIFromInput(){
      const parsed = parseRoomInput(el.roomInput.value);
      if (parsed.mode === "mod_toggle") {
        el.modHintRow.classList.add("show");
        el.modHintRow.innerHTML = `<span class="pill">MOD画面に入るよ</span>`;
        return;
      }
      if (parsed.mode === "game") {
        const selections = parseModSelections(parsed.modPart || "");
        if (selections.length) applyActiveMods(selections);
        updateModSuggestions();
        renderGameModPill();
      }
    }

    async function commitMove(destBoard){
      const live = App.roomData?.state;
      if (!live || !App.selected) return;

      if (App.roomData?.mode === "online") {
        if (!App.roomRef) return;
        if (!canAct()) return;

        await runTransaction(db, async (tx) => {
          const snap = await tx.get(App.roomRef);
          if (!snap.exists()) return;

          const room = snap.data();
          const currentLive = room.state;
          if (!currentLive || currentLive.winner) return;

          const t = now();
          if (room.matchStartAt && t < room.matchStartAt) return;

          const side = room.players?.black === App.playerId ? "black" : room.players?.white === App.playerId ? "white" : "spectator";
          if (side === "spectator") return;

          const next = applyActionToState(currentLive, App.selected, side, destBoard, false);
          if (!next) return;

          const presence = room.presence || {};
          presence[App.playerId] = { side, lastSeen: t };

          const update = { state: next, presence, updatedAt: t };
          if (App.activeMods.length) {
            update.transientMods = makeTransientModsPayload(App.activeMods);
            update.transientModsUpdatedAt = t;
          }
          if (next.winner) update.lastWinnerSide = next.lastWinnerSide || next.winner;
          tx.update(App.roomRef, update);
        }).catch(err => setStatus(`動かせなかった: ${err.message}`));

        scheduleRender();
        return;
      }

      const anySide = App.roomData?.mode === "local_dual";
      const actorSide = (App.roomData?.mode === "cpu" || App.roomData?.mode === "cpu_serious") ? "black" : null;
      const selected = App.selected.kind === "piece" || App.selected.kind === "hand" ? App.selected : null;
      const prevLive = cloneState(live);
      const next = applyActionToState(live, selected, actorSide, destBoard, anySide);
      if (!next) return;

      App.roomData.state = next;
      if (next.winner) App.roomData.lastWinnerSide = next.lastWinnerSide || next.winner || null;
      App.roomData.updatedAt = now();
      updateHandsView();
      scheduleRender();

      if (App.roomData?.mode === "cpu" || App.roomData?.mode === "cpu_serious") {
        const actionMeta = buildActionMeta(prevLive, selected, destBoard);
        aiObserveTransition(prevLive, next, actorSide, actionMeta);
        if (!next.winner) scheduleCpuThink();
      }
    }

    function clearTimers(){
      if (App.cpuTimer) clearTimeout(App.cpuTimer);
      App.cpuTimer = null;
    }

    function init(){
      App.modLibrary = loadModLibrary();
      loadLocalAIMemory();
      App.runtime = buildRuntimeFromMods([]);
      applyRuntimeToCSS();

      const savedRoom = localStorage.getItem(LAST_ROOM_KEY) || "";
      el.roomInput.value = savedRoom;

      const lastMods = loadLastModSelection();
      if (lastMods.length) {
        App.activeMods = resolveModsForSelections(lastMods, App.modLibrary);
        applyRuntimeFromSelection();
      }

      if (/^(MODS?)$/i.test(String(el.roomInput.value || "").trim())) {
        setViewMode("mods");
      } else {
        setViewMode("game");
      }

      renderMePill();
      renderActiveModsChips();
      renderGameModPill();
      updateModSuggestions();
      updateHandsView();
      refreshModList();
      refreshModEditor();
      syncCanvasSize();
      scheduleRender();
      setStatus("ルームコードを入れて「入室 / 作成」を押してね。");
    }

    function scheduleUiLoop(){
      if (App.uiMode === "game") {
        syncCanvasSize();
        if (App.roomData?.mode === "cpu" || App.roomData?.mode === "cpu_serious") {
          if (!App.cpuTimer && App.roomData?.state && !App.roomData.state.winner) scheduleCpuThink();
        }
        if (hasAnimatingState()) scheduleRender();
      }
      requestAnimationFrame(scheduleUiLoop);
    }

    // events
    el.enterBtn.addEventListener("click", async () => { await enterRoom(); });
    el.shareBtn.addEventListener("click", async () => {
      const code = String(el.roomInput.value || App.roomId || (App.roomData?.mode === "cpu" ? "CPU" : App.roomData?.mode === "cpu_serious" ? "SERIOUS CPU" : App.roomData?.mode === "local_dual" ? "1 SMARTPHONE" : "")).trim();
      if (!code) {
        setStatus("共有するコードがないよ。");
        return;
      }
      if (!navigator.share) {
        setStatus("この端末は共有に対応していないよ。");
        return;
      }
      try{
        await navigator.share({ text: code });
        setStatus(`コードを共有したよ: ${code}`);
      }catch(err){
        if (err && err.name !== "AbortError") setStatus(`共有できなかった: ${err.message}`);
      }
    });

    el.roomInput.addEventListener("input", () => {
      localStorage.setItem(LAST_ROOM_KEY, el.roomInput.value || "");
      updateRoomUIFromInput();
      renderGameModPill();
      if (App.uiMode === "game") selectModsFromRoomInput();
    });
    el.roomInput.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter") return;
      const parsed = parseRoomInput(el.roomInput.value);
      if (parsed.mode === "mod_toggle" || /^(MODS?)$/i.test(String(el.roomInput.value || "").trim())) {
        toggleModManager();
        return;
      }
      await enterRoom();
    });

    el.modeSelect.addEventListener("change", () => {
      localStorage.setItem("shogi_of_speed_mode", el.modeSelect.value);
      App.selected = null;
      App.dragSource = null;
      updateHandsView();
      scheduleRender();
    });

    el.rematchYes.addEventListener("click", () => voteRematch(true));
    el.rematchNo.addEventListener("click", () => voteRematch(false));
    el.newModCard.addEventListener("click", createEmptyMod);
    el.backToGameBtn.addEventListener("click", () => setViewMode("game"));
    el.saveAndBackBtn.addEventListener("click", () => { saveCurrentMod(); setViewMode("game"); });
    el.aiGenerateBtn.addEventListener("click", saveAndGenerateVersion);
    el.saveModBtn.addEventListener("click", saveCurrentMod);
    el.deleteModBtn.addEventListener("click", deleteSelectedMod);

    el.modNameInput.addEventListener("input", () => {
      el.modNameInput.value = sanitizeModName(el.modNameInput.value);
      const mod = currentSelectedMod();
      if (mod) mod.name = el.modNameInput.value;
    });

    el.modPromptInput.addEventListener("input", () => {
      const mod = currentSelectedMod();
      if (!mod) return;
      mod.name = sanitizeModName(el.modNameInput.value);
    });

    el.board.addEventListener("click", async (ev) => {
      if (performance.now() < App.suppressClickUntil) return;
      if (!App.roomData || App.uiMode !== "game") return;

      const sq = pointToSquare(ev);
      if (!sq) return;

      const clickedBoard = screenToBoard(sq.x, sq.y);
      const clicked = pieceAt(App.roomData.state?.pieces || [], clickedBoard.x, clickedBoard.y);
      const mode = el.modeSelect.value;
      const live = App.roomData.state;

      if (mode === "tap") {
        if (!App.selected) {
          if (clicked && canControlSide(clicked.side)) {
            App.selected = { kind:"piece", id: clicked.id };
            App.dragSource = "board";
            updateHandsView();
            scheduleRender();
          }
          return;
        }

        if (App.selected.kind === "piece") {
          const selectedPiece = live.pieces.find(p => p.id === App.selected.id);
          if (selectedPiece && canControlSide(selectedPiece.side)) {
            const move = legalMovesForPiece(live, selectedPiece).find(m => m.x === clickedBoard.x && m.y === clickedBoard.y);
            if (move) {
              await commitMove(clickedBoard);
              clearSelection();
              return;
            }
          }
          if (clicked && canControlSide(clicked.side)) {
            App.selected = { kind:"piece", id: clicked.id };
            App.dragSource = "board";
            updateHandsView();
            scheduleRender();
            return;
          }
          clearSelection();
          return;
        }

        if (App.selected.kind === "hand") {
          await commitMove(clickedBoard);
          clearSelection();
          return;
        }
      }

      if (mode === "slide") {
        if (App.selected?.kind === "hand") {
          await commitMove(clickedBoard);
          clearSelection();
          return;
        }
        if (clicked && canControlSide(clicked.side)) {
          App.selected = { kind:"piece", id: clicked.id };
          App.dragSource = "board";
          updateHandsView();
          scheduleRender();
        }
      }
    });

    el.board.addEventListener("pointerdown", (ev) => {
      if (App.uiMode !== "game") return;
      if (el.modeSelect.value !== "slide") return;

      el.board.setPointerCapture(ev.pointerId);
      App.dragPointerId = ev.pointerId;
      App.dragStart = { x: ev.clientX, y: ev.clientY };
      App.dragging = false;
      App.dragSource = "board";

      const sq = pointToSquare(ev);
      if (!sq) return;
      const board = screenToBoard(sq.x, sq.y);
      const clicked = pieceAt(App.roomData?.state?.pieces || [], board.x, board.y);

      if (App.selected?.kind === "hand") {
        const live = App.roomData?.state;
        const empty = live && !pieceAt(live.pieces, board.x, board.y);
        if (empty) {
          commitMove(board).then(() => clearSelection());
          return;
        }
      }

      if (clicked && canControlSide(clicked.side)) {
        App.selected = { kind:"piece", id: clicked.id };
        App.dragSource = "board";
        updateHandsView();
        scheduleRender();
      }
    });

    el.board.addEventListener("pointermove", (ev) => {
      if (App.uiMode !== "game") return;
      if (el.modeSelect.value !== "slide") return;
      if (App.dragPointerId !== ev.pointerId || !App.dragStart) return;
      const dx = ev.clientX - App.dragStart.x;
      const dy = ev.clientY - App.dragStart.y;
      if (Math.hypot(dx, dy) > 6) App.dragging = true;
    });

    function finishSlidePointer(ev){
      if (App.uiMode !== "game") return;
      if (el.modeSelect.value !== "slide") return;
      if (App.dragPointerId != null && App.dragPointerId !== ev.pointerId) return;

      App.suppressClickUntil = performance.now() + 250;

      if (App.selected && App.selected.kind === "piece" && App.dragging) {
        const release = pointFromCanvasEvent(ev);
        const targetMove = getSlidePieceTarget(release);
        if (targetMove) {
          const live = App.roomData?.state;
          const selectedPiece = live?.pieces.find(p => p.id === App.selected.id);
          if (selectedPiece && canControlSide(selectedPiece.side)) {
            commitMove({ x:targetMove.x, y:targetMove.y }).then(() => clearSelection());
          }
        }
      }

      if (App.selected && App.selected.kind === "hand" && App.dragSource === "hand") {
        const targetBoard = getHandDropTarget(ev);
        if (targetBoard) {
          commitMove(targetBoard).then(() => clearSelection());
        }
      }

      App.dragPointerId = null;
      App.dragStart = null;
      App.dragging = false;
    }

    function pointFromCanvasEvent(ev){
      const rect = el.board.getBoundingClientRect();
      return {
        x: (ev.clientX - rect.left) / rect.width * 9,
        y: (ev.clientY - rect.top) / rect.height * 9
      };
    }
    document.addEventListener("pointerup", finishSlidePointer, true);
    el.board.addEventListener("pointercancel", () => {
      App.dragPointerId = null;
      App.dragStart = null;
      App.dragging = false;
      App.dragSource = null;
    });

    function cpuTickSafety(){
      if ((App.roomData?.mode === "cpu" || App.roomData?.mode === "cpu_serious") && !App.cpuTimer && App.roomData?.state && !App.roomData.state.winner) {
        scheduleCpuThink();
      }
    }

    function hideRematchOverlaySafe(){
      el.rematchOverlay.classList.remove("show");
    }

    function initApp(){
      syncCanvasSize();
      App.modLibrary = loadModLibrary();
      loadLocalAIMemory();
      const savedRoom = localStorage.getItem(LAST_ROOM_KEY) || "";
      el.roomInput.value = savedRoom;
      const savedMode = localStorage.getItem("shogi_of_speed_mode");
      if (savedMode === "tap" || savedMode === "slide") el.modeSelect.value = savedMode;

      const lastMods = loadLastModSelection();
      if (lastMods.length) {
        App.activeMods = resolveModsForSelections(lastMods, App.modLibrary);
        applyRuntimeFromSelection();
      } else {
        App.runtime = buildRuntimeFromMods([]);
        applyRuntimeToCSS();
      }

      if (/^(MODS?)$/i.test(String(el.roomInput.value || "").trim())) setViewMode("mods");
      else setViewMode("game");

      renderMePill();
      renderActiveModsChips();
      renderGameModPill();
      updateModSuggestions();
      updateHandsView();
      refreshModList();
      refreshModEditor();
      scheduleRender();
      setStatus("ルームコードを入れて「入室 / 作成」を押してね。");
    }

    window.addEventListener("resize", () => { syncCanvasSize(); scheduleRender(); });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => { syncCanvasSize(); scheduleRender(); }, { passive:true });
      window.visualViewport.addEventListener("scroll", () => scheduleRender(), { passive:true });
    }

    window.addEventListener("error", (e) => {
      console.error(e.error || e.message);
      recoverCanvas();
    });
    window.addEventListener("unhandledrejection", (e) => {
      console.error(e.reason);
      recoverCanvas();
    });

    el.enterBtn.addEventListener("click", async () => { await enterRoom(); });
    el.roomInput.addEventListener("input", () => {
      localStorage.setItem(LAST_ROOM_KEY, el.roomInput.value || "");
      updateRoomUIFromInput();
      renderGameModPill();
      if (App.uiMode === "game") selectModsFromRoomInput();
    });
    el.roomInput.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter") return;
      const parsed = parseRoomInput(el.roomInput.value);
      if (parsed.mode === "mod_toggle" || /^(MODS?)$/i.test(String(el.roomInput.value || "").trim())) {
        toggleModManager();
        return;
      }
      await enterRoom();
    });

    el.shareBtn.addEventListener("click", async () => {
      const code = String(el.roomInput.value || App.roomId || (App.roomData?.mode === "cpu" ? "CPU" : App.roomData?.mode === "cpu_serious" ? "SERIOUS CPU" : App.roomData?.mode === "local_dual" ? "1 SMARTPHONE" : "")).trim();
      if (!code) {
        setStatus("共有するコードがないよ。");
        return;
      }
      if (!navigator.share) {
        setStatus("この端末は共有に対応していないよ。");
        return;
      }
      try{
        await navigator.share({ text: code });
        setStatus(`コードを共有したよ: ${code}`);
      }catch(err){
        if (err && err.name !== "AbortError") setStatus(`共有できなかった: ${err.message}`);
      }
    });

    el.modeSelect.addEventListener("change", () => {
      localStorage.setItem("shogi_of_speed_mode", el.modeSelect.value);
      App.selected = null;
      App.dragSource = null;
      updateHandsView();
      scheduleRender();
    });

    el.rematchYes.addEventListener("click", () => voteRematch(true));
    el.rematchNo.addEventListener("click", () => voteRematch(false));
    el.newModCard.addEventListener("click", createEmptyMod);
    el.backToGameBtn.addEventListener("click", () => setViewMode("game"));
    el.saveAndBackBtn.addEventListener("click", () => { saveCurrentMod(); setViewMode("game"); });
    el.aiGenerateBtn.addEventListener("click", saveAndGenerateVersion);
    el.saveModBtn.addEventListener("click", saveCurrentMod);
    el.deleteModBtn.addEventListener("click", deleteSelectedMod);

    el.modNameInput.addEventListener("input", () => {
      el.modNameInput.value = sanitizeModName(el.modNameInput.value);
      const mod = currentSelectedMod();
      if (mod) mod.name = el.modNameInput.value;
    });

    el.modPromptInput.addEventListener("input", () => {
      const mod = currentSelectedMod();
      if (!mod) return;
      mod.name = sanitizeModName(el.modNameInput.value);
    });

    App.modLibrary = loadModLibrary();
    initApp();
    requestAnimationFrame(scheduleUiLoop);

    function loadRoomPresenceHeartbeat(){
      if (!App.roomRef || App.uiMode !== "game") return;
      if (App.roomData?.mode !== "online") return;
      if (App.mySide === "spectator") return;
      runTransaction(db, async (tx) => {
        const snap = await tx.get(App.roomRef);
        if (!snap.exists()) return;
        const data = snap.data() || {};
        const presence = data.presence || {};
        presence[App.playerId] = { side: App.mySide, lastSeen: now() };
        tx.update(App.roomRef, { presence, updatedAt: now() });
      }).catch(() => {});
    }
    setInterval(loadRoomPresenceHeartbeat, 10000);

    function syncOnlineModsIfNeeded(){
      if (!App.roomRef || App.roomData?.mode !== "online") return;
      if (App.mySide !== "black") return;
      if (!App.activeMods.length) return;
      runTransaction(db, async (tx) => {
        const snap = await tx.get(App.roomRef);
        if (!snap.exists()) return;
        const t = now();
        tx.update(App.roomRef, {
          transientMods: makeTransientModsPayload(App.activeMods),
          transientModsUpdatedAt: t,
          updatedAt: t
        });
      }).catch(() => {});
    }

    window.addEventListener("focus", () => {
      syncCanvasSize();
      scheduleRender();
      syncOnlineModsIfNeeded();
      cpuTickSafety();
    });

    setInterval(() => {
      if (App.uiMode !== "game") return;
      if (App.roomData?.mode === "cpu" || App.roomData?.mode === "cpu_serious") cpuTickSafety();
      if (hasAnimatingState()) scheduleRender();
    }, 250);

  })().catch(err => {
    console.error(err);
    document.body.innerHTML = `<pre style="white-space:pre-wrap;padding:16px;color:#fff;background:#111;">起動時エラー: ${String(err && err.message ? err.message : err)}</pre>`;
  });
</script>
</body>
</html>
