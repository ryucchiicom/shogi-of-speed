    }

    function getHandCooldownRemaining(side, now) {
      const live = state.roomData?.state;
      return Math.max(0, (live?.handCooldownUntil?.[side] || 0) - now);
    }

    function updateHandCooldownIndicators(now) {
      const live = state.roomData?.state;
      if (!live) return;
      const buttons = [...myHandsEl.querySelectorAll(".handBtn"), ...enemyHandsEl.querySelectorAll(".handBtn")];
      for (const btn of buttons) {
        const side = btn.dataset.side;
        const ring = btn.querySelector(".handCooldown");
        if (!ring) continue;
        const rem = Math.max(0, (live.handCooldownUntil?.[side] || 0) - now);
        ring.style.opacity = rem > 0 ? "1" : "0";
        if (rem > 0) ring.style.setProperty("--cd", String(Math.max(0, Math.min(1, rem / currentCooldownMs()))));
      }
    }

    function drawBoardPlaceholderIfNeeded(w, h) {
      if (state.roomData?.state) return;
      ctx.fillStyle = "rgba(0,0,0,.45)";
      ctx.font = "600 16px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("ルーム接続待ち", w / 2, h / 2);
    }

    function renderHands() {
      refreshHands();
    }

    function drawGame() {
      const rect = boardCanvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      const cell = w / 9;
      const now = Date.now();

      ctx.clearRect(0, 0, w, h);

      const live = state.roomData?.state;
      if (!live) {
        drawBoardPlaceholderIfNeeded(w, h);
        scheduleRender();
        return;
      }

      const cs = getComputedStyle(document.documentElement);
      const boardDark = cs.getPropertyValue("--board-dark").trim() || DEFAULT_THEME.boardDark;
      const boardLight = cs.getPropertyValue("--board-light").trim() || DEFAULT_THEME.boardLight;

      for (let sy = 0; sy < 9; sy++) {
        for (let sx = 0; sx < 9; sx++) {
          const board = screenToBoard(sx, sy);
          ctx.fillStyle = (board.x + board.y) % 2 === 0 ? boardLight : boardDark;
          ctx.fillRect(sx * cell, sy * cell, cell, cell);
        }
      }

      ctx.strokeStyle = "rgba(104,79,42,.55)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= 9; i++) {
        ctx.beginPath();
        ctx.moveTo(i * cell, 0);
        ctx.lineTo(i * cell, 9 * cell);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * cell);
        ctx.lineTo(9 * cell, i * cell);
        ctx.stroke();
      }

      const selectedLegal = selectedLegalMoves(live);
      for (const m of selectedLegal) {
        const s = boardToScreen(m.x, m.y);
        ctx.fillStyle = drawColorForKind(m.kind);
        ctx.fillRect(s.x * cell + 2, s.y * cell + 2, cell - 4, cell - 4);
      }

      const sel = selectedPieceObj();
      if (sel) {
        const s = boardToScreen(sel.x, sel.y);
        ctx.strokeStyle = "rgba(138,180,255,.95)";
        ctx.lineWidth = 4;
        ctx.strokeRect(s.x * cell + 3, s.y * cell + 3, cell - 6, cell - 6);
      }

      for (const p of live.pieces) {
        const sp = boardToScreen(p.x, p.y);
        const isSel = state.selected?.kind === "piece" && state.selected.id === p.id;
        drawPiece(p, { x: sp.x * cell, y: sp.y * cell, size: cell }, now, isSel);
      }

      const bothReady = session.kind !== "online" ? true : isBothPlayersReady(state.roomData);
      const countdownText = bothReady ? getCountdownText(state.roomData?.matchStartAt, now) : null;

      if (live.winner) {
        ctx.fillStyle = "rgba(0,0,0,.38)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "800 26px system-ui, sans-serif";
        ctx.fillText(`勝者: ${live.winner === "black" ? "黒" : "白"}`, w / 2, h / 2 - 6);
        ctx.font = "500 15px system-ui, sans-serif";
        ctx.fillText("この対局は終了したよ", w / 2, h / 2 + 20);
      } else if (session.kind === "online" && !bothReady) {
        ctx.fillStyle = "rgba(0,0,0,.28)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "800 22px system-ui, sans-serif";
        ctx.fillText("相手待ち", w / 2, h / 2 - 6);
      } else if (countdownText) {
        ctx.fillStyle = "rgba(0,0,0,.28)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "900 54px system-ui, sans-serif";
        ctx.fillText(countdownText, w / 2, h / 2 + 10);
      }

      updateHandCooldownIndicators(now);
      scheduleRender();
    }

    function octantFromVector(dx, dy) {
      if (dx === 0 && dy === 0) return null;
      const angle = Math.atan2(dy, dx);
      let idx = Math.round(angle / (Math.PI / 4));
      idx = ((idx % 8) + 8) % 8;
      return idx;
    }

    function loadCurrentActiveMods() {
      return loadCompiledModsFromRoomCode();
    }

    function applyActiveModsForRoom() {
      state.activeMods = loadCurrentActiveMods();
      activeModsSave(parseMatchCode(roomInput.value).mods.slice(0,2));
      syncThemeFromMods();
    }

    function refreshSelectionAfterMove() {
      state.selected = null;
      refreshHands();
      scheduleRender(0);
    }

    function commitSlideOrTapToMove(board) {
      return commitMove(board).then(moved => {
        if (moved) refreshSelectionAfterMove();
        return moved;
      });
    }

    boardCanvas.addEventListener("click", async ev => {
      if (performance.now() < state.suppressClickUntil) return;
      if (state.view !== "game") return;
      if (!state.roomData?.state) return;

      const sq = pointToSquare(ev);
      if (!sq) return;

      const clicked = pieceUnderSquare(sq.x, sq.y);
      const mode = modeSelect.value;
      const live = state.roomData.state;

      if (mode === "tap") {
        if (!state.selected) {
          if (clicked) {
            state.selected = { kind:"piece", id: clicked.id };
            refreshHands();
            scheduleRender(0);
          }
          return;
        }

        if (state.selected.kind === "piece") {
          const selectedPiece = live.pieces.find(p => p.id === state.selected.id);
          if (selectedPiece) {
            const board = screenToBoard(sq.x, sq.y);
            const legal = legalMovesForPiece(live, selectedPiece);
            const move = legal.find(m => m.x === board.x && m.y === board.y);
            if (move && canControlSide(selectedPiece.side)) {
              const moved = await commitMove(board);
              if (moved) refreshSelectionAfterMove();
              return;
            }
          }

          if (clicked) {
            state.selected = { kind:"piece", id: clicked.id };
            refreshHands();
            scheduleRender(0);
          } else {
            clearSelection();
          }
          return;
        }

        if (state.selected.kind === "hand") {
          const board = screenToBoard(sq.x, sq.y);
          const moved = await commitMove(board);
          if (moved) refreshSelectionAfterMove();
          return;
        }
      }

      if (mode === "slide") {
        if (state.selected?.kind === "hand") {
          const board = screenToBoard(sq.x, sq.y);
          const moved = await commitMove(board);
          if (moved) refreshSelectionAfterMove();
          return;
        }

        if (clicked) {
          state.selected = { kind:"piece", id: clicked.id };
          refreshHands();
          scheduleRender(0);
        }
      }
    });

    boardCanvas.addEventListener("pointerdown", ev => {
      if (modeSelect.value !== "slide" || state.view !== "game") return;
      canMovePointerStartSlide(ev);

      const sq = pointToSquare(ev);
      if (!sq) return;
      const clicked = pieceUnderSquare(sq.x, sq.y);
      const board = screenToBoard(sq.x, sq.y);

      if (state.selected?.kind === "hand") {
        const live = state.roomData?.state;
        if (live && !pieceAt(live.pieces, board.x, board.y)) {
          commitMove(board).then(moved => {
            if (moved) refreshSelectionAfterMove();
          });
          return;
        }
      }

      if (clicked) {
        state.selected = { kind:"piece", id: clicked.id };
        refreshHands();
        scheduleRender(0);
      }
    });

    boardCanvas.addEventListener("pointermove", ev => {
      if (modeSelect.value !== "slide" || state.view !== "game") return;
      if (state.dragPointerId !== ev.pointerId || !state.dragStart) return;
      const dx = ev.clientX - state.dragStart.x;
      const dy = ev.clientY - state.dragStart.y;
      if (Math.hypot(dx, dy) > 6) state.dragging = true;
    });

    document.addEventListener("pointerup", ev => {
      if (modeSelect.value !== "slide" || state.view !== "game") return;
      if (state.dragPointerId != null && state.dragPointerId !== ev.pointerId) return;

      state.suppressClickUntil = performance.now() + 250;

      if (state.selected?.kind === "piece" && state.dragging) {
        const rect = boardCanvas.getBoundingClientRect();
        const releasePoint = {
          x: (ev.clientX - rect.left) / rect.width * 9,
          y: (ev.clientY - rect.top) / rect.height * 9
        };
        const target = getSlidePieceTarget(releasePoint);
        if (target) {
          commitMove({ x: target.x, y: target.y }).then(moved => {
            if (moved) refreshSelectionAfterMove();
          });
        }
      }

      if (state.selected?.kind === "hand" && state.dragStart) {
        const target = getHandDropTarget(ev);
        if (target) {
          commitMove(target).then(moved => {
            if (moved) refreshSelectionAfterMove();
          });
        }
      }

      state.dragPointerId = null;
      state.dragStart = null;
      state.dragging = false;
    }, true);

    boardCanvas.addEventListener("pointercancel", () => {
      state.dragPointerId = null;
      state.dragStart = null;
      state.dragging = false;
    });

    function shouldShowRematch(roomData) {
      if (!roomData) return false;
      if (!roomData.state?.winner) return false;
      return session.kind === "online" ? isBothPlayersReady(roomData) : true;
    }

    function updateRematchOverlay() {
      const room = state.roomData;
      if (!shouldShowRematch(room)) {
        rematchOverlay.classList.remove("show");
        return;
      }

      const winnerRaw = room.state?.winner;
      let winnerText = "決着";
      if (winnerRaw === "black") {
        if (session.kind === "cpu") winnerText = "あなたの勝ち";
        else if (session.kind === "local_dual") winnerText = "勝者: 先手";
        else winnerText = (state.mySide === "black") ? "あなたの勝ち" : "あなたの負け";
      } else if (winnerRaw === "white") {
        if (session.kind === "cpu") winnerText = "あなたの負け";
        else if (session.kind === "local_dual") winnerText = "勝者: 後手";
        else winnerText = (state.mySide === "white") ? "あなたの勝ち" : "あなたの負け";
      }
      rematchWinner.textContent = winnerText;

      if (session.kind !== "online") {
        rematchDesc.textContent = "はいを押したらすぐ次の試合が始まるよ。";
        rematchOverlay.classList.add("show");
        return;
      }

      const votes = room.rematchVotes || {};
      const me = votes[state.pid] ? "はいを押してあるよ。" : "まだ返事してないよ。";
      const otherSide = state.mySide === "black" ? "white" : "black";
      const otherPid = room.players?.[otherSide];
      const otherVote = otherPid ? !!votes[otherPid] : false;
      const other = otherVote ? "相手もはいを押してるよ。" : "相手の返事待ちだよ。";
      rematchDesc.textContent = `${me}\n${other}`;
      rematchOverlay.classList.add("show");
    }

    rematchYes.addEventListener("click", () => voteRematch(true));
    rematchNo.addEventListener("click", () => voteRematch(false));

    // local/CPU setup if user immediately chooses special code
    if (normalizeCode(roomInput.value) === "CPU") {
      setLocalSession("cpu");
    } else if (normalizeCode(roomInput.value) === "1 SMARTPHONE") {
      setLocalSession("local_dual");
    }

    // Attach actions that need definitions after all functions exist
    function pieceScreenCenter(piece) {
      const s = boardToScreen(piece.x, piece.y);
      return { x: s.x + 0.5, y: s.y + 0.5 };
    }

    function finishInitialization() {
      const parsed = parseMatchCode(roomInput.value);
      if (parsed.base === "CPU") {
        setLocalSession("cpu");
      } else if (parsed.base === "1SMARTPHONE" || parsed.base === "1 SMARTPHONE") {
        setLocalSession("local_dual");
      } else {
        syncThemeFromMods();
        renderHands();
        updateMePill();
        resizeCanvas();
        scheduleRender(0);
      }
    }

    // ensure modal pieces sync
    function updateModalButtons() {
      refreshModHubButtonState();
    }

    // hook share and enter
    enterBtn.addEventListener("click", handleEnterRoom);

    // final UI setup
    initializeRoomCodeMods();
    refreshHands();
    updateMePill();
    resizeCanvas();
    scheduleRender(0);
    setStatusText("ROOM CODE を入れて「入室 / 作成」を押してね。MOD と入力するとMOD制作画面になるよ。");
    if (normalizeCode(roomInput.value) === "CPU") scheduleCpuLoop();
    refreshModHubButtonState();

    // kick render loop
    function tick() {
      renderFrame();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
