<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>counter</title>

<style>
    body {
        margin: 0;
        font-family: sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        user-select: none;
        transition: 0.2s;
    }

    #counter {
        font-size: 80px;
    }

    #step {
        font-size: 20px;
        margin-top: 10px;
        opacity: 0;
        transition: 0.15s;
    }

    #mobileControls {
        position: fixed;
        bottom: 20px;
        display: none;
        gap: 10px;
    }

    button {
        font-size: 24px;
        padding: 15px 25px;
        border: none;
        border-radius: 10px;
        background: #333;
        color: white;
    }

    button:active {
        background: #555;
    }

    @media (pointer: coarse) {
        #mobileControls {
            display: flex;
        }
    }
</style>
</head>

<body>

<div id="counter">0</div>
<div id="step">step: 1</div>

<div id="mobileControls">
    <button onclick="change(-step)">-</button>
    <button onclick="reset()">0</button>
    <button onclick="change(step)">+</button>
</div>

<script>
let count = 0;
let step = 1;

// true = 白文字 / false = 黒文字
let isWhite = true;

const counter = document.getElementById("counter");
const stepDisplay = document.getElementById("step");

function applyTheme() {
    if (isWhite) {
        document.body.style.background = "#000";
        document.body.style.color = "#fff";
    } else {
        document.body.style.background = "#fff";
        document.body.style.color = "#000";
    }
}

function update() {
    counter.textContent = count;
    stepDisplay.textContent = "step: " + step;
}

function change(val) {
    count += val;
    update();
}

function reset() {
    count = 0;
    update();
}

// 文字色切り替え
document.addEventListener("keydown", (e) => {
    if (e.key.toLowerCase() === "l") {
        isWhite = true;
        applyTheme();
    }

    if (e.key.toLowerCase() === "d") {
        isWhite = false;
        applyTheme();
    }

    // Shift表示
    if (e.key === "Shift") {
        stepDisplay.style.opacity = 1;
    }

    // +系
    if (
        e.key.toLowerCase() === "w" ||
        e.key === "ArrowUp" ||
        e.key === "ArrowRight" ||
        e.key === ";"
    ) {
        change(step);
    }

    // -系
    if (
        e.key.toLowerCase() === "s" ||
        e.key.toLowerCase() === "a" ||
        e.key === "ArrowDown" ||
        e.key === "ArrowLeft" ||
        e.key === "-"
    ) {
        change(-step);
    }
});

document.addEventListener("keyup", (e) => {
    if (e.key === "Shift") {
        stepDisplay.style.opacity = 0;
    }
});

// スマホ用ボタン
document.addEventListener("mousedown", (e) => {

    if (e.shiftKey) {
        if (e.button === 2) step++;
        if (e.button === 0) step--;
        update();
        return;
    }

    if (e.button === 0) change(-step);
    if (e.button === 2) change(step);
    if (e.button === 1) reset();
});

document.addEventListener("contextmenu", e => e.preventDefault());

// ホイール
document.addEventListener("wheel", (e) => {

    if (e.shiftKey) {
        if (e.deltaY < 0) step++;
        else step--;
        update();
        return;
    }

    if (e.deltaY < 0) change(step);
    else change(-step);
});

// Ctrl+中クリックでリセットstep
document.addEventListener("mousedown", (e) => {
    if (e.button === 1 && e.ctrlKey) {
        step = 1;
        update();
    }
});

applyTheme();
update();
</script>

</body>
</html>
