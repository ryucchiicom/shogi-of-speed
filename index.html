<!-- ここは既存のHTMLの <script type="module"> の中で、
     MODまわりの処理をこの版に置き換えてね。 -->

<script type="module">
  // 既存のFirebase初期化はそのまま使う
  // ここでは MOD まわりだけをまとめて書く

  const MOD_AI_ENDPOINT = localStorage.getItem("MOD_AI_ENDPOINT") || "https://YOUR-WORKER-URL.example.workers.dev/";

  function forceUpperRoomInput(inputEl) {
    const before = inputEl.value;
    const after = before.replace(/[a-z]/g, s => s.toUpperCase());
    if (before !== after) {
      const start = inputEl.selectionStart;
      const end = inputEl.selectionEnd;
      inputEl.value = after;
      if (typeof start === "number" && typeof end === "number") {
        try { inputEl.setSelectionRange(start, end); } catch {}
      }
    }
  }

  function parseRoomAndMods(raw) {
    const text = (raw || "").trim();
    const match = text.match(/^(.*?)(?:\s+MOD=(.*))?$/i);
    return {
      room: (match?.[1] || "").trim(),
      modSpec: (match?.[2] || "").trim()
    };
  }

  function parseModRefs(spec) {
    if (!spec) return [];
    return spec.split(",").map(s => s.trim()).filter(Boolean).map(entry => {
      const m = entry.match(/^(.+?)(?:\s+v(\d+))?$/i);
      return {
        name: (m?.[1] || entry).trim().toUpperCase(),
        version: m?.[2] ? Number(m[2]) : null
      };
    });
  }

  function normalizeModNameInput(v) {
    return (v || "")
      .replace(/[^0-9A-Za-zぁ-んァ-ヶー一-龠\s\-_.]/g, "")
      .replace(/[a-z]/g, s => s.toUpperCase());
  }

  function loadModStore() {
    try {
      const raw = localStorage.getItem("shogi_mod_store_v1");
      if (!raw) return { list: [] };
      const parsed = JSON.parse(raw);
      return { list: Array.isArray(parsed.list) ? parsed.list : [] };
    } catch {
      return { list: [] };
    }
  }

  function saveModStore(store) {
    try {
      localStorage.setItem("shogi_mod_store_v1", JSON.stringify(store));
    } catch {}
  }

  function buildModSuggestions(prefix, modStore) {
    const p = (prefix || "").trim().toUpperCase();
    const list = (modStore?.list || []).slice().sort((a, b) => a.name.localeCompare(b.name, "ja"));
    const filtered = p
      ? list.filter(m => m.name.toUpperCase().startsWith(p))
      : list;
    return filtered.slice(0, 8);
  }

  async function askModAI({ name, prompt, currentMod, basePatch }) {
    const payload = {
      currentModName: name,
      request: prompt,
      currentVersion: currentMod?.versions?.length || 0,
      existingVersions: (currentMod?.versions || []).map(v => ({
        version: v.version,
        summary: v.summary || ""
      })),
      basePatch: basePatch || {
        theme: {},
        game: {
          cooldownMs: 3000,
          handCooldownMs: 3000,
          cpuDelayMin: 1000,
          cpuDelayMax: 1500,
          seriousCpuInterval: 100
        },
        labels: {},
        rules: {},
        ui: {}
      }
    };

    if (MOD_AI_ENDPOINT && !MOD_AI_ENDPOINT.includes("YOUR-WORKER-URL")) {
      const res = await fetch(MOD_AI_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        throw new Error(`AI endpoint error: ${res.status}`);
      }

      const data = await res.json();
      return {
        summary: String(data?.summary || "試作MOD"),
        prompt: String(data?.prompt || prompt || ""),
        patch: data?.patch || payload.basePatch
      };
    }

    // フォールバック
    return {
      summary: `試作MOD「${name}」`,
      prompt: prompt || "",
      patch: {
        theme: {},
        game: {
          cooldownMs: 3000,
          handCooldownMs: 3000,
          cpuDelayMin: 1000,
          cpuDelayMax: 1500,
          seriousCpuInterval: 100
        },
        labels: {},
        rules: {},
        ui: {}
      }
    };
  }

  function installModUI({ roomInput, modSuggestEl, selectedModsEl, setStatus, showModScreen, getModStore, setModStore, renderModList, renderModEditor, applyRuntimeTheme }) {
    function renderSelectedModsPills(activeMods) {
      selectedModsEl.innerHTML = "";
      const list = activeMods || [];
      for (const mod of list) {
        const pill = document.createElement("span");
        pill.className = "modChip";
        pill.innerHTML = `<strong>${mod.name}</strong><span>v${mod.version}</span>`;
        selectedModsEl.appendChild(pill);
      }
    }

    function renderSuggestions() {
      const { room, modSpec } = parseRoomAndMods(roomInput.value);
      const last = (modSpec.split(",").pop() || "").trim();
      const prefix = last.replace(/\s+v\d+$/i, "").trim().toUpperCase();

      const store = getModStore();
      const list = buildModSuggestions(prefix, store);
      modSuggestEl.innerHTML = "";

      if (!modSpec || !modSpec.trim()) {
        modSuggestEl.classList.remove("show");
        return;
      }

      if (!list.length) {
        modSuggestEl.classList.remove("show");
        return;
      }

      modSuggestEl.classList.add("show");

      for (const mod of list) {
        const latest = mod.versions?.[mod.versions.length - 1];
        const chip = document.createElement("div");
        chip.className = "suggestChip";
        chip.innerHTML = `<strong>${mod.name}</strong><span>v${latest?.version || 0}</span>`;
        chip.addEventListener("click", () => {
          const refs = parseModRefs(modSpec);
          let replaced = false;

          const next = refs.map(r => {
            const hit = !replaced && r.name.toUpperCase().startsWith(prefix);
            if (hit) {
              replaced = true;
              return { name: mod.name, version: latest?.version || null };
            }
            return r;
          });

          const modText = next.map(r => r.version ? `${r.name} v${r.version}` : r.name).join(",");
          roomInput.value = `${room ? `${room} ` : ""}MOD=${modText}`;
          forceUpperRoomInput(roomInput);
          renderSuggestions();
          roomInput.focus();
        });
        modSuggestEl.appendChild(chip);
      }
    }

    roomInput.addEventListener("input", () => {
      forceUpperRoomInput(roomInput);
      renderSuggestions();
    });

    roomInput.addEventListener("change", () => {
      forceUpperRoomInput(roomInput);
      renderSuggestions();
    });

    async function openModScreenIfNeeded() {
      const raw = roomInput.value.trim();
      const upper = raw.toUpperCase();

      if (upper === "MOD" || upper === "MODS") {
        showModScreen(true);
        return true;
      }

      return false;
    }

    return {
      renderSelectedModsPills,
      renderSuggestions,
      openModScreenIfNeeded
    };
  }

  // ここから下は、あなたの既存コードに合わせてつなぐ部分
  // roomInput / modSuggestEl / selectedModsEl / setStatus / showModScreen / renderModList / renderModEditor / applyRuntimeTheme を既存のものに置き換えて使う

  window.ShogiMod = {
    forceUpperRoomInput,
    parseRoomAndMods,
    parseModRefs,
    normalizeModNameInput,
    loadModStore,
    saveModStore,
    buildModSuggestions,
    askModAI,
    installModUI
  };
</script>
