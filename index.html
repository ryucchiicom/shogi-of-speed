<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>ターンなし将棋オンライン</title>
  <style>
    :root{
      --bg:#111318;
      --panel:#1a1f28;
      --panel2:#202634;
      --text:#eef2ff;
      --muted:#a8b0c0;
      --accent:#ffd84d;
      --accent2:#76e4c3;
      --danger:#ff7b7b;
      --square-light:#e7d7b8;
      --square-dark:#c9a97f;
      --hint:rgba(255, 235, 92, .44);
      --hint2:rgba(118, 228, 195, .40);
      --outline:rgba(255,255,255,.12);
    }

    *{ box-sizing:border-box; }
    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:linear-gradient(180deg,#0d1016,#141925 45%, #0d1016);
      color:var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow:hidden;
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
    }

    .app{
      height:100%;
      display:flex;
      flex-direction:column;
      gap:10px;
      padding:10px;
      max-width:1100px;
      margin:0 auto;
    }

    .topbar, .statusbar, .panel{
      background:rgba(26,31,40,.82);
      border:1px solid var(--outline);
      border-radius:16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 30px rgba(0,0,0,.2);
    }

    .topbar{
      padding:10px;
      display:grid;
      grid-template-columns: 1fr auto auto;
      gap:8px;
      align-items:center;
    }

    .row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }

    input, button, select{
      border:none;
      outline:none;
      border-radius:12px;
      font:inherit;
    }

    input, select{
      background:#0f1420;
      color:var(--text);
      border:1px solid rgba(255,255,255,.08);
      padding:10px 12px;
      min-height:42px;
    }

    input::placeholder{ color:#7f8796; }

    button{
      background:#2a3242;
      color:var(--text);
      padding:10px 14px;
      min-height:42px;
      cursor:pointer;
      transition:transform .08s ease, opacity .15s ease, background .15s ease;
    }
    button:active{ transform:scale(.98); }
    button.primary{ background:linear-gradient(180deg,#ffd84d,#e9b92c); color:#1e1700; font-weight:700; }
    button.good{ background:linear-gradient(180deg,#4ee0ba,#2fb092); color:#062017; font-weight:700; }
    button.bad{ background:linear-gradient(180deg,#ff8f8f,#f15f5f); color:#2b0000; font-weight:700; }
    button.small{ padding:8px 10px; min-height:36px; border-radius:10px; }
    button.active{
      background:linear-gradient(180deg,#7ddcff,#4a9fe6);
      color:#07111c;
      font-weight:800;
    }
    button.ghost{
      background:#1a2130;
      border:1px solid rgba(255,255,255,.08);
    }

    .statusbar{
      padding:10px 12px;
      display:flex;
      flex-wrap:wrap;
      gap:10px 16px;
      align-items:center;
      justify-content:space-between;
      font-size:14px;
      color:var(--muted);
    }

    .main{
      flex:1;
      display:grid;
      grid-template-columns: 1fr minmax(0, 720px) 1fr;
      gap:10px;
      min-height:0;
    }

    .side{
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .panel{
      padding:10px;
    }

    .hand-title{
      font-size:13px;
      color:var(--muted);
      margin-bottom:8px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .hand-list{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .hand-piece{
      position:relative;
      min-width:60px;
      min-height:56px;
      padding:8px 10px;
      border-radius:14px;
      background:#101624;
      border:1px solid rgba(255,255,255,.08);
      color:var(--text);
      cursor:pointer;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
    }
    .hand-piece .count{
      font-size:12px;
      color:var(--muted);
    }
    .hand-piece.selected{
      outline:3px solid var(--accent);
      box-shadow:0 0 0 3px rgba(255,216,77,.18);
    }
    .hand-piece.disabled{
      opacity:.35;
      cursor:default;
    }

    .board-wrap{
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .board-tools{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      justify-content:space-between;
    }

    .board{
      position:relative;
      width:min(92vw, 720px);
      max-width:100%;
      aspect-ratio:1;
      margin:0 auto;
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.1);
      background:#b9925f;
      box-shadow: 0 16px 40px rgba(0,0,0,.3);
      touch-action:none;
      user-select:none;
      -webkit-user-select:none;
    }

    .grid{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(9,1fr);
      grid-template-rows:repeat(9,1fr);
    }

    .square{
      position:relative;
      border:1px solid rgba(0,0,0,.12);
      overflow:hidden;
    }

    .square.light{ background:var(--square-light); }
    .square.dark{ background:var(--square-dark); }

    .square.hint::after{
      content:"";
      position:absolute;
      inset:7%;
      border-radius:12px;
      background:var(--hint);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
      pointer-events:none;
    }

    .square.preview-hint::after{
      background:var(--hint2);
    }

    .square.selected::before{
      content:"";
      position:absolute;
      inset:0;
      box-shadow: inset 0 0 0 4px rgba(255,216,77,.8);
      pointer-events:none;
    }

    .square.last-from::before,
    .square.last-to::before{
      content:"";
      position:absolute;
      inset:0;
      box-shadow: inset 0 0 0 4px rgba(118,228,195,.75);
      pointer-events:none;
    }

    .piece{
      position:absolute;
      inset:8%;
      border-radius:14px 14px 18px 18px;
      background:linear-gradient(180deg,#fff9df,#ecd6a6);
      border:1px solid rgba(0,0,0,.18);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      letter-spacing:.04em;
      color:#301d06;
      font-size:clamp(15px, 2.3vw, 30px);
      box-shadow: 0 3px 8px rgba(0,0,0,.16);
      overflow:hidden;
      pointer-events:none;
    }

    .piece.white{
      transform: rotate(180deg);
      background:linear-gradient(180deg,#fffdf3,#f0e4bf);
    }

    .piece .label{
      position:relative;
      z-index:2;
      text-shadow:0 1px 0 rgba(255,255,255,.35);
    }

    .cooldown-ring{
      position:absolute;
      inset:5px;
      border-radius:50%;
      opacity:.96;
      background:conic-gradient(rgba(255,255,255,.78) 0deg, rgba(255,255,255,.78) var(--a), rgba(255,255,255,.12) var(--a), rgba(255,255,255,.12) 360deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
      transform: rotate(-90deg);
      z-index:1;
      pointer-events:none;
    }

    .piece.cooling::after{
      content:"";
      position:absolute;
      inset:0;
      background:radial-gradient(circle at center, rgba(0,0,0,.06), transparent 60%);
      pointer-events:none;
    }

    .footer-note{
      font-size:12px;
      color:var(--muted);
      line-height:1.45;
    }

    .toast{
      min-height:22px;
      color:#ffe9a8;
      font-size:13px;
    }

    .drag-ghost{
      position:fixed;
      width:56px;
      height:56px;
      margin-left:-28px;
      margin-top:-28px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.16);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(6px);
      pointer-events:none;
      z-index:9999;
      font-size:30px;
      font-weight:900;
      color:#fff;
      text-shadow:0 2px 8px rgba(0,0,0,.25);
      box-shadow:0 12px 24px rgba(0,0,0,.25);
      transform:translate(-9999px,-9999px);
    }

    .tiny{
      font-size:12px;
      color:var(--muted);
    }

    @media (max-width: 980px){
      .main{
        grid-template-columns:1fr;
      }
      .side{
        order:2;
      }
      .board-wrap{
        order:1;
      }
      .board{
        width:min(96vw, 720px);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="row">
        <input id="nameInput" placeholder="名前" style="width:140px" />
        <input id="roomInput" placeholder="部屋コード" style="width:150px;text-transform:uppercase;" />
        <button id="createBtn" class="primary">部屋作成</button>
        <button id="joinBtn" class="good">参加</button>
      </div>
      <div class="row">
        <button id="tapModeBtn" class="active">タップ</button>
        <button id="slideModeBtn">スライド</button>
      </div>
      <div class="row" style="justify-content:flex-end">
        <button id="resetSelectionBtn" class="ghost">選択解除</button>
        <button id="copyRoomBtn" class="ghost">コードコピー</button>
      </div>
    </div>

    <div class="statusbar">
      <div id="statusText">未接続</div>
      <div id="seatText">観戦</div>
      <div id="gameText">ターンなし / 1秒クールダウン</div>
    </div>

    <div class="main">
      <div class="side">
        <div class="panel">
          <div class="hand-title">
            <span>後手の持ち駒</span>
            <span class="tiny" id="whiteName"></span>
          </div>
          <div id="whiteHand" class="hand-list"></div>
        </div>

        <div class="panel">
          <div class="hand-title">
            <span>ルールメモ</span>
            <span class="tiny">黄色 = 行けるマス</span>
          </div>
          <div class="footer-note">
            敵のコマもタップして動きを見られる。<br>
            自分のコマはタップ操作とスライド操作の両方に対応。<br>
            1秒の再使用待ち中は、そのコマのまわりに円が出る。
          </div>
          <div id="toast" class="toast"></div>
        </div>
      </div>

      <div class="board-wrap">
        <div class="panel board-tools">
          <div class="tiny" id="roomInfo">部屋: -</div>
          <div class="tiny" id="versionInfo">version: -</div>
        </div>

        <div id="board" class="board" aria-label="Shogi board">
          <div id="grid" class="grid"></div>
        </div>
      </div>

      <div class="side">
        <div class="panel">
          <div class="hand-title">
            <span>先手の持ち駒</span>
            <span class="tiny" id="blackName"></span>
          </div>
          <div id="blackHand" class="hand-list"></div>
        </div>

        <div class="panel">
          <div class="hand-title">
            <span>操作</span>
            <span class="tiny">友達と共有して対戦</span>
          </div>
          <div class="footer-note">
            部屋コードを合わせれば同じ盤面を見られる。<br>
            取り合いは Firebase 側で順番ではなく最新状態で同期する。
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="dragGhost" class="drag-ghost"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, runTransaction, update } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

    // ===== Firebase 設定ここを書き換える =====
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "YOUR_DATABASE_URL",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const PLACEHOLDER_TOKENS = new Set([
      "YOUR_API_KEY",
      "YOUR_PROJECT.firebaseapp.com",
      "YOUR_DATABASE_URL",
      "YOUR_PROJECT_ID",
      "YOUR_STORAGE_BUCKET",
      "YOUR_SENDER_ID",
      "YOUR_APP_ID"
    ]);

    const hasConfig = !Object.values(firebaseConfig).some(v => PLACEHOLDER_TOKENS.has(v));

    const nameInput = document.getElementById("nameInput");
    const roomInput = document.getElementById("roomInput");
    const createBtn = document.getElementById("createBtn");
    const joinBtn = document.getElementById("joinBtn");
    const tapModeBtn = document.getElementById("tapModeBtn");
    const slideModeBtn = document.getElementById("slideModeBtn");
    const resetSelectionBtn = document.getElementById("resetSelectionBtn");
    const copyRoomBtn = document.getElementById("copyRoomBtn");
    const statusText = document.getElementById("statusText");
    const seatText = document.getElementById("seatText");
    const gameText = document.getElementById("gameText");
    const roomInfo = document.getElementById("roomInfo");
    const versionInfo = document.getElementById("versionInfo");
    const toastEl = document.getElementById("toast");
    const boardEl = document.getElementById("board");
    const gridEl = document.getElementById("grid");
    const whiteHandEl = document.getElementById("whiteHand");
    const blackHandEl = document.getElementById("blackHand");
    const whiteNameEl = document.getElementById("whiteName");
    const blackNameEl = document.getElementById("blackName");
    const dragGhost = document.getElementById("dragGhost");

    const HAND_ORDER = ["rook", "bishop", "gold", "silver", "knight", "lance", "pawn"];
    const LABELS = {
      king: "玉",
      rook: "飛",
      bishop: "角",
      gold: "金",
      silver: "銀",
      knight: "桂",
      lance: "香",
      pawn: "歩",
      tokin: "と",
      proLance: "杏",
      proKnight: "圭",
      proSilver: "全",
      horse: "馬",
      dragon: "龍"
    };

    const PROMOTE_MAP = {
      pawn: "tokin",
      lance: "proLance",
      knight: "proKnight",
      silver: "proSilver",
      bishop: "horse",
      rook: "dragon"
    };

    const UNPROMOTE_MAP = {
      tokin: "pawn",
      proLance: "lance",
      proKnight: "knight",
      proSilver: "silver",
      horse: "bishop",
      dragon: "rook"
    };

    const GOLD_LIKE = new Set(["tokin", "proLance", "proKnight", "proSilver"]);
    const PROMOTABLE = new Set(["pawn", "lance", "knight", "silver", "bishop", "rook"]);

    const state = {
      db: null,
      roomId: "",
      room: null,
      unsub: null,
      playerId: localStorage.getItem("turnlessShogiPlayerId") || crypto.randomUUID(),
      playerName: localStorage.getItem("turnlessShogiName") || "",
      mode: localStorage.getItem("turnlessShogiMode") || "tap",
      selected: null,
      dragging: null,
      message: "",
      lastRenderTs: 0
    };

    localStorage.setItem("turnlessShogiPlayerId", state.playerId);
    nameInput.value = state.playerName;
    if (state.mode === "slide") {
      tapModeBtn.classList.remove("active");
      slideModeBtn.classList.add("active");
    }

    if (!hasConfig) {
      setToast("Firebase 設定がまだ入ってない。config を差し替えてね。");
      statusText.textContent = "Firebase 設定待ち";
    } else {
      const app = initializeApp(firebaseConfig);
      state.db = getDatabase(app);
      statusText.textContent = "Firebase 接続OK";
    }

    function setToast(text) {
      state.message = text || "";
      toastEl.textContent = state.message;
    }

    function setMode(mode) {
      state.mode = mode;
      localStorage.setItem("turnlessShogiMode", mode);
      tapModeBtn.classList.toggle("active", mode === "tap");
      slideModeBtn.classList.toggle("active", mode === "slide");
      setToast(mode === "tap" ? "タップ操作" : "スライド操作");
      render();
    }

    tapModeBtn.addEventListener("click", () => setMode("tap"));
    slideModeBtn.addEventListener("click", () => setMode("slide"));

    nameInput.addEventListener("input", () => {
      state.playerName = nameInput.value.trim().slice(0, 24);
      localStorage.setItem("turnlessShogiName", state.playerName);
      render();
    });

    function randCode(len = 6) {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let out = "";
      for (let i = 0; i < len; i++) out += chars[Math.floor(Math.random() * chars.length)];
      return out;
    }

    function inBounds(x, y) {
      return x >= 0 && x < 9 && y >= 0 && y < 9;
    }

    function emptyHands() {
      return {
        rook: 0,
        bishop: 0,
        gold: 0,
        silver: 0,
        knight: 0,
        lance: 0,
        pawn: 0
      };
    }

    function cloneHands(hands) {
      return {
        black: { ...emptyHands(), ...(hands?.black || {}) },
        white: { ...emptyHands(), ...(hands?.white || {}) }
      };
    }

    function cloneBoard(board) {
      return board.map(row => row.map(cell => cell ? { ...cell } : null));
    }

    function pieceLabel(type) {
      return LABELS[type] || "?";
    }

    function ownerDir(owner) {
      return owner === "black" ? -1 : 1;
    }

    function isPromoZone(owner, y) {
      return owner === "black" ? y <= 2 : y >= 6;
    }

    function isLastRank(owner, y) {
      return owner === "black" ? y === 0 : y === 8;
    }

    function isLastTwoRanks(owner, y) {
      return owner === "black" ? y <= 1 : y >= 7;
    }

    function baseType(type) {
      return UNPROMOTE_MAP[type] || type;
    }

    function promotedType(type) {
      return PROMOTE_MAP[type] || type;
    }

    function isPromotable(type) {
      return PROMOTABLE.has(type);
    }

    function makePiece(owner, type) {
      return {
        id: `${owner}_${type}_${Math.random().toString(36).slice(2, 10)}`,
        owner,
        type,
        cooldownUntil: 0
      };
    }

    function makeInitialBoard() {
      const b = Array.from({ length: 9 }, () => Array(9).fill(null));

      const topMajor = ["lance","knight","silver","gold","king","gold","silver","knight","lance"];
      const bottomMajor = ["lance","knight","silver","gold","king","gold","silver","knight","lance"];

      for (let x = 0; x < 9; x++) {
        b[0][x] = makePiece("white", topMajor[x]);
        b[8][x] = makePiece("black", bottomMajor[x]);
      }

      b[1][1] = makePiece("white", "rook");
      b[1][7] = makePiece("white", "bishop");
      b[7][1] = makePiece("black", "rook");
      b[7][7] = makePiece("black", "bishop");

      for (let x = 0; x < 9; x++) {
        b[2][x] = makePiece("white", "pawn");
        b[6][x] = makePiece("black", "pawn");
      }
      return b;
    }

    function makeInitialRoom(creator = null) {
      const room = {
        createdAt: Date.now(),
        version: 1,
        status: "playing",
        winner: null,
        players: {
          black: null,
          white: null
        },
        board: makeInitialBoard(),
        hands: {
          black: emptyHands(),
          white: emptyHands()
        },
        lastMove: null
      };

      if (creator) {
        room.players.black = {
          id: creator.id,
          name: creator.name,
          joinedAt: Date.now()
        };
      }

      return room;
    }

    function getSeat(room, playerId) {
      if (!room?.players) return null;
      if (room.players.black?.id === playerId) return "black";
      if (room.players.white?.id === playerId) return "white";
      return null;
    }

    function getPlayerMeta(room, seat) {
      return room?.players?.[seat] || null;
    }

    function hasAnyKing(board, owner) {
      for (let y = 0; y < 9; y++) {
        for (let x = 0; x < 9; x++) {
          const p = board[y][x];
          if (p && p.owner === owner && p.type === "king") return true;
        }
      }
      return false;
    }

    function squareAttacked(board, tx, ty, byOwner) {
      for (let y = 0; y < 9; y++) {
        for (let x = 0; x < 9; x++) {
          const p = board[y][x];
          if (!p || p.owner !== byOwner) continue;
          const moves = pseudoMoves(board, x, y, p, true);
          if (moves.some(m => m.x === tx && m.y === ty)) return true;
        }
      }
      return false;
    }

    function isInCheck(board, owner) {
      let kingPos = null;
      for (let y = 0; y < 9 && !kingPos; y++) {
        for (let x = 0; x < 9; x++) {
          const p = board[y][x];
          if (p && p.owner === owner && p.type === "king") {
            kingPos = { x, y };
            break;
          }
        }
      }
      if (!kingPos) return true;
      const enemy = owner === "black" ? "white" : "black";
      return squareAttacked(board, kingPos.x, kingPos.y, enemy);
    }

    function pseudoMoves(board, x, y, piece, attackOnly = false) {
      const moves = [];
      const owner = piece.owner;
      const dir = ownerDir(owner);

      const addStep = (nx, ny) => {
        if (!inBounds(nx, ny)) return;
        const target = board[ny][nx];
        if (!target || target.owner !== owner) {
          moves.push({ x: nx, y: ny });
        }
      };

      const addSlide = (dx, dy) => {
        let nx = x + dx;
        let ny = y + dy;
        while (inBounds(nx, ny)) {
          const target = board[ny][nx];
          if (!target) {
            moves.push({ x: nx, y: ny });
          } else {
            if (target.owner !== owner) moves.push({ x: nx, y: ny });
            break;
          }
          nx += dx;
          ny += dy;
        }
      };

      if (GOLD_LIKE.has(piece.type)) {
        const steps = [
          [0, dir], [-1, dir], [1, dir],
          [-1, 0], [1, 0],
          [0, -dir]
        ];
        for (const [dx, dy] of steps) addStep(x + dx, y + dy);
        return moves;
      }

      switch (piece.type) {
        case "pawn":
          addStep(x, y + dir);
          break;

        case "lance":
          addSlide(0, dir);
          break;

        case "knight":
          addStep(x - 1, y + dir * 2);
          addStep(x + 1, y + dir * 2);
          break;

        case "silver":
          addStep(x, y + dir);
          addStep(x - 1, y + dir);
          addStep(x + 1, y + dir);
          addStep(x - 1, y - dir);
          addStep(x + 1, y - dir);
          break;

        case "gold":
          {
            const steps = [
              [0, dir], [-1, dir], [1, dir],
              [-1, 0], [1, 0],
              [0, -dir]
            ];
            for (const [dx, dy] of steps) addStep(x + dx, y + dy);
          }
          break;

        case "king":
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              if (dx === 0 && dy === 0) continue;
              addStep(x + dx, y + dy);
            }
          }
          break;

        case "bishop":
          addSlide(1, 1);
          addSlide(1, -1);
          addSlide(-1, 1);
          addSlide(-1, -1);
          break;

        case "rook":
          addSlide(1, 0);
          addSlide(-1, 0);
          addSlide(0, 1);
          addSlide(0, -1);
          break;

        case "horse":
          addSlide(1, 1);
          addSlide(1, -1);
          addSlide(-1, 1);
          addSlide(-1, -1);
          addStep(x + 1, y);
          addStep(x - 1, y);
          addStep(x, y + 1);
          addStep(x, y - 1);
          break;

        case "dragon":
          addSlide(1, 0);
          addSlide(-1, 0);
          addSlide(0, 1);
          addSlide(0, -1);
          addStep(x + 1, y + 1);
          addStep(x + 1, y - 1);
          addStep(x - 1, y + 1);
          addStep(x - 1, y - 1);
          break;
      }

      return moves;
    }

    function legalBoardMoves(board, x, y, piece) {
      if (!piece) return [];
      const now = Date.now();
      if ((piece.cooldownUntil || 0) > now) return [];

      const raw = pseudoMoves(board, x, y, piece);
      const moves = [];

      for (const move of raw) {
        const nextBoard = cloneBoard(board);
        const moving = { ...nextBoard[y][x] };
        nextBoard[y][x] = null;
        nextBoard[move.y][move.x] = moving;

        if (!isInCheck(nextBoard, piece.owner)) {
          moves.push({
            x: move.x,
            y: move.y
          });
        }
      }

      return moves;
    }

    function sameFileHasPawn(board, owner, fileX) {
      for (let y = 0; y < 9; y++) {
        const p = board[y][fileX];
        if (p && p.owner === owner && p.type === "pawn") return true;
      }
      return false;
    }

    function legalDropMoves(board, owner, type, hands) {
      const moves = [];
      const count = hands?.[owner]?.[type] || 0;
      if (count <= 0) return moves;

      for (let y = 0; y < 9; y++) {
        for (let x = 0; x < 9; x++) {
          if (board[y][x]) continue;

          if (type === "pawn") {
            if (sameFileHasPawn(board, owner, x)) continue;
            if (isLastRank(owner, y)) continue;
          }

          if (type === "lance" && isLastRank(owner, y)) continue;
          if (type === "knight" && isLastTwoRanks(owner, y)) continue;

          const nextBoard = cloneBoard(board);
          nextBoard[y][x] = makePiece(owner, "pawn"); // temporary for check test only
          nextBoard[y][x].type = type;

          if (!isInCheck(nextBoard, owner)) {
            moves.push({ x, y });
          }
        }
      }

      return moves;
    }

    function getSelectedTargets(room, selected) {
      if (!room || !selected || room.status === "gameover") return [];

      const board = room.board;
      const seat = getSeat(room, state.playerId);
      const now = Date.now();

      if (selected.kind === "board") {
        const p = board?.[selected.y]?.[selected.x];
        if (!p || p.id !== selected.id) return [];
        if ((p.cooldownUntil || 0) > now) return [];

        return legalBoardMoves(board, selected.x, selected.y, p);
      }

      if (selected.kind === "hand") {
        if (!seat) return [];
        if (selected.owner !== seat) return [];
        return legalDropMoves(board, seat, selected.type, room.hands);
      }

      return [];
    }

    function getSelectedPiece(room, selected) {
      if (!room || !selected) return null;
      if (selected.kind === "board") {
        return room.board?.[selected.y]?.[selected.x] || null;
      }
      if (selected.kind === "hand") {
        return { owner: selected.owner, type: selected.type, hand: true };
      }
      return null;
    }

    function canActOnSelected(room, selected) {
      if (!room || !selected) return false;
      const seat = getSeat(room, state.playerId);
      if (!seat) return false;

      if (selected.kind === "board") {
        const p = room.board?.[selected.y]?.[selected.x];
        return !!p && p.id === selected.id && p.owner === seat && (p.cooldownUntil || 0) <= Date.now();
      }

      if (selected.kind === "hand") {
        return selected.owner === seat && (room.hands?.[seat]?.[selected.type] || 0) > 0;
      }

      return false;
    }

    function promotionPlan(piece, fromY, toY) {
      if (!isPromotable(piece.type)) return { eligible: false, forced: false };
      const eligible = isPromoZone(piece.owner, fromY) || isPromoZone(piece.owner, toY);

      if (!eligible) return { eligible: false, forced: false };

      if (piece.type === "pawn" || piece.type === "lance") {
        if (isLastRank(piece.owner, toY)) return { eligible: true, forced: true };
      }
      if (piece.type === "knight") {
        if (isLastTwoRanks(piece.owner, toY)) return { eligible: true, forced: true };
      }

      return { eligible: true, forced: false };
    }

    function currentSeatName(room, seat) {
      const p = getPlayerMeta(room, seat);
      return p?.name || (seat === "black" ? "先手" : "後手");
    }

    function normalizeRoomId(v) {
      return String(v || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 10);
    }

    function roomRef(id) {
      return ref(state.db, `rooms/${id}`);
    }

    async function subscribeRoom(id) {
      if (!state.db) return;
      if (state.unsub) {
        state.unsub();
        state.unsub = null;
      }

      state.roomId = id;
      roomInput.value = id;
      roomInfo.textContent = `部屋: ${id}`;
      statusText.textContent = "接続中...";

      const r = roomRef(id);
      state.unsub = onValue(r, snap => {
        state.room = snap.val();
        render();
        statusText.textContent = state.room ? "接続中" : "部屋が空";
      }, err => {
        console.error(err);
        setToast("読み取りに失敗した。Firebase の設定かルールを確認してね。");
      });
    }

    async function createRoom() {
      if (!state.db) {
        setToast("Firebase 設定がまだ入ってない。");
        return;
      }

      const code = randCode(6);
      const room = makeInitialRoom({
        id: state.playerId,
        name: state.playerName || "プレイヤー"
      });

      try {
        await set(roomRef(code), room);
        await subscribeRoom(code);
        setToast(`部屋を作成: ${code}`);
      } catch (e) {
        console.error(e);
        setToast("部屋作成に失敗した。");
      }
    }

    async function joinRoom() {
      if (!state.db) {
        setToast("Firebase 設定がまだ入ってない。");
        return;
      }

      const code = normalizeRoomId(roomInput.value);
      if (!code) {
        setToast("部屋コードを入れてね。");
        return;
      }

      try {
        const r = roomRef(code);
        const result = await runTransaction(r, current => {
          if (!current) return; // ない部屋には入れない
          current.players ||= { black: null, white: null };

          const me = { id: state.playerId, name: state.playerName || "プレイヤー", joinedAt: Date.now() };

          if (current.players.black?.id === state.playerId) {
            current.players.black = me;
            return current;
          }
          if (current.players.white?.id === state.playerId) {
            current.players.white = me;
            return current;
          }

          if (!current.players.black) {
            current.players.black = me;
            return current;
          }
          if (!current.players.white) {
            current.players.white = me;
            return current;
          }

          return current; // 2人埋まってたら観戦
        });

        if (result.committed) {
          await subscribeRoom(code);
          setToast(`参加: ${code}`);
        } else {
          setToast("参加できなかった。");
        }
      } catch (e) {
        console.error(e);
        setToast("参加に失敗した。");
      }
    }

    createBtn.addEventListener("click", createRoom);
    joinBtn.addEventListener("click", joinRoom);

    roomInput.addEventListener("keydown", e => {
      if (e.key === "Enter") joinRoom();
    });
    nameInput.addEventListener("keydown", e => {

    function setSelection(sel) {

      render();
    }

    function clearDragGhost() {
      dragGhost.style.transform = "translate(-9999px,-9999px)";
      dragGhost.textContent = "";
    }

    function showDragGhost(piece, clientX, clientY) {
      const text = piece ? pieceLabel(piece.type) : "";
      dragGhost.textContent = text;
      dragGhost.style.transform = `translate(${clientX}px, ${clientY}px)`;
    }

    function updateDragGhost(clientX, clientY) {
      if (!state.dragging) return;
      dragGhost.style.transform = `translate(${clientX}px, ${clientY}px)`;
    }

    function getBoardPointFromClient(clientX, clientY) {
      const rect = boardEl.getBoundingClientRect();
      const nx = (clientX - rect.left) / rect.width;
      const ny = (clientY - rect.top) / rect.height;
      const x = Math.floor(nx * 9);
      const y = Math.floor(ny * 9);
      return { x, y, rect };
    }

    function nearestTargetToPoint(targets, rect, clientX, clientY) {
      let best = null;
      let bestD = Infinity;
      for (const t of targets) {
        const cx = rect.left + (t.x + 0.5) * rect.width / 9;
        const cy = rect.top + (t.y + 0.5) * rect.height / 9;
        const dx = clientX - cx;
        const dy = clientY - cy;
        const d = dx * dx + dy * dy;
        if (d < bestD) {
          bestD = d;
          best = t;
        }
      }
      return best;
    }

    function makeMoveActionFromSelection(selected, target, room) {
      const seat = getSeat(room, state.playerId);
      if (!seat) return null;

      if (selected.kind === "board") {
        const piece = room.board?.[selected.y]?.[selected.x];
        if (!piece || piece.id !== selected.id) return null;
        if (piece.owner !== seat) return null;

        const targets = legalBoardMoves(room.board, selected.x, selected.y, piece);
        if (!targets.some(t => t.x === target.x && t.y === target.y)) return null;

        const plan = promotionPlan(piece, selected.y, target.y);
        let promote = false;
        if (plan.forced) {
          promote = true;
        } else if (plan.eligible) {
          promote = window.confirm("この手、成りますか？");
        }

        return {
          kind: "move",
          sx: selected.x,
          sy: selected.y,
          tx: target.x,
          ty: target.y,
          promote
        };
      }

      if (selected.kind === "hand") {
        if (selected.owner !== seat) return null;
        const targets = legalDropMoves(room.board, seat, selected.type, room.hands);
        if (!targets.some(t => t.x === target.x && t.y === target.y)) return null;

        return {
          kind: "drop",
          pieceType: selected.type,
          tx: target.x,
          ty: target.y
        };
      }

      return null;
    }

    async function commitAction(action) {
      if (!state.db || !state.roomId || !state.room) return false;
      const seat = getSeat(state.room, state.playerId);
      if (!seat) {
        setToast("観戦中は動かせない。");
        return false;
      }

      const r = roomRef(state.roomId);
      try {
        const result = await runTransaction(r, current => {
          if (!current) return;
          if (current.status === "gameover") return;

          current.players ||= { black: null, white: null };
          current.hands ||= { black: emptyHands(), white: emptyHands() };
          current.board ||= makeInitialBoard();

          const now = Date.now();
          const mySeat = getSeat(current, state.playerId);
          if (!mySeat) return;

          if (action.kind === "move") {
            const piece = current.board?.[action.sy]?.[action.sx];
            if (!piece || piece.owner !== mySeat) return;
            if ((piece.cooldownUntil || 0) > now) return;

            const legal = legalBoardMoves(current.board, action.sx, action.sy, piece);
            if (!legal.some(m => m.x === action.tx && m.y === action.ty)) return;

            const plan = promotionPlan(piece, action.sy, action.ty);
            const shouldPromote = plan.forced || (plan.eligible && !!action.promote);

            const board = cloneBoard(current.board);
            const hands = cloneHands(current.hands);
            const moving = { ...board[action.sy][action.sx] };
            const captured = board[action.ty][action.tx];

            board[action.sy][action.sx] = null;

            if (captured) {
              if (captured.owner === mySeat) return;
              const capturedBase = baseType(captured.type);
              if (capturedBase === "king") {
                board[action.ty][action.tx] = moving;
                moving.cooldownUntil = now + 1000;
                moving.type = shouldPromote ? promotedType(moving.type) : moving.type;
                current.board = board;
                current.hands = hands;
                current.status = "gameover";
                current.winner = mySeat;
                current.lastMove = {
                  from: { x: action.sx, y: action.sy },
                  to: { x: action.tx, y: action.ty },
                  at: now,
                  piece: moving.type,
                  owner: mySeat
                };
                current.version = (current.version || 0) + 1;
                return current;
              }
              hands[mySeat][capturedBase] = (hands[mySeat][capturedBase] || 0) + 1;
            }

            moving.type = shouldPromote ? promotedType(moving.type) : moving.type;
            moving.cooldownUntil = now + 1000;
            board[action.ty][action.tx] = moving;

            if (isInCheck(board, mySeat)) return;

            current.board = board;
            current.hands = hands;
            current.lastMove = {
              from: { x: action.sx, y: action.sy },
              to: { x: action.tx, y: action.ty },
              at: now,
              piece: moving.type,
              owner: mySeat
            };
            current.version = (current.version || 0) + 1;
            return current;
          }

          if (action.kind === "drop") {
            const pieceType = action.pieceType;
            const count = current.hands[mySeat]?.[pieceType] || 0;
            if (count <= 0) return;
            if (current.board?.[action.ty]?.[action.tx]) return;

            const legal = legalDropMoves(current.board, mySeat, pieceType, current.hands);
            if (!legal.some(m => m.x === action.tx && m.y === action.ty)) return;

            const board = cloneBoard(current.board);
            const hands = cloneHands(current.hands);
            const dropped = makePiece(mySeat, pieceType);
            dropped.cooldownUntil = now + 1000;
            board[action.ty][action.tx] = dropped;
            hands[mySeat][pieceType] = count - 1;

            if (isInCheck(board, mySeat)) return;

            current.board = board;
            current.hands = hands;
            current.lastMove = {
              drop: true,
              to: { x: action.tx, y: action.ty },
              at: now,
              piece: pieceType,
              owner: mySeat
            };
            current.version = (current.version || 0) + 1;
            return current;
          }
        });

        if (!result.committed) {
          setToast("その手は通らなかった。");
          return false;
        }

        state.selected = null;
        clearDragGhost();
        render();
        return true;
      } catch (e) {
        console.error(e);
        setToast("送信に失敗した。");
        return false;
      }
    }

    function selectPieceAt(x, y) {
      if (!state.room?.board?.[y]?.[x]) return;
      const p = state.room.board[y][x];
      state.selected = {
        kind: "board",
        x,
        y,
        id: p.id
      };
      render();
    }

    function selectHand(owner, type) {
      state.selected = {
        kind: "hand",
        owner,
        type,
        id: `${owner}_${type}`
      };
      render();
    }

    function tryTapBoardSquare(x, y) {
      if (!state.room) return;
      const piece = state.room.board?.[y]?.[x];
      const selected = state.selected;
      const targets = getSelectedTargets(state.room, selected);

      if (selected && targets.some(t => t.x === x && t.y === y) && canActOnSelected(state.room, selected)) {
        const action = makeMoveActionFromSelection(selected, { x, y }, state.room);
        if (action) {
          commitAction(action);
          return;
        }
      }

      if (piece) {
        state.selected = {
          kind: "board",
          x,
          y,
          id: piece.id
        };
        render();
      } else {
        if (selected && selected.kind === "hand" && canActOnSelected(state.room, selected)) {
          const action = makeMoveActionFromSelection(selected, { x, y }, state.room);
          if (action) {
            commitAction(action);
            return;
          }
        }
        state.selected = null;
        render();
      }
    }

    function nearestMoveTargetFromRelease(clientX, clientY) {
      if (!state.room || !state.selected) return null;
      const targets = getSelectedTargets(state.room, state.selected);
      if (!targets.length) return null;
      const rect = boardEl.getBoundingClientRect();
      return nearestTargetToPoint(targets, rect, clientX, clientY);
    }

    function startSlideDragFromBoard(piece, x, y, clientX, clientY) {
      const seat = getSeat(state.room, state.playerId);
      const canMove = seat && piece.owner === seat && (piece.cooldownUntil || 0) <= Date.now();
      state.selected = {
        kind: "board",
        x,
        y,
        id: piece.id
      };

      if (!canMove) {
        render();
        return false;
      }

      state.dragging = {
        source: { kind: "board", x, y, id: piece.id },
        pointerId: null
      };
      showDragGhost(piece, clientX, clientY);
      render();
      return true;
    }

    function startSlideDragFromHand(owner, type, clientX, clientY) {
      const seat = getSeat(state.room, state.playerId);
      const canMove = seat && owner === seat && (state.room?.hands?.[seat]?.[type] || 0) > 0;
      state.selected = {
        kind: "hand",
        owner,
        type,
        id: `${owner}_${type}`
      };

      if (!canMove) {
        render();
        return false;
      }

      state.dragging = {
        source: { kind: "hand", owner, type },
        pointerId: null
      };
      showDragGhost({ type }, clientX, clientY);
      render();
      return true;
    }

    gridEl.addEventListener("click", e => {
      const square = e.target.closest(".square");
      if (!square) return;
      const x = Number(square.dataset.x);
      const y = Number(square.dataset.y);
      if (state.mode !== "tap") return;
      tryTapBoardSquare(x, y);
    });

    gridEl.addEventListener("pointerdown", e => {
      const square = e.target.closest(".square");
      if (!square) return;
      if (state.mode !== "slide") return;

      const x = Number(square.dataset.x);
      const y = Number(square.dataset.y);
      const p = state.room?.board?.[y]?.[x];
      if (p) {
        e.preventDefault();
        startSlideDragFromBoard(p, x, y, e.clientX, e.clientY);
      } else if (state.selected?.kind === "hand") {
        e.preventDefault();
        const sel = state.selected;
        startSlideDragFromHand(sel.owner, sel.type, e.clientX, e.clientY);
      }
    });

    document.addEventListener("pointermove", e => {
      if (!state.dragging) return;
      updateDragGhost(e.clientX, e.clientY);
    });

    document.addEventListener("pointerup", async e => {
      if (!state.dragging) return;

      const selected = state.selected;
      const target = nearestMoveTargetFromRelease(e.clientX, e.clientY);

      const source = state.dragging.source;
      state.dragging = null;
      clearDragGhost();

      if (!selected || !state.room || !target) {
        render();
        return;
      }

      const action = makeMoveActionFromSelection(selected, target, state.room);
      if (action) {
        await commitAction(action);
      } else {
        render();
      }
    });

    document.addEventListener("pointercancel", () => {
      state.dragging = null;
      clearDragGhost();
      render();
    });

    function renderHands(container, owner) {
      container.innerHTML = "";
      if (!state.room) return;

      const hands = state.room.hands?.[owner] || emptyHands();
      const seat = getSeat(state.room, state.playerId);
      const mySide = seat === owner;

      for (const type of HAND_ORDER) {
        const count = hands[type] || 0;
        const btn = document.createElement("button");
        btn.className = "hand-piece" + (count <= 0 ? " disabled" : "") + (
          state.selected?.kind === "hand" &&
          state.selected.owner === owner &&
          state.selected.type === type ? " selected" : ""
        );
        btn.innerHTML = `
          <div style="font-size:28px;line-height:1">${pieceLabel(type)}</div>
          <div class="count">${count}枚</div>
        `;
        btn.disabled = count <= 0;
        btn.addEventListener("click", () => {
          if (count <= 0) return;
          state.selected = { kind: "hand", owner, type, id: `${owner}_${type}` };
          render();
        });

        btn.addEventListener("pointerdown", e => {
          if (state.mode !== "slide") return;
          if (count <= 0) return;
          e.preventDefault();
          startSlideDragFromHand(owner, type, e.clientX, e.clientY);
        });

        container.appendChild(btn);
      }
    }

    function render() {
      const room = state.room;
      const now = Date.now();
      state.lastRenderTs = now;

      if (!room) {
        roomInfo.textContent = `部屋: ${state.roomId || "-"}`;
        versionInfo.textContent = "version: -";
        seatText.textContent = "観戦";
        gameText.textContent = "部屋に入ると対戦できる";
        whiteNameEl.textContent = "";
        blackNameEl.textContent = "";
        whiteHandEl.innerHTML = "";
        blackHandEl.innerHTML = "";
        gridEl.innerHTML = "";
        return;
      }

      const seat = getSeat(room, state.playerId);
      seatText.textContent = seat ? `あなた: ${seat === "black" ? "先手" : "後手"}` : "あなた: 観戦";
      roomInfo.textContent = `部屋: ${state.roomId || "-"}`;
      versionInfo.textContent = `version: ${room.version ?? "-"}`;
      whiteNameEl.textContent = currentSeatName(room, "white");
      blackNameEl.textContent = currentSeatName(room, "black");

      if (room.status === "gameover") {
        const winText = room.winner === "black" ? "先手の勝ち" : room.winner === "white" ? "後手の勝ち" : "終了";
        gameText.textContent = `対局終了 / ${winText}`;
      } else {
        gameText.textContent = "ターンなし / 1秒クールダウン";
      }

      if (state.selected) {
        if (state.selected.kind === "board") {
          const p = room.board?.[state.selected.y]?.[state.selected.x];
          if (!p || p.id !== state.selected.id) state.selected = null;
        } else if (state.selected.kind === "hand") {
          const c = room.hands?.[state.selected.owner]?.[state.selected.type] || 0;
          if (c <= 0) state.selected = null;
        }
      }

      const selectedTargets = getSelectedTargets(room, state.selected);
      const selectedCanAct = canActOnSelected(room, state.selected);

      const lastMove = room.lastMove || null;

      gridEl.innerHTML = "";
      for (let y = 0; y < 9; y++) {
        for (let x = 0; x < 9; x++) {
          const sq = document.createElement("div");
          const isLight = (x + y) % 2 === 0;
          sq.className = `square ${isLight ? "light" : "dark"}`;
          sq.dataset.x = String(x);
          sq.dataset.y = String(y);

          if (selectedTargets.some(t => t.x === x && t.y === y)) {
            sq.classList.add(selectedCanAct ? "hint" : "preview-hint");
          }

          if (state.selected?.kind === "board" && state.selected.x === x && state.selected.y === y) {
            sq.classList.add("selected");
          }

          if (lastMove?.from && lastMove.from.x === x && lastMove.from.y === y) sq.classList.add("last-from");
          if (lastMove?.to && lastMove.to.x === x && lastMove.to.y === y) sq.classList.add("last-to");

          const p = room.board?.[y]?.[x];
          if (p) {
            const remaining = Math.max(0, (p.cooldownUntil || 0) - now);
            const progress = Math.max(0, Math.min(1, remaining / 1000));
            const angle = progress * 360;

            const piece = document.createElement("div");
            piece.className = `piece ${p.owner}`;
            if (remaining > 0) piece.classList.add("cooling");
            piece.innerHTML = `
              ${remaining > 0 ? `<div class="cooldown-ring" style="--a:${angle}deg"></div>` : ""}
              <div class="label">${pieceLabel(p.type)}</div>
            `;
            sq.appendChild(piece);
          }

          gridEl.appendChild(sq);
        }
      }

      renderHands(whiteHandEl, "white");
      renderHands(blackHandEl, "black");

      if (room.status === "gameover") {
        setToast(room.winner ? `${room.winner === "black" ? "先手" : "後手"}が勝った！` : "対局終了");
      }
    }

    setInterval(() => {
      if (state.room) render();
    }, 60);

    // 初期表示
    render();
  </script>
</body>
</html>
