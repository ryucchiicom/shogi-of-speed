      if (parsed.base === "CPU") {
        session.kind = "cpu";
        setActiveModsFromRoomCode();
        clearGameState();
        state.roomId = "CPU";
        state.roomRef = null;
        state.mySide = "black";
        state.roomData = { state: freshState(royalLabelsForLocal()), players:{ black:"local", white:"cpu" }, matchStartAt:null, rematchVotes:{} };
        state.cpuFinalized = false;
        updateMePill();
        refreshHands();
        setStatus("CPUモードで始めたよ。");
        scheduleRender(0);
        scheduleCpuLoop();
        return;
      }

      if (parsed.base === "1SMARTPHONE" || parsed.base === "1 SMARTPHONE") {
        session.kind = "local_dual";
        setActiveModsFromRoomCode();
        clearGameState();
        state.roomId = "1 SMARTPHONE";
        state.roomRef = null;
        state.mySide = "both";
        state.roomData = { state: freshState(royalLabelsForLocal()), players:{ black:"local", white:"local2" }, matchStartAt:null, rematchVotes:{} };
        updateMePill();
        refreshHands();
        setStatus("1 SMARTPHONEモードで始めたよ。");
        scheduleRender(0);
        return;
      }

      session.kind = "online";
      setActiveModsFromRoomCode();
      try {
        let code = parsed.base;
        if (!code) {
          code = Math.random().toString(36).slice(2, 8).toUpperCase();
          roomInput.value = code;
        }

        const ref = doc(db, "rooms", code);
        const snap = await getDoc(ref);
        if (!snap.exists()) {
          await setDoc(ref, makeOnlineRoomDoc(state.pid));
        }
        await connectOnlineRoom(code);
      } catch (err) {
        setStatus(`入室に失敗した: ${err.message}`);
      }
    };
    enterBtn.addEventListener("click", () => enterRoomHandler());

    async function renderAfterModChange() {
      renderHub();
      renderEditor();
      refreshThemeFromActiveMods();
      scheduleRender(0);
    }

    function saveCurrentModPrompt() {
      const mod = currentMod();
      if (!mod) return;
      mod.draftPrompt = promptInput.value;
      mod.updatedAt = Date.now();
      saveMods();
    }

    saveModBtn.addEventListener("click", async () => {
      saveCurrentModPrompt();
      await buildModWithAI("create");
      renderHub();
      renderEditor();
    });

    cloneVerBtn.addEventListener("click", async () => {
      saveCurrentModPrompt();
      await buildModWithAI("revise");
      renderHub();
      renderEditor();
    });

    deleteModBtn.addEventListener("click", () => {
      const mod = currentMod();
      if (!mod) return;
      if (!confirm(`MOD「${mod.name || mod.key}」を削除する？`)) return;
      delete state.mods[state.currentModKey];
      saveMods();
      state.currentModKey = "";
      state.editorSelectedVersion = null;
      state.view = "hub";
      renderHub();
      renderEditor();
    });

    window.addEventListener("error", (e) => {
      const msg = e?.error?.message || e.message || "unknown error";
      setStatus(`エラー: ${msg}`);
    });

    setInterval(() => {
      if (session.kind === "cpu") cpuThink();
    }, 500);

    function openHub() {
      if (modal.classList.contains("show")) {
        hideModal();
      } else {
        showModal("hub");
      }
      refreshModButton();
    }

    function saveCurrentModIfExists() {
      const mod = currentMod();
      if (!mod) return;
      mod.name = sanitizeNameLive(modNameInput.value || mod.name || "");
      mod.draftPrompt = promptInput.value.trim();
      mod.updatedAt = Date.now();
      saveMods();
    }

    modNameInput.addEventListener("blur", () => {
      modNameInput.value = sanitizeNameLive(modNameInput.value);
      saveCurrentModIfExists();
    });

    promptInput.addEventListener("blur", saveCurrentModIfExists);

    function switchToEditor(modKey, versionIndex = null) {
      state.currentModKey = modKey;
      state.editorSelectedVersion = versionIndex;
      state.view = "editor";
      const mod = currentMod();
      if (mod) {
        modNameInput.value = mod.name || "";
        promptInput.value = mod.draftPrompt || "";
      }
      showModal("editor");
    }

    // クリックで移動後に選択が残るのを防ぐ
    function clearSelectionAfterAction() {
      state.selected = null;
      refreshHands();
      scheduleRender(0);
    }

    // 置いたあとに次の駒をそのまま置けるよう、選択は残さず手を解く
    async function commitAndClear(destBoard) {
      const moved = await commitMove(destBoard);
      if (moved) {
        clearSelectionAfterAction();
      }
      return moved;
    }

    // 既存の board click を上書きせず、ここでゲーム開始時の処理をまとめる
    cleanupAndStart();
    scheduleCpuLoop();
  </script>
</body>
</html>
