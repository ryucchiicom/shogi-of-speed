            stats: pruned,
            games: Math.max(Number(snap.exists() ? snap.data()?.games || 0 : 0), STATE.aiGames || 0),
            updatedAt: Date.now()
          }, { merge: true });
          STATE.aiStats = pruned;
          STATE.aiPending = {};
          saveLocalAIMemory();
        });
      } catch {
        saveLocalAIMemory();
      }
    }

    function captureReward(type) {
      return Math.max(1.2, cpuValue(type) * 0.02);
    }

    function lossPenalty(type) {
      return -Math.max(1.2, cpuValue(type) * 0.02);
    }

    function terminalRewardForWinner(winnerSide) {
      return winnerSide === "white" ? 90 : -90;
    }

    function cpuValue(type) {
      return {
        king: 10000, rook: 500, bishop: 450, gold: 320, silver: 280, knight: 240, lance: 220,
        pawn: 120, tokin: 200, proLance: 200, proKnight: 200, proSilver: 200, horse: 650, dragon: 700
      }[type] || 100;
    }

    function aiHeuristic(meta, live, actorSide) {
      let score = 0;
      if (meta.capturedType) score += captureReward(meta.capturedType);
      if (meta.nextMode === "promoted") score += 0.8;
      if (meta.kind === "hand") score += 0.2;

      if (meta.pieceType === "pawn" || meta.pieceType === "lance") {
        score += (actorSide === "white" ? meta.to.y : 8 - meta.to.y) * 0.04;
      } else if (meta.pieceType === "knight") {
        score += (actorSide === "white" ? meta.to.y : 8 - meta.to.y) * 0.03;
      } else {
        score += (4 - Math.abs(meta.to.x - 4)) * 0.03;
        score += (4 - Math.abs(meta.to.y - 4)) * 0.03;
      }

      const oppSide = actorSide === "white" ? "black" : "white";
      const oppKing = kingPos(live.pieces, oppSide);
      if (oppKing) {
        const dist = Math.abs(oppKing.x - meta.to.x) + Math.abs(oppKing.y - meta.to.y);
        score += Math.max(0, (10 - dist)) * 0.02;
      }

      return score;
    }

    function aiEvaluateAction(meta, live, actorSide) {
      const key = aiActionKey(meta, actorSide);
      const learned = Math.max(-20, Math.min(20, aiAverage(key) * 2));
      return aiHeuristic(meta, live, actorSide) + learned;
    }

    function lostPieceTypes(prevPieces, nextPieces, side) {
      const nextIds = new Set((nextPieces || []).map(p => p.id));
      return (prevPieces || []).filter(p => p.side === side && !nextIds.has(p.id)).map(p => p.type);
    }

    function aiObserveTransition(prevLive, nextLive, actorSide, actionMeta) {
      if (!(STATE.roomData?.mode === "cpu" || STATE.roomData?.mode === "cpu_serious")) return;
      if (!prevLive || !nextLive) return;

      if (actorSide === "white" && actionMeta) {
        const key = aiActionKey(actionMeta, "white");
        STATE.lastCpuActionKey = key;
        STATE.episode.push(key);
        for (const t of lostPieceTypes(prevLive.pieces, nextLive.pieces, "black")) {
          aiReward(key, captureReward(t));
        }
      }

      if (actorSide === "black") {
        for (const t of lostPieceTypes(prevLive.pieces, nextLive.pieces, "white")) {
          if (STATE.lastCpuActionKey) aiReward(STATE.lastCpuActionKey, lossPenalty(t));
        }
      }

      if (nextLive.winner) {
        aiFinishEpisode(nextLive.winner);
      }
    }

    function aiFinishEpisode(winnerSide) {
      if (STATE.gameFinalized) return;
      STATE.gameFinalized = true;

      if (!STATE.episode?.length) {
        STATE.lastCpuActionKey = null;
        STATE.aiPending = {};
        saveLocalAIMemory();
        void saveAIMemoryToFirebase();
        return;
      }

      const base = terminalRewardForWinner(winnerSide);
      let factor = 1;
      for (let i = STATE.episode.length - 1; i >= 0; i--) {
        aiReward(STATE.episode[i], base * factor);
        factor *= 0.92;
      }

      STATE.episode = [];
      STATE.lastCpuActionKey = null;
      STATE.aiGames = (STATE.aiGames || 0) + 1;
      STATE.aiStats = pruneStats(STATE.aiStats, 1500);
      saveLocalAIMemory();
      void saveAIMemoryToFirebase();
    }

    function resetLocalEpisode() {
      STATE.episode = [];
      STATE.lastCpuActionKey = null;
      STATE.gameFinalized = false;
    }

    function setLocalRoom(kind) {
      clearTimers();
      if (STATE.unsub) {
        STATE.unsub();
        STATE.unsub = null;
      }

      STATE.roomRef = null;
      STATE.roomId = kind === "cpu" ? "CPU" : kind === "cpu_serious" ? "SERIOUS CPU" : "1 SMARTPHONE";
      STATE.mySide = kind === "local_dual" ? "both" : "black";
      STATE.roomData = {
        mode: kind,
        players: { black: "local", white: (kind === "cpu" || kind === "cpu_serious") ? "cpu" : "local2" },
        state: makeFreshState(),
        rematchVotes: {},
        matchStartAt: null
      };
      STATE.selected = null;
      resetLocalEpisode();
      updateMePill();
      refreshHands();
      renderActiveModsChips();
      scheduleRender(0);
      setStatus(kind === "cpu" ? "CPUモードで始めたよ。" : kind === "cpu_serious" ? "SERIOUS CPUモードで始めたよ。" : "1 SMARTPHONEモードで始めたよ。");
      if (kind === "cpu" || kind === "cpu_serious") {
        void ensureAIMemoryLoaded();
        scheduleCpuThink(cpuThinkDelay());
      }
    }

    function makeTransientModsPayload(selectedMods) {
      return (selectedMods || []).map(m => ({
        id: m.id,
        name: m.name,
        version: m.version,
        prompt: m.prompt || "",
        summary: m.summary || "",
        configPatch: m.configPatch || {},
        updatedAt: Date.now()
      }));
    }

    function resolvedTransientModsFromRoom(roomData) {
      const t = roomData?.transientMods || [];
      if (!Array.isArray(t)) return [];
      return t.filter(m => m && m.id && m.name && m.version).map(m => ({
        ...m,
        source: "transient"
      }));
    }

    function applyRoomModsFromSpecs(specs, roomData = null) {
      const localPool = STATE.modLibrary;
      const transientPool = resolvedTransientModsFromRoom(roomData);
      const pool = [...localPool, ...transientPool];
      const resolved = resolveModsForSelections(specs, pool);
      STATE.activeMods = resolved;
      saveLastSelectedMods(specs);
      updateRuntimeFromSelection();
      renderActiveModsChips();
      renderGameModPillFromInput();
      return resolved;
    }

    function updateModPreviewByRoomInput() {
      const parsed = parseRoomInput(el.roomInput.value);
      if (parsed.mode === "game") {
        el.modHintRow.classList.add("show");
      } else {
        el.modHintRow.classList.remove("show");
      }
      updateModSuggestions();
      renderGameModPillFromInput();
    }

    function parseRoomCommand() {
      const parsed = parseRoomInput(el.roomInput.value);
      if (parsed.mode === "empty") return { mode: "empty" };
      if (parsed.mode === "mod_toggle") return { mode: "mod_toggle" };
      if (parsed.mode === "game") {
        return {
          mode: "game",
          roomId: String(parsed.baseRoom || "").trim().toUpperCase(),
          modSelections: parseModSelections(parsed.modPart || "")
        };
      }
      return { mode: "empty" };
    }

    async function connectOnlineRoom(roomId, requestedMods = []) {
      roomId = String(roomId || "").trim().toUpperCase();
      if (!roomId) return;

      if (STATE.unsub) STATE.unsub();
      STATE.roomId = roomId;
      STATE.roomRef = doc(db, "rooms", roomId);
      STATE.selected = null;
      STATE.mySide = "spectator";
      updateMePill();
      applyRoomModsFromSpecs(requestedMods, STATE.roomData || null);

      await runTransaction(db, async (tx) => {
        const now = Date.now();
        const snap = await tx.get(STATE.roomRef);

        if (!snap.exists()) {
          const fresh = {
            players: { black: STATE.playerId, white: null },
            presence: { [STATE.playerId]: { side: "black", lastSeen: now } },
            state: makeFreshState(),
            lastWinnerSide: null,
            matchStartAt: null,
            rematchVotes: {},
            transientMods: makeTransientModsPayload(STATE.activeMods),
            transientModsUpdatedAt: now,
            createdAt: now,
            updatedAt: now
          };
          tx.set(STATE.roomRef, fresh);
          return;
        }

        const data = snap.data() || {};
        let players = data.players || { black: null, white: null };
        let presence = data.presence || {};
        let roomState = data.state || makeFreshState();
        let matchStartAt = data.matchStartAt || null;
        let rematchVotes = data.rematchVotes || {};
        let lastWinnerSide = data.lastWinnerSide || roomState.lastWinnerSide || null;

        if (!roomState.royalLabels) roomState.royalLabels = buildRoyalLabels(lastWinnerSide);

        if (Array.isArray(data.transientMods) && data.transientMods.length) {
          STATE.transientMods = data.transientMods;
        }

        const currentAlready = players.black === STATE.playerId || players.white === STATE.playerId;
        const blackActive = !!players.black && !!presence[players.black] && (now - (presence[players.black].lastSeen || 0) < STALE_MS);
        const whiteActive = !!players.white && !!presence[players.white] && (now - (presence[players.white].lastSeen || 0) < STALE_MS);
        const bothInactive = !blackActive && !whiteActive;

        if (bothInactive && !roomState.winner) {
          players = { black: STATE.playerId, white: null };
          presence = { [STATE.playerId]: { side: "black", lastSeen: now } };
          roomState = makeFreshState();
          matchStartAt = null;
          rematchVotes = {};
        } else if (roomState.winner && bothInactive) {
          players = { black: STATE.playerId, white: null };
          presence = { [STATE.playerId]: { side: "black", lastSeen: now } };
          roomState = makeFreshState();
          matchStartAt = null;
          rematchVotes = {};
        } else if (!currentAlready) {
          if (!blackActive) {
            players.black = STATE.playerId;
            presence[STATE.playerId] = { side: "black", lastSeen: now };
          } else if (!whiteActive) {
            players.white = STATE.playerId;
            presence[STATE.playerId] = { side: "white", lastSeen: now };
          } else {
            presence[STATE.playerId] = { side: "spectator", lastSeen: now };
          }
        } else {
          const side = players.black === STATE.playerId ? "black" : "white";
          presence[STATE.playerId] = { side, lastSeen: now };
        }

        const bothReady = !!players.black && !!players.white;
        if (bothReady && !matchStartAt && !roomState.winner) matchStartAt = now + (STATE.runtime.matchCountdownMs || 3000);

        const update = {
          players,
          presence,
          state: roomState,
          lastWinnerSide,
          matchStartAt,
          rematchVotes,
          updatedAt: now
        };
        if (STATE.activeMods.length) {
          update.transientMods = makeTransientModsPayload(STATE.activeMods);
          update.transientModsUpdatedAt = now;
        }
        tx.update(STATE.roomRef, update);
      });

      STATE.unsub = onSnapshot(STATE.roomRef, (snap) => {
        if (!snap.exists()) {
          setStatus("ルームが見つからないよ。");
          return;
        }

        const data = snap.data();
        STATE.roomData = data;
        STATE.transientMods = resolvedTransientModsFromRoom(data);
        if (STATE.transientMods.length && (!STATE.activeMods.length || STATE.uiMode === "game")) {
          const resolved = STATE.transientMods.map(m => ({
            ...m,
            source: "transient"
          }));
          STATE.activeMods = resolved;
          updateRuntimeFromSelection();
          renderActiveModsChips();
          renderGameModPillFromInput();
        }

        const players = STATE.roomData.players || {};
        STATE.mySide = players.black === STATE.playerId ? "black" : players.white === STATE.playerId ? "white" : "spectator";
        if (STATE.selected?.kind === "piece") {
          const stillThere = STATE.roomData.state?.pieces?.some(p => p.id === STATE.selected.id);
          if (!stillThere) STATE.selected = null;
        }

        updateMePill();
        const live = STATE.roomData.state || {};
        if (live.winner) {
          setStatus("勝敗がついたよ。");
        } else if (!players.black || !players.white) {
          setStatus(`ルーム ${STATE.roomId} に接続中。相手待ちだよ。`);
        } else {
          const now = Date.now();
          if (STATE.roomData.matchStartAt && now < STATE.roomData.matchStartAt) setStatus(`ルーム ${STATE.roomId} に接続中。開始カウントダウン中。`);
          else setStatus(`ルーム ${STATE.roomId} に接続中。`);
        }

        refreshHands();
        renderGameModPillFromInput();
        scheduleRender(0);
        if ((STATE.roomData.mode === "cpu" || STATE.roomData.mode === "cpu_serious") && live && !live.winner) scheduleCpuThink(cpuThinkDelay());
      });

      setStatus(`ルーム ${roomId} に接続したよ。`);
      scheduleRender(0);
    }

    async function enterRoom() {
      const parsed = parseRoomCommand();
      if (parsed.mode === "mod_toggle") {
        toggleModManager();
        return;
      }

      if (parsed.mode !== "game") return;
      const roomId = String(parsed.roomId || "").trim().toUpperCase();

      if (roomId === "MOD" || roomId === "MODS") {
        toggleModManager();
        return;
      }

      const hasModSelection = (parsed.modSelections || []).length > 0;
      if (!roomId && !hasModSelection) {
        const rand = randomRoomId();
        el.roomInput.value = rand;
        await connectOnlineRoom(rand, []);
        return;
      }

      if (!roomId) {
        setStatus("ルームコードを入れてね。");
        return;
      }

      if (roomId === "CPU" || roomId === "SERIOUS CPU" || roomId === "SERIOUSCPU" || roomId === "1 SMARTPHONE") {
        const mode = specialModeFromCode(roomId);
        STATE.roomData = null;
        STATE.roomId = roomId;
        STATE.mySide = mode === "local_dual" ? "both" : "black";
        STATE.requestedModSpecs = parsed.modSelections || [];
        applyRoomModsFromSpecs(parsed.modSelections || [], null);
        setLocalRoom(mode);
        return;
      }

      STATE.requestedModSpecs = parsed.modSelections || [];
      applyRoomModsFromSpecs(STATE.requestedModSpecs, STATE.roomData || null);
      await connectOnlineRoom(roomId, STATE.requestedModSpecs);
    }

    function specialModeFromCode(code) {
      const c = String(code || "").trim().toUpperCase().replace(/[\s_]/g, "");
      if (c === "CPU") return "cpu";
      if (c === "SERIOUSCPU") return "cpu_serious";
      if (c === "1SMARTPHONE") return "local_dual";
      return "online";
    }

    function renderGameModPill() {
      const parsed = parseRoomInput(el.roomInput.value);
      if (parsed.mode !== "game") {
        el.modPill.textContent = "MODなし";
        return;
      }
      const sels = parseModSelections(parsed.modPart || "");
      if (!sels.length) {
        el.modPill.textContent = "MODなし";
        return;
      }
      const resolved = resolveModsForSelections(sels, [...STATE.modLibrary, ...STATE.transientMods]);
      if (!resolved.length) {
        el.modPill.textContent = "MOD: 見つからない";
        return;
      }
      el.modPill.innerHTML = `MOD: ${resolved.map(m => `<span class="chip small">${escapeHtml(m.name)}${m.version ? ` (v${m.version})` : ""}</span>`).join(" ")}`;
    }

    function renderModSuggestions() {
      updateModSuggestions();
    }

    function updateRoomParsingUI() {
      renderGameModPill();
      renderModSuggestions();
    }

    function parseTypedRoomCodeForGame() {
      const p = parseRoomInput(el.roomInput.value);
      if (p.mode !== "game") return;
      const selection = parseModSelections(p.modPart || "");
      STATE.requestedModSpecs = selection;
      const resolved = resolveModsForSelections(selection, [...STATE.modLibrary, ...STATE.transientMods]);
      STATE.activeMods = resolved;
      updateRuntimeFromSelection();
      renderActiveModsChips();
    }

    function cpuThinkScore(meta, live, actorSide) {
      return aiEvaluateAction(meta, live, actorSide) + Math.random() * 2;
    }

    async function cpuThink() {
      if (!(STATE.roomData?.mode === "cpu" || STATE.roomData?.mode === "cpu_serious")) return;
      if (STATE.cpuThinking) return;
      STATE.cpuThinking = true;

      try {
        await ensureAIMemoryLoaded();
        const live = STATE.roomData.state;
        if (!live || live.winner) return;
        const now = Date.now();
        if (STATE.roomData.matchStartAt && now < STATE.roomData.matchStartAt) {
          scheduleCpuThink();
          return;
        }

        const actorSide = "white";
        const actions = [];

        for (const p of live.pieces) {
          if (p.side !== actorSide) continue;
          if (p.cooldownUntil && now < p.cooldownUntil) continue;
          const moves = legalMovesForPiece(live, p, true);
          for (const mv of moves) {
            const meta = {
              kind: "piece",
              pieceType: p.type,
              promoMode: p.promoMode,
              from: { x: p.x, y: p.y },
              to: { x: mv.x, y: mv.y },
              capturedType: pieceAt(live.pieces, mv.x, mv.y)?.type || null,
              nextMode: mv.nextMode || p.promoMode || "normal",
              moveKind: mv.kind || "normal"
            };
            actions.push({
              selected: { kind: "piece", id: p.id },
              dest: { x: mv.x, y: mv.y },
              meta,
              score: cpuThinkScore(meta, live, actorSide)
            });
          }
        }

        const handCooldown = live.handCooldownUntil?.white || 0;
        if (handCooldown <= now) {
          for (const t of pieceOrder) {
            const count = live.hands.white?.[t] || 0;
            if (!count) continue;
            for (let y = 0; y < 9; y++) {
              for (let x = 0; x < 9; x++) {
                if (pieceAt(live.pieces, x, y)) continue;
                const meta = {
                  kind: "hand",
                  pieceType: t,
                  promoMode: "hand",
                  from: null,
                  to: { x, y },
                  capturedType: null,
                  nextMode: "normal",
                  moveKind: "drop"
                };
                actions.push({
                  selected: { kind: "hand", side: "white", type: t },
                  dest: { x, y },
                  meta,
                  score: cpuThinkScore(meta, live, actorSide)
                });
              }
            }
          }
        }

        if (!actions.length) {
          scheduleCpuThink();
          return;
        }

        actions.sort((a,b) => b.score - a.score);
        const pool = actions.slice(0, Math.min(6, actions.length));
        const pick = Math.random() < 0.75 ? pool[0] : pool[Math.floor(Math.random() * pool.length)];

        const prevLive = cloneState(live);
        const next = applyActionToLive(live, pick.selected, "white", pick.dest, false);
        if (!next) {
          scheduleCpuThink();
          return;
        }

        STATE.roomData.state = next;
        STATE.roomData.updatedAt = Date.now();
        if (next.winner) STATE.roomData.lastWinnerSide = next.lastWinnerSide || next.winner || null;
        refreshHands();
        aiObserveTransition(prevLive, next, "white", pick.meta);
        scheduleRender(0);

        if (!next.winner) scheduleCpuThink();
      } finally {
        STATE.cpuThinking = false;
      }
    }

    async function refreshLocalRematchImmediate() {
      if (!STATE.roomData) return;
      const historyWinner = STATE.roomData.lastWinnerSide || STATE.roomData.state?.lastWinnerSide || STATE.roomData.state?.winner || null;
      STATE.roomData.state = makeFreshState();
      STATE.roomData.state.royalLabels = buildRoyalLabels(historyWinner);
      STATE.roomData.lastWinnerSide = historyWinner;
      STATE.roomData.matchStartAt = null;
      STATE.roomData.rematchVotes = {};
      STATE.roomData.updatedAt = Date.now();
      STATE.selected = null;
      resetLocalEpisode();
      refreshHands();
      scheduleRender(0);
      if (STATE.roomData.mode === "cpu" || STATE.roomData.mode === "cpu_serious") scheduleCpuThink();
    }

    async function voteRematch(yes) {
      if (STATE.roomData?.mode !== "online") {
        if (yes) {
          await refreshLocalRematchImmediate();
          el.rematchOverlay.classList.remove("show");
        } else {
          leaveToHome();
        }
        return;
      }

      if (!STATE.roomRef || !STATE.roomData) return;
      const room = STATE.roomData;
      if (!room.state?.winner || !room.players?.black || !room.players?.white) return;

      await runTransaction(db, async (tx) => {
        const snap = await tx.get(STATE.roomRef);
        if (!snap.exists()) return;
        const data = snap.data() || {};
        const live = data.state || {};
        const players = data.players || {};
        const rematchVotes = data.rematchVotes || {};
        const now = Date.now();

        const mySide = players.black === STATE.playerId ? "black" : players.white === STATE.playerId ? "white" : "spectator";
        if (mySide === "spectator") return;
        if (!live.winner || !players.black || !players.white) return;

        if (yes) rematchVotes[STATE.playerId] = true;
        else delete rematchVotes[STATE.playerId];

        const blackPid = players.black;
        const whitePid = players.white;
        const bothYes = !!rematchVotes[blackPid] && !!rematchVotes[whitePid];
        const historyWinner = data.lastWinnerSide || live.lastWinnerSide || live.winner || null;

        if (bothYes) {
          tx.update(STATE.roomRef, {
            state: makeFreshState(),
            lastWinnerSide: historyWinner,
            matchStartAt: now + (STATE.runtime.matchCountdownMs || 3000),
            rematchVotes: {},
            forceHomeAt: null,
            updatedAt: now
          });
          return;
        }

        if (!yes) {
          tx.update(STATE.roomRef, { rematchVotes: {}, forceHomeAt: now, updatedAt: now });
          return;
        }

        tx.update(STATE.roomRef, { rematchVotes, updatedAt: now });
      }).catch(err => setStatus(`リマッチの処理に失敗した: ${err.message}`));

      if (!yes) leaveToHome();
    }

    function leaveToHome() {
      if (STATE.unsub) {
        STATE.unsub();
        STATE.unsub = null;
      }
      clearTimers();
      STATE.roomId = "";
      STATE.roomRef = null;
      STATE.roomData = null;
      STATE.mySide = "spectator";
      STATE.selected = null;
      STATE.dragPointerId = null;
      STATE.dragStart = null;
      STATE.dragging = false;
      STATE.dragSource = null;
      hideRematchOverlay();
      el.roomInput.value = "";
      updateMePill();
      refreshHands();
      setViewMode("game");
      setStatus("ルームコードを入れて「入室 / 作成」を押してね。");
      scheduleRender(0);
    }

    function clearTimers() {
      if (STATE.renderTimer) clearTimeout(STATE.renderTimer);
      if (STATE.cpuTimer) clearTimeout(STATE.cpuTimer);
      STATE.renderTimer = null;
      STATE.cpuTimer = null;
      STATE.cpuThinking = false;
    }

    function selectedLegalDropsOrMoves(live) {
      return selectedLegalMoves(live);
    }

    function getSlidePieceTarget(releasePoint) {
      const live = STATE.roomData?.state;
      const piece = selectedPieceObj();
      if (!live || !piece) return null;

      const start = pieceScreenCenter(piece);
      const dragOct = octantFromVector(releasePoint.x - start.x, releasePoint.y - start.y);
      if (dragOct === null) return null;

      const legal = selectedLegalDropsOrMoves(live);
      if (!legal.length) return null;

      let best = null;
      let bestD = Infinity;
      for (const m of legal) {
        const s = boardToScreen(m.x, m.y);
        const center = { x: s.x + 0.5, y: s.y + 0.5 };
        const moveOct = octantFromVector(center.x - start.x, center.y - start.y);
        if (moveOct !== dragOct) continue;

        const d = (center.x - releasePoint.x) ** 2 + (center.y - releasePoint.y) ** 2;
        if (d < bestD) {
          bestD = d;
          best = m;
        }
      }

      return best;
    }

    function getHandDropTarget(ev) {
      const sq = pointToSquare(ev);
      if (!sq) return null;
      const board = screenToBoard(sq.x, sq.y);
      const live = STATE.roomData?.state;
      if (!live) return null;
      if (pieceAt(live.pieces, board.x, board.y)) return null;
      return board;
    }

    function buildActionMeta(live, selected, destBoard) {
      if (!selected) return null;
      if (selected.kind === "piece") {
        const piece = live.pieces.find(p => p.id === selected.id);
        if (!piece) return null;
        const captured = pieceAt(live.pieces, destBoard.x, destBoard.y);
        const legal = legalMovesForPiece(live, piece, true);
        const move = legal.find(m => m.x === destBoard.x && m.y === destBoard.y);
        return {
          kind: "piece",
          pieceType: piece.type,
          promoMode: piece.promoMode,
          from: { x: piece.x, y: piece.y },
          to: { x: destBoard.x, y: destBoard.y },
          capturedType: captured?.type || null,
          nextMode: move?.nextMode || piece.promoMode || "normal",
          moveKind: move?.kind || "normal"
        };
      }
      if (selected.kind === "hand") {
        return {
          kind: "hand",
          pieceType: selected.type,
          promoMode: "hand",
          from: null,
          to: { x: destBoard.x, y: destBoard.y },
          capturedType: null,
          nextMode: "normal",
          moveKind: "drop"
        };
      }
      return null;
    }

    async function commitMove(destBoard) {
      const live = STATE.roomData?.state;
      if (!live || !STATE.selected) return;

      if (STATE.roomData?.mode === "online") {
        if (!STATE.roomRef) return;
        if (!canAct()) return;

        await runTransaction(db, async (tx) => {
          const snap = await tx.get(STATE.roomRef);
          if (!snap.exists()) return;
          const room = snap.data();
          const currentLive = room.state;
          if (!currentLive || currentLive.winner) return;

          const now = Date.now();
          if (room.matchStartAt && now < room.matchStartAt) return;

          const side = room.players?.black === STATE.playerId ? "black"
                    : room.players?.white === STATE.playerId ? "white"
                    : "spectator";
          if (side === "spectator") return;
          if (!canControlSide(selectedSideOfSelection())) return;

          const next = applyActionToLive(currentLive, STATE.selected, side, destBoard, false);
          if (!next) return;

          const presence = room.presence || {};
          presence[STATE.playerId] = { side, lastSeen: now };

          const update = { state: next, presence, updatedAt: now };
          if (next.winner) update.lastWinnerSide = next.lastWinnerSide || next.winner;
          tx.update(STATE.roomRef, update);
        }).catch(err => setStatus(`動かせなかった: ${err.message}`));

        scheduleRender(0);
        return;
      }

      const liveLocal = STATE.roomData?.state;
      if (!liveLocal) return;

      const anySide = STATE.roomData?.mode === "local_dual";
      const actorSide = STATE.roomData?.mode === "cpu" || STATE.roomData?.mode === "cpu_serious" ? "black" : null;
      const selected = STATE.selected.kind === "piece" || STATE.selected.kind === "hand" ? STATE.selected : null;
      const prevLive = cloneState(liveLocal);
      const next = applyActionToLive(liveLocal, selected, actorSide, destBoard, anySide);
      if (!next) return;

      STATE.roomData.state = next;
      if (next.winner) STATE.roomData.lastWinnerSide = next.lastWinnerSide || next.winner || null;
      STATE.roomData.updatedAt = Date.now();
      refreshHands();
      scheduleRender(0);

      if (STATE.roomData?.mode === "cpu" || STATE.roomData?.mode === "cpu_serious") {
        const actionMeta = buildActionMeta(prevLive, selected, destBoard);
        aiObserveTransition(prevLive, next, actorSide, actionMeta);
        if (!next.winner) scheduleCpuThink();
      }
    }

    function getHandDropTargetFromSelected(ev) {
      const sq = pointToSquare(ev);
      if (!sq) return null;
      const board = screenToBoard(sq.x, sq.y);
      const live = STATE.roomData?.state;
      if (!live) return null;
      if (pieceAt(live.pieces, board.x, board.y)) return null;
      return board;
    }

    el.board.addEventListener("click", async (ev) => {
      if (performance.now() < STATE.suppressClickUntil) return;
      if (!STATE.roomData) return;
      if (STATE.uiMode !== "game") return;

      const sq = pointToSquare(ev);
      if (!sq) return;

      const clicked = pieceUnderSquare(sq.x, sq.y);
      const mode = el.modeSelect.value;
      const live = STATE.roomData.state;

      if (mode === "tap") {
        if (!STATE.selected) {
          if (clicked && canControlSide(clicked.side)) {
            STATE.selected = { kind: "piece", id: clicked.id };
            STATE.dragSource = "board";
            refreshHands();
            scheduleRender(0);
          }
          return;
        }

        if (STATE.selected.kind === "piece") {
          const selectedPiece = live.pieces.find(p => p.id === STATE.selected.id);
          if (selectedPiece && canControlSide(selectedPiece.side)) {
            const destBoard = screenToBoard(sq.x, sq.y);
            const legal = legalMovesForPiece(live, selectedPiece, true);
            const move = legal.find(m => m.x === destBoard.x && m.y === destBoard.y);
            if (move) {
              await commitMove(destBoard);
              clearSelection();
              return;
            }
          }
          if (clicked && canControlSide(clicked.side)) {
            STATE.selected = { kind: "piece", id: clicked.id };
            STATE.dragSource = "board";
            refreshHands();
            scheduleRender(0);
            return;
          }
          clearSelection();
          return;
        }

        if (STATE.selected.kind === "hand") {
          const destBoard = screenToBoard(sq.x, sq.y);
          await commitMove(destBoard);
          clearSelection();
          return;
        }
      }

      if (mode === "slide") {
        if (STATE.selected?.kind === "hand") {
          const destBoard = screenToBoard(sq.x, sq.y);
          await commitMove(destBoard);
          clearSelection();
          return;
        }
        if (clicked && canControlSide(clicked.side)) {
          STATE.selected = { kind: "piece", id: clicked.id };
          STATE.dragSource = "board";
          refreshHands();
          scheduleRender(0);
        }
      }
    });

    el.board.addEventListener("pointerdown", (ev) => {
      if (STATE.uiMode !== "game") return;
      if (el.modeSelect.value !== "slide") return;
      el.board.setPointerCapture(ev.pointerId);
      STATE.dragPointerId = ev.pointerId;
      STATE.dragStart = { x: ev.clientX, y: ev.clientY };
      STATE.dragging = false;
      STATE.dragSource = "board";

      const sq = pointToSquare(ev);
      if (!sq) return;
      const clicked = pieceUnderSquare(sq.x, sq.y);
      const board = screenToBoard(sq.x, sq.y);

      if (STATE.selected?.kind === "hand") {
        const live = STATE.roomData?.state;
        const empty = live && !pieceAt(live.pieces, board.x, board.y);
        if (empty) {
          commitMove(board).then(() => clearSelection());
          return;
        }
      }

      if (clicked && canControlSide(clicked.side)) {
        STATE.selected = { kind: "piece", id: clicked.id };
        STATE.dragSource = "board";
        refreshHands();
        scheduleRender(0);
      }
    });

    el.board.addEventListener("pointermove", (ev) => {
      if (STATE.uiMode !== "game") return;
      if (el.modeSelect.value !== "slide") return;
      if (STATE.dragPointerId !== ev.pointerId || !STATE.dragStart) return;
      const dx = ev.clientX - STATE.dragStart.x;
      const dy = ev.clientY - STATE.dragStart.y;
      if (Math.hypot(dx, dy) > 6) STATE.dragging = true;
    });

    function finishSlidePointer(ev) {
      if (STATE.uiMode !== "game") return;
      if (el.modeSelect.value !== "slide") return;
      if (STATE.dragPointerId != null && STATE.dragPointerId !== ev.pointerId) return;
      STATE.suppressClickUntil = performance.now() + 250;

      if (STATE.selected && STATE.selected.kind === "piece" && STATE.dragging) {
        const releasePoint = pointFromEvent(ev);
        const targetMove = getSlidePieceTarget(releasePoint);
        if (targetMove) {
          const live = STATE.roomData?.state;
          const selectedPiece = live?.pieces.find(p => p.id === STATE.selected.id);
          if (selectedPiece && canControlSide(selectedPiece.side)) {
            commitMove({ x: targetMove.x, y: targetMove.y }).then(() => clearSelection());
          }
        }
      }

      if (STATE.selected && STATE.selected.kind === "hand" && STATE.dragSource === "hand") {
        const targetBoard = getHandDropTargetFromSelected(ev);
        if (targetBoard) {
          commitMove(targetBoard).then(() => clearSelection());
        }
      }

      STATE.dragPointerId = null;
      STATE.dragStart = null;
      STATE.dragging = false;
    }

    document.addEventListener("pointerup", finishSlidePointer, true);
    el.board.addEventListener("pointercancel", () => {
      STATE.dragPointerId = null;
      STATE.dragStart = null;
      STATE.dragging = false;
      STATE.dragSource = null;
    });

    function pointFromEvent(ev) {
      const rect = el.board.getBoundingClientRect();
      return {
        x: (ev.clientX - rect.left) / rect.width * 9,
        y: (ev.clientY - rect.top) / rect.height * 9
      };
    }

    function renderModManager() {
      el.modList.innerHTML = "";
      const sorted = [...STATE.modLibrary].sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));

      for (const mod of sorted) {
        const last = mod.versions.at(-1);
        const card = document.createElement("div");
        card.className = "modCard";
        if (mod.id === STATE.selectedModId) card.style.outline = "2px solid rgba(122,164,245,.3)";
        card.innerHTML = `
          <div class="title">${escapeHtml(mod.name || "無題MOD")}</div>
          <div class="sub">${last ? `最新 v${last.version} / ${escapeHtml(last.summary || "")}` : "まだバージョンなし"}</div>
        `;
        card.addEventListener("click", () => {
          STATE.selectedModId = mod.id;
          STATE.selectedVersionIndex = mod.versions.length ? mod.versions.length - 1 : null;
          STATE.editorDraft = {
            name: mod.name,
            prompt: mod.versions.at(-1)?.prompt || "",
            selectedSummary: mod.versions.at(-1)?.summary || "",
            selectedConfig: mod.versions.at(-1)?.configPatch || {}
          };
          renderModManager();
          renderEditor();
        });
        el.modList.appendChild(card);
      }
    }

    function renderEditor() {
      const mod = currentSelectedMod();
      if (!mod) {
        el.modEditor.classList.remove("show");
        el.modEditor.style.display = "block";
        el.modEditorTitle.textContent = "MODを選んでね";
        el.modVersionRow.innerHTML = "";
        el.modPreview.textContent = "まだMODが選ばれていないよ。";
        el.modNameInput.value = "";
        el.modPromptInput.value = "";
        return;
      }

      el.modEditor.classList.add("show");
      el.modEditor.style.display = "block";
      el.modEditorTitle.textContent = mod.name ? `MOD編集: ${mod.name}` : "新規MOD";
      el.modNameInput.value = mod.name || "";
      el.modPromptInput.value = STATE.editorDraft?.prompt ?? (mod.versions.at(-1)?.prompt || "");

      el.modVersionRow.innerHTML = "";
      mod.versions.forEach((v, idx) => {
        const b = document.createElement("button");
        b.className = "versionChip" + (STATE.selectedVersionIndex === idx ? " active" : "");
        b.textContent = `v${v.version}`;
        b.addEventListener("click", () => {
          STATE.selectedVersionIndex = idx;
          const ver = mod.versions[idx];
          STATE.editorDraft = {
            name: mod.name,
            prompt: ver.prompt || "",
            selectedSummary: ver.summary || "",
            selectedConfig: ver.configPatch || {}
          };
          renderEditor();
        });
        el.modVersionRow.appendChild(b);
      });

      const current = currentSelectedVersion();
      if (current) {
        el.modPreview.textContent = `説明:\n${current.summary || "(なし)"}\n\nAI入力:\n${current.prompt || "(なし)"}\n\n変更内容:\n${JSON.stringify(current.configPatch || {}, null, 2)}`;
      } else {
        el.modPreview.textContent = "まだバージョンがないよ。AIで最初のバージョンを作ってね。";
      }
    }

    function createEmptyMod() {
      const id = "mod_" + Math.random().toString(16).slice(2) + "_" + Date.now();
      const mod = {
        id,
        name: "",
        createdAt: Date.now(),
        updatedAt: Date.now(),
        versions: []
      };
      STATE.modLibrary.unshift(mod);
      STATE.selectedModId = id;
      STATE.selectedVersionIndex = null;
      STATE.editorDraft = { name: "", prompt: "", selectedSummary: "", selectedConfig: {} };
      saveModLibrary();
      renderModManager();
      renderEditor();
    }

    function saveCurrentMod() {
      const mod = currentSelectedMod();
      if (!mod) return;
      mod.name = sanitizeModName(el.modNameInput.value);
      mod.updatedAt = Date.now();
      saveModLibrary();
      renderModManager();
      renderEditor();
      renderActiveModsChips();
    }

    function saveAndGenerateVersion() {
      let mod = currentSelectedMod();
      if (!mod) {
        createEmptyMod();
        mod = currentSelectedMod();
      }
      if (!mod) return;
      mod.name = sanitizeModName(el.modNameInput.value);
      const prompt = el.modPromptInput.value || "";
      const version = createVersionFromPrompt(mod, prompt);
      mod.versions.push(version);
      mod.updatedAt = Date.now();
      STATE.selectedVersionIndex = mod.versions.length - 1;
      STATE.editorDraft = {
        name: mod.name,
        prompt,
        selectedSummary: version.summary,
        selectedConfig: version.configPatch
      };
      saveModLibrary();
      renderModManager();
      renderEditor();
      renderActiveModsChips();
    }

    function deleteSelectedMod() {
      const mod = currentSelectedMod();
      if (!mod) return;
      STATE.modLibrary = STATE.modLibrary.filter(m => m.id !== mod.id);
      STATE.selectedModId = null;
      STATE.selectedVersionIndex = null;
      STATE.editorDraft = null;
      saveModLibrary();
      renderModManager();
      renderEditor();
      renderActiveModsChips();
    }

    function renderActiveModsChips() {
      const mods = STATE.activeMods || [];
      if (!mods.length) {
        el.modPill.textContent = "MODなし";
        return;
      }
      el.modPill.innerHTML = `MOD: ${mods.map(m => `<span class="chip small">${escapeHtml(m.name)}${m.version ? ` (v${m.version})` : ""}</span>`).join(" ")}`;
    }

    function renderModSuggestions() {
      updateModSuggestions();
    }

    function setViewMode(mode) {
      STATE.uiMode = mode;
      el.gameView.style.display = mode === "game" ? "block" : "none";
      el.modView.classList.toggle("show", mode === "mods");
      el.modView.style.display = mode === "mods" ? "block" : "none";
      if (mode === "game") {
        el.modHintRow.classList.remove("show");
      }
    }

    function toggleModManager() {
      if (STATE.uiMode === "mods") {
        setViewMode("game");
        renderActiveModsChips();
        updateModSuggestions();
        scheduleRender(0);
      } else {
        setViewMode("mods");
        renderModManager();
        renderEditor();
      }
    }

    function updateModSuggestions() {
      const parsed = parseRoomInput(el.roomInput.value);
      if (parsed.mode !== "game" || (!parsed.modPart && !/MOD=/i.test(el.roomInput.value))) {
        el.modHintRow.classList.remove("show");
        el.modHintRow.innerHTML = "";
        return;
      }

      const typed = parseModSelections(parsed.modPart || "");
      const typedName = typed.at(-1)?.name || "";
      const matched = STATE.modLibrary.filter(m => !typedName || (m.name || "").toUpperCase().includes(typedName.toUpperCase())).slice(0, 8);

      el.modHintRow.innerHTML = "";
      if (!matched.length) {
        el.modHintRow.classList.add("show");
        el.modHintRow.innerHTML = `<span class="pill">一致するMODがないよ</span>`;
        return;
      }

      el.modHintRow.classList.add("show");
      for (const mod of matched) {
        const last = mod.versions.at(-1);
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = `${mod.name}${last ? ` (v${last.version})` : ""}`;
        chip.addEventListener("click", () => {
          const raw = el.roomInput.value;
          const up = raw.toUpperCase();
          const idx = up.indexOf("MOD=");
          if (idx < 0) return;
          const before = raw.slice(0, idx + 4);
          const existing = raw.slice(idx + 4).trim();
          const list = existing ? existing.split(",").map(s => s.trim()).filter(Boolean) : [];
          if (!list.some(s => s.toUpperCase().startsWith(mod.name.toUpperCase()))) list.push(mod.name);
          el.roomInput.value = before + list.join(", ");
          updateModSuggestions();
          renderGameModPill();
        });
        el.modHintRow.appendChild(chip);
      }
    }

    function updateRuntimeFromSelection() {
      const built = buildRuntimeFromSelections(STATE.activeMods);
      STATE.runtime = built.runtime;
      applyRuntimeToCSS();
    }

    function renderGameModPill() {
      const parsed = parseRoomInput(el.roomInput.value);
      if (parsed.mode !== "game") {
        el.modPill.textContent = "MODなし";
        return;
      }
      const sels = parseModSelections(parsed.modPart || "");
      if (!sels.length) {
        el.modPill.textContent = "MODなし";
        return;
      }
      const resolved = resolveModsForSelections(sels, [...STATE.modLibrary, ...STATE.transientMods]);
      if (!resolved.length) {
        el.modPill.textContent = "MOD: 見つからない";
        return;
      }
      el.modPill.innerHTML = `MOD: ${resolved.map(m => `<span class="chip small">${escapeHtml(m.name)}${m.version ? ` (v${m.version})` : ""}</span>`).join(" ")}`;
    }

    function selectModsFromRoomInput() {
      const parsed = parseRoomInput(el.roomInput.value);
      if (parsed.mode !== "game") return [];
      const selections = parseModSelections(parsed.modPart || "");
      STATE.requestedModSpecs = selections;
      const resolved = resolveModsForSelections(selections, [...STATE.modLibrary, ...STATE.transientMods]);
      STATE.activeMods = resolved;
      saveLastSelectedMods(selections);
      updateRuntimeFromSelection();
      renderActiveModsChips();
      renderGameModPill();
      return resolved;
    }

    function applyRuntimeToCSS() {
      const rt = STATE.runtime || DEFAULTS;
      document.documentElement.style.setProperty("--board-dark", rt.boardDark || DEFAULTS.boardDark);
      document.documentElement.style.setProperty("--board-light", rt.boardLight || DEFAULTS.boardLight);
      document.documentElement.style.setProperty("--piece-fill-1", rt.pieceFill1 || DEFAULTS.pieceFill1);
      document.documentElement.style.setProperty("--piece-fill-2", rt.pieceFill2 || DEFAULTS.pieceFill2);
      document.documentElement.style.setProperty("--overlay", rt.overlayFill || DEFAULTS.overlayFill);
    }

      STATE.requestedModSpecs = last;

      updateRuntimeFromSelection();

          const now = Date.now();
          tx.update(STATE.roomRef, {

            transientModsUpdatedAt: now,
            updatedAt: now
          });
        });
      } catch {}
    }

      STATE.cpuTimer = null;
      STATE.cpuThinking = false;

    function createVersionFromPrompt(mod, prompt) {
      const currentRuntime = buildRuntimeFromSelections(STATE.activeMods).runtime;
      const { summary, patch } = heuristicGeneratePatch(prompt, currentRuntime);
      const version = (mod.versions.at(-1)?.version || 0) + 1;
      return {
        version,
        prompt: String(prompt || ""),
        summary,
        configPatch: patch,
        createdAt: Date.now()
      };
    }

    function currentSelectedMod() {
      return STATE.modLibrary.find(m => m.id === STATE.selectedModId) || null;
    }

    function currentSelectedVersion() {
      const mod = currentSelectedMod();
      if (!mod) return null;
      const idx = STATE.selectedVersionIndex;
      if (idx === null || idx === undefined) return mod.versions.at(-1) || null;
      return mod.versions[idx] || null;
    }

    function renderEditorSelectionToFields() {
      const mod = currentSelectedMod();
      if (!mod) return;
      el.modNameInput.value = mod.name || "";
      const ver = currentSelectedVersion();
      if (ver) el.modPromptInput.value = ver.prompt || "";
    }

    async function enterOrToggleByInput() {
      const parsed = parseRoomCommand();
      if (parsed.mode === "mod_toggle") {
        toggleModManager();
        return;
      }
      if (parsed.mode !== "game") return;

      if (parsed.roomId === "MOD" || parsed.roomId === "MODS") {
        toggleModManager();
        return;
      }

      selectModsFromRoomInput();

      if (parsed.roomId === "CPU" || parsed.roomId === "SERIOUSCPU" || parsed.roomId === "SERIOUS CPU" || parsed.roomId === "1 SMARTPHONE") {
        const mode = specialModeFromCode(parsed.roomId);
        STATE.roomData = null;
        STATE.roomId = parsed.roomId;
        STATE.mySide = mode === "local_dual" ? "both" : "black";
        setLocalRoom(mode);
        return;
      }

      if (!parsed.roomId && !parsed.modSelections.length) {
        const rand = randomRoomId();
        el.roomInput.value = rand;
        await connectOnlineRoom(rand, []);
        return;
      }

      if (!parsed.roomId) {
        setStatus("ルームコードを入れてね。");
        return;
      }

      await connectOnlineRoom(parsed.roomId, parsed.modSelections || []);
      syncRoomFromCurrentModsIfOwner();
    }

    async function connectOnlineRoom(roomId, requestedMods = []) {
      roomId = String(roomId || "").trim().toUpperCase();
      if (!roomId) return;

      if (STATE.unsub) STATE.unsub();
      STATE.roomId = roomId;
      STATE.roomRef = doc(db, "rooms", roomId);
      STATE.selected = null;
      STATE.mySide = "spectator";
      updateMePill();
      applyRoomModsFromSpecs(requestedMods, STATE.roomData || null);

      await runTransaction(db, async (tx) => {
        const now = Date.now();
        const snap = await tx.get(STATE.roomRef);

        if (!snap.exists()) {
          tx.set(STATE.roomRef, {
            players: { black: STATE.playerId, white: null },
            presence: { [STATE.playerId]: { side: "black", lastSeen: now } },
            state: makeFreshState(),
            lastWinnerSide: null,
            matchStartAt: null,
            rematchVotes: {},
            transientMods: buildRoomTransientPayload(),
            transientModsUpdatedAt: now,
            createdAt: now,
            updatedAt: now
          });
          return;
        }

        const data = snap.data() || {};
        let players = data.players || { black: null, white: null };
        let presence = data.presence || {};
        let roomState = data.state || makeFreshState();
        let matchStartAt = data.matchStartAt || null;
        let rematchVotes = data.rematchVotes || {};
        let lastWinnerSide = data.lastWinnerSide || roomState.lastWinnerSide || null;

        if (!roomState.royalLabels) roomState.royalLabels = buildRoyalLabels(lastWinnerSide);

        if (Array.isArray(data.transientMods)) STATE.transientMods = data.transientMods;

        const currentAlready = players.black === STATE.playerId || players.white === STATE.playerId;
        const blackActive = !!players.black && !!presence[players.black] && (now - (presence[players.black].lastSeen || 0) < STALE_MS);
        const whiteActive = !!players.white && !!presence[players.white] && (now - (presence[players.white].lastSeen || 0) < STALE_MS);
        const bothInactive = !blackActive && !whiteActive;

        if (bothInactive && !roomState.winner) {
          players = { black: STATE.playerId, white: null };
          presence = { [STATE.playerId]: { side: "black", lastSeen: now } };
          roomState = makeFreshState();
          matchStartAt = null;
          rematchVotes = {};
        } else if (roomState.winner && bothInactive) {
          players = { black: STATE.playerId, white: null };
          presence = { [STATE.playerId]: { side: "black", lastSeen: now } };
          roomState = makeFreshState();
          matchStartAt = null;
          rematchVotes = {};
        } else if (!currentAlready) {
          if (!blackActive) {
            players.black = STATE.playerId;
            presence[STATE.playerId] = { side: "black", lastSeen: now };
          } else if (!whiteActive) {
            players.white = STATE.playerId;
            presence[STATE.playerId] = { side: "white", lastSeen: now };
          } else {
            presence[STATE.playerId] = { side: "spectator", lastSeen: now };
          }
        } else {
          const side = players.black === STATE.playerId ? "black" : "white";
          presence[STATE.playerId] = { side, lastSeen: now };
        }

        const bothReady = !!players.black && !!players.white;
        if (bothReady && !matchStartAt && !roomState.winner) matchStartAt = now + (STATE.runtime.matchCountdownMs || 3000);

        const update = {
          players,
          presence,
          state: roomState,
          lastWinnerSide,
          matchStartAt,
          rematchVotes,
          updatedAt: now
        };
        if (STATE.activeMods.length) {
          update.transientMods = buildRoomTransientPayload();
          update.transientModsUpdatedAt = now;
        }
        tx.update(STATE.roomRef, update);
      });

      STATE.unsub = onSnapshot(STATE.roomRef, (snap) => {
        if (!snap.exists()) {
          setStatus("ルームが見つからないよ。");
          return;
        }

        const data = snap.data();
        STATE.roomData = data;
        STATE.transientMods = resolvedTransientModsFromRoom(data);
        const players = STATE.roomData.players || {};
        STATE.mySide = players.black === STATE.playerId ? "black" : players.white === STATE.playerId ? "white" : "spectator";

        if (STATE.selected?.kind === "piece") {
          const stillThere = STATE.roomData.state?.pieces?.some(p => p.id === STATE.selected.id);
          if (!stillThere) STATE.selected = null;
        }

        updateMePill();
        const live = STATE.roomData.state || {};
        if (live.winner) setStatus("勝敗がついたよ。");
        else if (!players.black || !players.white) setStatus(`ルーム ${STATE.roomId} に接続中。相手待ちだよ。`);
        else {
          const now = Date.now();
          if (STATE.roomData.matchStartAt && now < STATE.roomData.matchStartAt) setStatus(`ルーム ${STATE.roomId} に接続中。開始カウントダウン中。`);
          else setStatus(`ルーム ${STATE.roomId} に接続中。`);
        }

        if (STATE.transientMods.length) {
          STATE.activeMods = STATE.transientMods.map(m => ({ ...m, source: "transient" }));
          updateRuntimeFromSelection();
          renderActiveModsChips();
          renderGameModPill();
        }

        refreshHands();
        scheduleRender(0);
        if ((STATE.roomData.mode === "cpu" || STATE.roomData.mode === "cpu_serious") && live && !live.winner) scheduleCpuThink();
      });

      setStatus(`ルーム ${roomId} に接続したよ。`);
      scheduleRender(0);
    }

    el.enterBtn.addEventListener("click", persistRoomCode);

    // Mod view close on input "MOD" toggle
    if (/^(MODS?)$/i.test(String(el.roomInput.value || "").trim())) {
      setViewMode("mods");
    } else {
      setViewMode("game");
    }

    // If code contains MOD=, update active mods now.
    if (String(el.roomInput.value || "").includes("MOD=")) {
      selectModsFromRoomInput();
    }

    // initial room render
    renderActiveModsChips();
    renderGameModPill();
    updateModSuggestions();
    updateMePill();
    scheduleRender(0);

    // extra safety for canvas
    setInterval(() => {
      if (STATE.uiMode !== "game") return;
      if (document.hidden) return;
      if (!STATE.boardReady) resizeCanvas();
    }, 5000);
  </script>
</body>
</html>
